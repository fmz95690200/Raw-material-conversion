  exportModalConfirm.addEventListener('click', function(){
    const batchNo = exportBatchInput.value.trim();
    if(!batchNo){
      exportBatchError.classList.remove('hidden');
      exportBatchInput.focus();
      return;
    }
    const includeDerivation = !!exportIncludeDerivation.checked;
    saveLastExportBatch(batchNo);
    printArea.innerHTML = buildExportHtml(batchNo, includeDerivation);
    closeExportModal();
    // 排到下一個事件循環再印，確保 innerHTML 已經真的更新到畫面上
    // （手機瀏覽器有時候會來不及反映最新內容就先開始列印）。
    setTimeout(() => window.print(), 50);
    // 匯出、確認批號的當下，把目前所有已經算好、有效的品名各存一筆
    // 帶批號的歷史紀錄（跟「計算當下」那筆batchNo=null的紀錄分開存，
    // 兩筆都留著，互不取代）。
    products.forEach(p => saveHistoryRows(p, batchNo));
  });

  // =========================================================
  // 查詢歷史紀錄：跟匯出用同一個 Supabase 連線，差別是這裡是「讀取」，
  // RLS 規則允許 anon 查詢（但不允許修改/刪除），所以任何人打開這個
  // 工具都能查得到，但沒辦法改掉或刪掉別人存的紀錄。
  // =========================================================
  const queryHistoryBtn = document.getElementById('queryHistoryBtn');
  const queryModalBackdrop = document.getElementById('queryModalBackdrop');
  const queryModalClose = document.getElementById('queryModalClose');
  const queryModalSearch = document.getElementById('queryModalSearch');
  const queryDateFrom = document.getElementById('queryDateFrom');
  const queryDateTo = document.getElementById('queryDateTo');
  const queryProjectLabel = document.getElementById('queryProjectLabel');
  const queryProductName = document.getElementById('queryProductName');
  const queryBatchNo = document.getElementById('queryBatchNo');
  const queryError = document.getElementById('queryError');
  const queryResultsEl = document.getElementById('queryResults');

  // 取得今天的日期，格式跟 <input type="date"> 要的一樣（YYYY-MM-DD），
  // 開始/結束日期預設都帶入今天，省得每次都要自己點選。
  function todayDateStr(){
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  // 組出「品名」下拉選單的選項：如果有指定製品名，只列出該製品名底下
  // 的品名；沒指定（全部）就把所有製品名裡的品名攤平、去重複後全部列出。
  // 「全部」這個選項 value 是空字串，代表查詢時不加這個篩選條件，
  // 品名欄位留空一樣可以查（查全部），不會因為是下拉選單就變成一定要選。
  function populateProductNameOptions(projectLabelVal){
    const names = [];
    PROJECTS.forEach(proj => {
      if(projectLabelVal && proj.label !== projectLabelVal) return;
      proj.products.forEach(p => {
        if(!names.includes(p.name)) names.push(p.name);
      });
    });
    queryProductName.innerHTML = '<option value="">全部</option>' +
      names.map(n => `<option value="${n}">${n}</option>`).join('');
  }

  function populateProjectLabelOptions(){
    // 依英文字母 A-Z 排序（用 localeCompare 比較，忽略大小寫），
    // 不照 PROJECTS 陣列原本的設定順序列出。
    const sortedLabels = PROJECTS.map(proj => proj.label)
      .sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
    queryProjectLabel.innerHTML = '<option value="">全部</option>' +
      sortedLabels.map(label => `<option value="${label}">${label}</option>`).join('');
  }

  // 製品名一改變，品名選單要跟著換成該製品名底下的品名選項。
  queryProjectLabel.addEventListener('change', function(){
    populateProductNameOptions(queryProjectLabel.value);
  });

  function openQueryModal(){
    queryError.classList.add('hidden');
    // 每次打開預設帶入「目前這個製品名」，省得每次都要自己選一次；
    // 使用者仍然可以改選「全部」或其他製品名。
    populateProjectLabelOptions();
    const proj = PROJECTS.find(pr => pr.id === currentProjectId);
    queryProjectLabel.value = proj ? proj.label : '';
    populateProductNameOptions(queryProjectLabel.value);
    queryProductName.value = '';
    queryBatchNo.value = '';
    // 開始/結束日期預設都是今天，通常是想查「今天存了哪些紀錄」；
    // 要查更早的資料，自己改開始日期就好。
    const today = todayDateStr();
    queryDateFrom.value = today;
    queryDateTo.value = today;
    queryResultsEl.innerHTML = '';
    queryModalBackdrop.classList.remove('hidden');
  }
  function closeQueryModal(){
    queryModalBackdrop.classList.add('hidden');
  }
  if(queryHistoryBtn) queryHistoryBtn.addEventListener('click', openQueryModal);
  queryModalClose.addEventListener('click', closeQueryModal);
  queryModalBackdrop.addEventListener('click', function(e){
    if(e.target === queryModalBackdrop) closeQueryModal();
  });

  function fmtQueryNum(v){
    if(v === null || v === undefined) return '—';
    const n = Number(v);
    const r2 = Math.round(n * 100) / 100;
    return (Math.abs(r2 - Math.round(r2)) < 1e-9) ? String(Math.round(r2)) : r2.toFixed(2);
  }

  async function runHistoryQuery(){
    if(!sb){
      queryError.textContent = '目前無法連線到歷史紀錄資料庫，請稍後再試。';
      queryError.classList.remove('hidden');
      return;
    }
    queryError.classList.add('hidden');
    queryResultsEl.innerHTML = '<div class="query-results-meta">查詢中…</div>';

    let q = sb.from(HISTORY_TABLE).select('*').order('created_at', { ascending: false }).limit(300);
    const from = queryDateFrom.value;
    const to = queryDateTo.value;
    const projectLabelVal = queryProjectLabel.value.trim();
    const productNameVal = queryProductName.value.trim();
    const batchNoVal = queryBatchNo.value.trim();
    // 開始日期用當天 00:00，結束日期用「隔一天的00:00之前」，這樣結束
    // 日期當天整天的紀錄才會包含進去（不會因為只比到日期本身的00:00
    // 而漏掉當天下午才存的紀錄）。
    if(from) q = q.gte('created_at', `${from}T00:00:00`);
    if(to){
      const toDate = new Date(`${to}T00:00:00`);
      toDate.setDate(toDate.getDate() + 1);
      q = q.lt('created_at', toDate.toISOString());
    }
    if(projectLabelVal) q = q.ilike('project_label', `%${projectLabelVal}%`);
    if(productNameVal) q = q.ilike('product_name', `%${productNameVal}%`);
    if(batchNoVal) q = q.ilike('batch_no', `%${batchNoVal}%`);

    try{
      const { data, error } = await q;
      if(error) throw error;
      if(!data || !data.length){
        queryResultsEl.innerHTML = '<div class="query-results-meta">查無符合條件的歷史紀錄。</div>';
        return;
      }
      // 先把每一列的「含量」「力價」「水份」算出來，才能知道這次查詢
      // 結果裡，這三欄是不是整欄都沒有值（例如查Heparin時「含量」跟
      // 「水份」整欄都是—，查INON GREEN時「力價」整欄都是—）。整欄
      // 都沒有值的欄位，直接不顯示，省下沒必要佔用的版面空間。
      const rowsParsed = data.map(r => {
        const time = r.created_at ? new Date(r.created_at).toLocaleString('zh-TW', { hour12:false }) : '—';
        // 「含量」跟「力價」拆成兩個獨立欄位：同一列只會有其中一欄有
        // 數字，另一欄顯示「—」，依這筆紀錄自己存的 content_label 裡
        // 有沒有「力價」兩個字來判斷要放進哪一欄（Heparin、ADC這類
        // 品名的欄位名稱本來就叫力價，就會歸進力價欄；其他預設叫
        // 「含量%」的品名就歸進含量欄）。
        let contentCell = '—';
        let potencyCell = '—';
        if(r.content_value != null){
          const label = r.content_label || '含量%';
          const unit = label.indexOf('%') !== -1 ? '%' : '';
          const num = fmtQueryNum(r.content_value) + unit;
          if(label.indexOf('力價') !== -1){
            potencyCell = num;
          } else {
            contentCell = num;
          }
        }
        const waterCell = r.water_value != null ? fmtQueryNum(r.water_value) + '%' : '—';
        return { r, time, contentCell, potencyCell, waterCell };
      });
      const anyContentCol = rowsParsed.some(x => x.contentCell !== '—');
      const anyPotencyCol = rowsParsed.some(x => x.potencyCell !== '—');
      const anyWaterCol = rowsParsed.some(x => x.waterCell !== '—');

      const rowsHtml = rowsParsed.map(({r, time, contentCell, potencyCell, waterCell}) => {
        return `<tr>
          <td class="qc-time"><span class="qc-cell-text">${time}</span></td>
          <td class="qc-project"><span class="qc-cell-text">${r.project_label || '—'}</span></td>
          <td class="qc-product"><span class="qc-cell-text">${r.product_name || '—'}</span></td>
          <td>${r.batch_no || '（未填）'}</td>
          <td>${r.group_index || '—'}/${r.group_count || '—'}</td>
          <td>${fmtQueryNum(r.usage_value)}${r.usage_unit ? ' '+r.usage_unit : ''}</td>
          ${anyContentCol ? `<td>${contentCell}</td>` : ''}
          ${anyPotencyCol ? `<td>${potencyCell}</td>` : ''}
          ${anyWaterCol ? `<td>${waterCell}</td>` : ''}
          <td>${fmtQueryNum(r.std_value)}${r.std_unit ? ' '+r.std_unit : ''}</td>
        </tr>`;
      }).join('');
      // 時間／製品名／品名這三欄內容通常很長（尤其是製品名跟完整時間戳記），
      // 佔掉大部分螢幕寬度，其他欄位（批號、使用量...）就要一直往右滑才看得到。
      // 幫這三欄各自加一個「收起／展開」小三角形：收起時欄寬只跟標題文字
      // 一樣窄（用省略號截斷內容），展開時恢復完整顯示，讓使用者自己選擇
      // 要優先看哪些欄位，不用整張表都攤開才能捲動。
      queryResultsEl.innerHTML = `
        <div class="query-results-meta">共 ${data.length} 筆（最多顯示300筆）</div>
        <div class="query-table-scroll">
          <table class="query-table" id="queryResultTable">
            <thead><tr>
              <th class="qc-time"><span>時間</span><button type="button" class="qc-toggle" data-col="qc-time" aria-label="收起/展開時間欄">◀</button></th>
              <th class="qc-project"><span>製品名</span><button type="button" class="qc-toggle" data-col="qc-project" aria-label="收起/展開製品名欄">◀</button></th>
              <th class="qc-product"><span>品名</span><button type="button" class="qc-toggle" data-col="qc-product" aria-label="收起/展開品名欄">◀</button></th>
              <th>批號</th><th>分析號碼</th><th>使用量</th>
              ${anyContentCol ? '<th>含量</th>' : ''}
              ${anyPotencyCol ? '<th>力價</th>' : ''}
              ${anyWaterCol ? '<th>水份</th>' : ''}
              <th>標準值</th>
            </tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
      wireQueryColumnToggles();
    } catch(e){
      queryError.textContent = '查詢失敗，請確認網路連線後再試一次。';
      queryError.classList.remove('hidden');
      queryResultsEl.innerHTML = '';
      console.warn('歷史紀錄查詢失敗：', e);
    }
  }
  queryModalSearch.addEventListener('click', runHistoryQuery);

  // 幫查詢結果表格裡「時間／製品名／品名」這三個欄位的收起/展開小三角形
  // 綁點擊事件。因為表格每次查詢都會整個重新產生（innerHTML整段換掉），
  // 每次查完都要重新綁一次，不能只綁一次就沒事。
  function wireQueryColumnToggles(){
    const table = document.getElementById('queryResultTable');
    if(!table) return;
    table.querySelectorAll('.qc-toggle').forEach(btn => {
      btn.addEventListener('click', function(){
        const col = btn.dataset.col;
        const collapsed = table.classList.toggle(`collapsed-${col}`);
        // 三角形固定是「◀」這個符號，收起時用CSS轉90度變成指向右邊，
        // 代表「按這裡可以再展開回來」，不用換成不同的符號字元。
        btn.classList.toggle('is-collapsed', collapsed);
      });
    });
  }

  // =========================================================
  // renderApp：切換下拉選單時，整頁品名卡片重新產生
  // =========================================================
  // 結果表表頭：含量／力價%（標示值）欄位的名稱，若品名有 basisToggle，
  // 用目前切換到的那個基準的名稱；抽成獨立函式，切換基準鈕按下去時
  // 也要重新呼叫這個函式，讓表頭文字跟著換。
  function buildResultHeader(){
    const anyContent = products.some(p => p.hasContent !== false);
    const anyWater = products.some(p => p.hasWater);
    const anyRowRatio = products.some(p => p.rowRatio);
    const contentLabels = [...new Set(
      products.filter(p => p.type !== 'complement' && p.hasContent !== false)
              .map(p => {
                const bc = getBasisCfg(p);
                return ((bc && bc.contentLabel) || p.contentLabel || '含量%').replace('%','');
              })
    )];
    const contentHeader = contentLabels.length ? contentLabels.join('／') : '含量';
    const rowRatioLabels = [...new Set(
      products.filter(p => p.type !== 'complement' && p.rowRatio)
              .map(p => {
                const bc = getBasisCfg(p);
                return (bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%';
              })
    )];
    const rowRatioHeader = rowRatioLabels.length ? rowRatioLabels.join('／') : '力價%';
    resultHeadRow.innerHTML = `
      ${products.length > 1 ? '<th></th>' : ''}<th class="col-analysis">分析號碼</th><th>使用量</th>
      ${anyContent ? `<th>${contentHeader}</th>` : ''}
      ${anyWater ? '<th>水份</th>' : ''}
      ${anyRowRatio ? `<th>${rowRatioHeader}</th>` : ''}<th>標準值</th>
    `;
  }

  function renderApp(project){
    products = project.products.map((p, idx) => {
      const merged = Object.assign({key: 'p'+idx, _Y: 0, _scrolled: false}, p);
      if(merged.ratioNum != null && merged.ratioDen != null){
        merged.ratio = merged.ratioNum / merged.ratioDen;
      }
      if(merged.basisToggle){
        merged._basis = merged.basisDefault || merged.basisToggle[0].key;
        merged._basisCache = {};
      }
      return merged;
    });
    resultsState = {};

    const anyWater = products.some(p => p.hasWater);
    const anyContent = products.some(p => p.hasContent !== false);
    const anyRowRatio = products.some(p => p.rowRatio);
    products.forEach(p => { p._anyWater = anyWater; p._anyContent = anyContent; p._anyRowRatio = anyRowRatio; });

    // 品名清單
    productsSub.innerHTML = products
      .map((p,i) => `<span><span class="ps-label">品名${products.length>1 ? (i+1) : ''}</span>：${p.name}</span>`)
      .join('');

    // 結果卡片內、表格上方的品名對照：不論項目底下有幾個品名都會顯示，
    // 只有一個品名時標示「品名」，多個品名時標示「品名1」「品名2」...
    nameLegend.innerHTML = products
      .map((p,i) => `<span><span class="ps-label">${products.length>1 ? '品名'+(i+1) : '品名'}</span>：<b>${p.name}</b></span>`)
      .join('');

    // 「推導過程」鍵：只有在項目設定裡標記 showDerivation:true 才會顯示
    // （目前只有 HEPARIN SODIUM OINTMENT 這個項目用到，之後如需為其他
    // 項目開啟，只要在該項目設定加上 showDerivation:true 即可）
    derivationBtn.classList.toggle('hidden', !project.showDerivation);
    derivationBtn.textContent = '推導過程';
    derivationPanel.classList.add('hidden');
    derivationPanel.innerHTML = '';

    // 結果表表頭（含量欄位若整個項目都沒用到，整欄不顯示；水份欄位同理）
    buildResultHeader();

    // 品名卡片
    let html = '';
    products.forEach((p, i) => {
      const isComplement = (p.type === 'complement');
      const isEditableTotal = !!p.editableStandardTotal;
      const isEditableRatio = !isComplement && !!p.editableRatio;
      const stdUnit = p.standardUnit || p.complementUnit || '';
      const ratioLabel = p.ratioLabel || '係數';

      const { formulaHtml, subFormulaHtml, formulaNoteText, noteLineHtml, formulaIntroHtml } = buildFormulaBoxParts(p);

      const yLabelText = '分析號碼數量';
      const stdPlaceholder = p.standardPlaceholder != null ? p.standardPlaceholder : 450;
      const stdFieldHtml = isEditableTotal ? `
        <div>
          <label for="std-${p.key}">標準值${stdUnit ? `(${stdUnit})` : ''}</label>
          <div class="field-with-preset">
            <input type="number" step="any" id="std-${p.key}" placeholder="例:${stdPlaceholder}">
            <button type="button" class="btn-preset" id="stdPreset-${p.key}" data-preset="${stdPlaceholder}">預設</button>
          </div>
        </div>
      ` : '';

      const ratioPlaceholder = p.ratioPlaceholder != null ? p.ratioPlaceholder : 1;
      const ratioFieldHtml = isEditableRatio ? `
        <div>
          <label for="ratio-${p.key}">${ratioLabel}</label>
          <div class="field-with-preset">
            <input type="number" step="any" id="ratio-${p.key}" placeholder="例:${ratioPlaceholder}">
            <button type="button" class="btn-preset" id="ratioPreset-${p.key}" data-preset="${ratioPlaceholder}">預設</button>
          </div>
        </div>
      ` : '';

      // 標準值／係數這類欄位放在「確定」按鈕之後、第一組組別欄位之前，
      // 而且永遠可以編輯（不會因為按過確定就鎖住）：這樣需要臨時修改
      // 某個數字再重算時，只要改完直接按「計算」就好，不用整個清除重填。
      //
      // 補充欄位（標準值／係數）跟「計算」鍵，在使用者按過「確定」之前先隱藏起來，
      // 避免第一次使用的人一次看到太多按鍵、欄位而不知所措。
      const extraFieldsRowHtml = (isEditableTotal || isEditableRatio) ? `
        <div class="extra-fields-row hidden" id="extra-${p.key}">
          ${stdFieldHtml}
          ${ratioFieldHtml}
        </div>
      ` : '';

      const stepAndGroupsHtml = `
        <div class="step">
          <div>
            <label for="y-${p.key}">${yLabelText}</label>
            <input type="number" id="y-${p.key}" min="1" max="7" step="1" placeholder="例:2">
          </div>
          <button class="btn-primary" id="confirm-${p.key}" style="background:${idxColor(i)};color:#fff;">確定</button>
          <button class="btn-clear-small" id="clear-${p.key}">清除</button>
        </div>
        ${extraFieldsRowHtml}
        <div class="groups" id="groups-${p.key}"></div>
      `;

      const bcCard = getBasisCfg(p);
      const basisToggleBtnHtml = p.basisToggle
        ? `<button type="button" class="btn-basis-toggle" id="basisToggle-${p.key}">${bcCard.label} ⇄</button>`
        : '';
      // 「範例」按鈕：只要品名設定了 exampleImageKey 就會出現，跟
      // basisToggle（VitA／VitD3 切換）是各自獨立的功能，不互相依賴。
      const exampleBtnHtml = p.exampleImageKey
        ? `<button type="button" class="btn-diagram" id="exampleBtn-${p.key}">範例</button>`
        : '';
      const cardExtraRowHtml = (basisToggleBtnHtml || exampleBtnHtml) ? `
        <div class="basis-toggle-row">
          ${basisToggleBtnHtml}
          ${exampleBtnHtml}
        </div>
      ` : '';

      html += `
        <section class="product-card" id="card-${p.key}">
          <div class="card-header">
            <h2>${products.length>1 ? '品名：' : ''}${p.name}</h2>
            <button type="button" class="btn-toggle-card" id="toggle-${p.key}" aria-label="收起／展開">▼</button>
          </div>
          ${cardExtraRowHtml}
          <div class="formula">
            ${formulaIntroHtml}
            ${noteLineHtml}
            <div class="formula-row">${formulaHtml}</div>
            ${subFormulaHtml ? `<div class="formula-row">${subFormulaHtml}</div>` : ''}
          </div>
          <div class="collapsible-body" id="body-${p.key}">
            ${formulaNoteText ? `
              <button type="button" class="btn-note-toggle" id="noteToggle-${p.key}">說明 <span class="note-arrow">▼</span></button>
              <div class="note formula-note-body hidden" id="noteBody-${p.key}">${formulaNoteText}</div>
            ` : ''}
            ${stepAndGroupsHtml}
            <div class="action-row hidden" id="action-${p.key}">
              <button class="btn-calc-small" id="calc-${p.key}">計算</button>
            </div>
            <div class="error" id="err-${p.key}"></div>
            <div class="soft-warning hidden" id="warn-${p.key}"></div>
          </div>
        </section>
      `;
    });
    productsContainer.innerHTML = html;

    resultBody.innerHTML = '';
    resultCard.classList.add('hidden');

    // 綁定事件
    products.forEach(p => {
      const isComplement = (p.type === 'complement');
      const errEl = document.getElementById(`err-${p.key}`);
      const warnEl = document.getElementById(`warn-${p.key}`);
      const calcBtn = document.getElementById(`calc-${p.key}`);
      const clearBtn = document.getElementById(`clear-${p.key}`);
      const yInput = document.getElementById(`y-${p.key}`);
      const confirmBtn = document.getElementById(`confirm-${p.key}`);
      const groupsEl = document.getElementById(`groups-${p.key}`);
      const stdInputEl = document.getElementById(`std-${p.key}`);
      const ratioInputEl = document.getElementById(`ratio-${p.key}`);
      const extraRowEl = document.getElementById(`extra-${p.key}`);
      const actionRowEl = document.getElementById(`action-${p.key}`);
      const stdPresetBtn = document.getElementById(`stdPreset-${p.key}`);
      const ratioPresetBtn = document.getElementById(`ratioPreset-${p.key}`);
      const toggleCardBtn = document.getElementById(`toggle-${p.key}`);
      const bodyEl = document.getElementById(`body-${p.key}`);

      // 收起/展開：收起時只留品名跟公式，其餘欄位、按鍵、結果都先藏起來，
      // 方便畫面上有多個品名時可以先收起暫時不用的品名，減少捲動負擔。
      if(toggleCardBtn && bodyEl){
        toggleCardBtn.addEventListener('click', function(){
          const collapsed = bodyEl.classList.toggle('hidden');
          toggleCardBtn.classList.toggle('is-collapsed', collapsed);
        });
      }

      // 「VitA基準／VitD3基準」切換鈕：只有設定了 basisToggle 的品名才會有
      // 這顆按鈕（目前沒有品名在用 basisToggle，見設定區的說明）。
      // 切換時：
      //   1) 先把目前這個基準底下已經填的「標示值」「力價%」「使用量」
      //      存進 p._basisCache，之後切回這個基準可以還原，不用重填。
      //   2) 換成另一個基準，公式框、每組輸入欄位的名稱／預設值都要跟著換。
      //   3) 如果新基準之前有存過快取，直接還原回去；沒有的話留空
      //      （可以按輸入框旁邊的「預設」快速鍵重新帶入預設標示值）。
      //   4) 換基準代表「含量」的實際意義變了，之前算出來的結果不再適用，
      //      清掉、請使用者重新按一次「計算」。
      const basisToggleBtn = document.getElementById(`basisToggle-${p.key}`);
      const exampleBtn = document.getElementById(`exampleBtn-${p.key}`);
      const formulaBoxEl = document.querySelector(`#card-${p.key} .formula`);

      if(basisToggleBtn && p.basisToggle){
        basisToggleBtn.addEventListener('click', function(){
          const count = p._Y || 0;
          p._basisCache = p._basisCache || {};
          if(count > 0){
            p._basisCache[p._basis] = captureGroupValues(count);
          }

          const otherCfg = p.basisToggle.find(b => b.key !== p._basis) || p.basisToggle[0];
          p._basis = otherCfg.key;
          basisToggleBtn.textContent = `${otherCfg.label} ⇄`;

          if(formulaBoxEl){
            const parts = buildFormulaBoxParts(p);
            formulaBoxEl.innerHTML = `
              ${parts.formulaIntroHtml}
              ${parts.noteLineHtml}
              <div class="formula-row">${parts.formulaHtml}</div>
              ${parts.subFormulaHtml ? `<div class="formula-row">${parts.subFormulaHtml}</div>` : ''}
            `;
          }

          if(count > 0){
            buildGroups(groupsEl, count, p);
            const cached = p._basisCache[p._basis];
            if(cached) restoreGroupValues(cached, count);
          }

          resultsState[p.key] = null;
          const autoBoxEl = document.getElementById(`autoUsage-${p.key}`);
          if(autoBoxEl){
            autoBoxEl.textContent = '計算後自動回推';
            autoBoxEl.classList.remove('filled');
          }
          if(warnEl){ warnEl.textContent = ''; warnEl.classList.add('hidden'); }
          renderResults();
          buildResultHeader();
          persistState();
        });
      }

      // 「範例」按鈕：顯示這個品名設定的範例照片（p.exampleImageKey），
      // 跟 basisToggle 完全無關，只要有設定 exampleImageKey 就會出現。
      if(exampleBtn && p.exampleImageKey){
        exampleBtn.addEventListener('click', function(){
          openImageModal('範例', p.exampleImageKey);
        });
      }

      // 「說明」按鈕：預設收起，點一下展開補差型品名的詳細規則說明，
      // 再點一次收回，沒有框線跟底色，只有文字＋三角形。
      const noteToggleBtn = document.getElementById(`noteToggle-${p.key}`);
      const noteBodyEl = document.getElementById(`noteBody-${p.key}`);
      if(noteToggleBtn && noteBodyEl){
        noteToggleBtn.addEventListener('click', function(){
          const isHidden = noteBodyEl.classList.toggle('hidden');
          noteToggleBtn.classList.toggle('is-open', !isHidden);
        });
      }

      // 「預設」鍵：改成「按一下投入預設值、再按一下清除」這種切換式行為，
      // 而不是只能單向填入。判斷方式很單純：如果輸入框目前的值剛好等於
      // 預設值，代表這次要清除；否則就填入預設值。這樣不管按幾次都會
      // 一填一清交替下去，不用另外記錄「按了幾次」的狀態。
      function togglePreset(inputEl, presetStr){
        const current = inputEl.value.trim();
        if(current !== '' && Number(current) === Number(presetStr)){
          inputEl.value = '';
        } else {
          inputEl.value = presetStr;
        }
        persistState();
      }

      if(stdPresetBtn && stdInputEl){
        stdPresetBtn.addEventListener('click', function(){
          togglePreset(stdInputEl, stdPresetBtn.dataset.preset);
        });
      }
      if(ratioPresetBtn && ratioInputEl){
        ratioPresetBtn.addEventListener('click', function(){
          togglePreset(ratioInputEl, ratioPresetBtn.dataset.preset);
        });
      }

      // 任何欄位輸入時都即時儲存目前狀態，避免手機/電腦版切換時資料消失
      groupsEl.addEventListener('input', persistState);
      if(stdInputEl) stdInputEl.addEventListener('input', persistState);
      if(ratioInputEl) ratioInputEl.addEventListener('input', persistState);

      // 力價%這類「每組各自輸入」的比例欄位，旁邊的「預設」字樣按鈕：
      // 用事件委派綁在 groupsEl 上（而不是每個按鈕各自綁一次），因為
      // buildGroups 每次重新產生分析號碼欄位時，裡面的按鈕都是全新的
      // DOM節點，綁在 groupsEl 這個外層容器上才不會失效。同樣是切換式：
      // 按一下投入預設值、再按一下清除。
      groupsEl.addEventListener('click', function(e){
        const btn = e.target.closest('.btn-row-preset');
        if(!btn) return;
        const i = btn.dataset.i;
        const input = groupsEl.querySelector(`.ratio-input[data-i="${i}"]`);
        if(input){
          togglePreset(input, btn.dataset.preset);
        }
      });

      // 「分析號碼數量」改成隨時可以修改，不會因為按過一次「確定」就鎖住。
      // 重新產生欄位時盡量保留原本已經填好的參數：
      //   - 組數增加：原本已填的組別（含量%／水份%／使用量）都保留，
      //     多出來的新組別留空；原本的「最後一組」如果不再是最後一組，
      //     會變成一般組別，含量%／水份%保留，但使用量要重新手動輸入
      //     （因為它原本是系統自動回推欄位，本來就沒有使用量可以保留）。
      //   - 組數減少：保留的組別（前面 N 組）維持原值；被刪掉的組別
      //     直接捨棄。原本保留下來的最後一組如果變成新的「最後一組」，
      //     它的使用量欄位會變回自動回推，不需要保留原本手動填的使用量。
      function captureGroupValues(count){
        const arr = [];
        for(let i=0;i<count;i++){
          const usageEl = groupsEl.querySelector(`.usage-input[data-i="${i}"]`);
          const contentEl = groupsEl.querySelector(`.content-input[data-i="${i}"]`);
          const waterEl = groupsEl.querySelector(`.water-input[data-i="${i}"]`);
          const ratioEl = groupsEl.querySelector(`.ratio-input[data-i="${i}"]`);
          arr.push({
            usage: usageEl ? usageEl.value : '',
            content: contentEl ? contentEl.value : '',
            water: waterEl ? waterEl.value : '',
            ratio: ratioEl ? ratioEl.value : ''
          });
        }
        return arr;
      }

      function restoreGroupValues(savedValues, newCount){
        const restoreCount = Math.min(savedValues.length, newCount);
        for(let i=0;i<restoreCount;i++){
          const saved = savedValues[i];
          const isNewLast = (i === newCount - 1);
          const contentEl = groupsEl.querySelector(`.content-input[data-i="${i}"]`);
          const waterEl = groupsEl.querySelector(`.water-input[data-i="${i}"]`);
          const ratioEl = groupsEl.querySelector(`.ratio-input[data-i="${i}"]`);
          if(contentEl && saved.content !== '') contentEl.value = saved.content;
          if(waterEl && saved.water !== '') waterEl.value = saved.water;
          if(ratioEl && saved.ratio !== '') ratioEl.value = saved.ratio;
          if(!isNewLast){
            const usageEl = groupsEl.querySelector(`.usage-input[data-i="${i}"]`);
            if(usageEl && saved.usage !== '') usageEl.value = saved.usage;
          }
        }
      }

      confirmBtn.addEventListener('click', function(){
        errEl.textContent = '';

        const val = parseInt(yInput.value, 10);
        if(!val || val < 1){
          errEl.textContent = '請輸入大於等於 1 的整數。';
          return;
        }
        if(val > 7){
          errEl.textContent = '分析號碼數量不可超過 7 組。';
          return;
        }

        const oldY = p._Y || 0;
        const savedValues = oldY > 0 ? captureGroupValues(oldY) : [];

        p._Y = val;
        buildGroups(groupsEl, val, p);
        restoreGroupValues(savedValues, val);

        // 組數改變後，之前算出來的結果已經對不上新的欄位了，先清掉，
        // 等使用者重新按「計算」再產生新的結果。
        resultsState[p.key] = null;
        renderResults();

        // 確定後才顯示這個品名的其他輸入欄位（標準值／係數）與「計算」鍵，
        // 避免第一次使用的人一次看到太多按鍵、欄位而不知所措。
        if(extraRowEl) extraRowEl.classList.remove('hidden');
        if(actionRowEl) actionRowEl.classList.remove('hidden');

        // 若這個品名在此組數下完全沒有欄位需要手動輸入（例如分析號碼數量=1，
        // 又沒有含量%、沒有水份%），就不需要使用者再按一次「計算」，直接算出結果。
        if(needsNoInput(p, val)){
          calcBtn.click();
        }
        persistState();
      });

      calcBtn.addEventListener('click', function(){
        errEl.textContent = '';
        if(warnEl){ warnEl.textContent = ''; warnEl.classList.add('hidden'); }
        try{
          // 標準值／係數這類欄位永遠可以編輯，每次按「計算」都重新讀取目前
          // 畫面上的數字，這樣臨時要改某個數值再重算，不用清除重填。
          if(p.editableStandardTotal){
            const stdRaw = stdInputEl ? stdInputEl.value.trim() : '';
            const stdVal = parseFloat(stdRaw);
            if(stdRaw === '' || isNaN(stdVal)){
              throw new Error('請輸入有效的標準值。');
            }
            if(isComplement){
              p.complementTotal = stdVal;
            } else {
              p.standardTotal = stdVal;
            }
          }
          if(p.editableRatio){
            const ratioRaw = ratioInputEl ? ratioInputEl.value.trim() : '';
            const ratioVal = parseFloat(ratioRaw);
            if(ratioRaw === '' || isNaN(ratioVal)){
              throw new Error(`請輸入有效的${p.ratioLabel || '係數'}。`);
            }
            p.ratio = ratioVal;
          }

          // 補差型品名（例如 Lactose）依賴參照品名（例如 Sucralfate）的結果，
          // 所以每次按「計算」都順便幫使用者重新按一次參照品名的「計算」鍵，
          // 確保用的是參照品名「目前」欄位裡的數字，而不是它上一次算出來、
          // 可能已經過時的舊結果（例如使用者後來又改了 Sucralfate 的數字，
          // 但忘記重新按 Sucralfate 自己的計算鍵）。
          if(isComplement){
            const refProduct = products.find(x => x.name === p.referTo);
            if(refProduct){
              const refCalcBtn = document.getElementById(`calc-${refProduct.key}`);
              if(refCalcBtn) refCalcBtn.click();
            }
          }

          resultsState[p.key] = isComplement
            ? calcComplementProduct(p, groupsEl)
            : calcStandardProduct(p, groupsEl);
          renderResults();

          // 含量%超過100%不擋計算，只是提醒使用者再確認一次數字有沒有填錯
          // （例如多打一位數，或跟水份%填反了）。
          const overRows = resultsState[p.key]
            .map((r,idx) => r.contentOver100 ? (idx+1) : null)
            .filter(n => n !== null);
          if(warnEl){
            if(overRows.length){
              const bcWarn = getBasisCfg(p);
              const cLabelText = ((bcWarn && bcWarn.contentLabel) || p.contentLabel || '含量%').replace('%','');
              const rowsText = overRows.length === 1 ? `第 ${overRows[0]} 組` : `第 ${overRows.join('、')} 組`;
              warnEl.textContent = `⚠ ${rowsText}的${cLabelText}%超過 100%，請再次確認數字是否填寫正確（計算仍會照填入的數字進行）。`;
              warnEl.classList.remove('hidden');
            } else {
              warnEl.textContent = '';
              warnEl.classList.add('hidden');
            }
          }

          // 把回推出來的使用量，用紅字顯示在最後一組原本寫「計算後自動回推」的欄位裡，
          // 欄位背景不變，只是把提示文字換成實際算出來的數字。
          const data = resultsState[p.key];
          const autoBoxEl = document.getElementById(`autoUsage-${p.key}`);
          if(autoBoxEl && data && data.length){
            autoBoxEl.textContent = data[data.length-1].usage.toFixed(2);
            autoBoxEl.classList.add('filled');
          }

          // 只有「清除後的第一次計算」才自動跳轉到結果表格；同一次確定期間
          // 之後不管修改什麼欄位再按計算，畫面都不會再跳轉，除非按了清除／
          // 全部清除重置這個標記。閃爍提示則不受此限制，每次都會出現。
          if(!p._scrolled){
            smoothScrollToElement(resultCard);
            p._scrolled = true;
          }
          resultCard.classList.remove('flash-highlight');
          void resultCard.offsetWidth; // 強制重新排版，讓動畫可以重新觸發
          resultCard.classList.add('flash-highlight');
          persistState();
          // 只要這次算出來的是有效的紅字結果，就順便存一筆歷史紀錄
          // （這時候還沒有批號，batchNo傳null；真正匯出時會再存一次
          // 帶批號的版本）。這一步失敗也不影響上面的計算/畫面更新。
          saveHistoryRows(p, null);
        } catch(err){
          errEl.textContent = err.message || '輸入有誤，請檢查所有欄位是否已填寫且為有效數字。';
        }
      });

      clearBtn.addEventListener('click', function(){
        p._Y = 0;
        p._scrolled = false;
        yInput.value = '';
        yInput.disabled = false;
        confirmBtn.disabled = false;
        if(stdInputEl){ stdInputEl.value = ''; stdInputEl.disabled = false; }
        if(ratioInputEl){ ratioInputEl.value = ''; ratioInputEl.disabled = false; }
        if(extraRowEl) extraRowEl.classList.add('hidden');
        if(actionRowEl) actionRowEl.classList.add('hidden');
        groupsEl.innerHTML = '';
        errEl.textContent = '';
        if(warnEl){ warnEl.textContent = ''; warnEl.classList.add('hidden'); }
        resultsState[p.key] = null;
        renderResults();
        persistState();
      });
    });

    restoreState(project);
  }

  // ---------- 初始載入：優先還原上次選到的項目；沒有的話預設顯示 NAZAL SPRAY ----------
  loadKeepParamsSetting();
  const savedAll = loadAll();
  const DEFAULT_HOME_PROJECT_ID = 'nazal_spray_lavender';
  const initialProject = (savedAll.lastProjectId && PROJECTS.find(p => p.id === savedAll.lastProjectId))
    || PROJECTS.find(p => p.id === DEFAULT_HOME_PROJECT_ID)
    || PROJECTS[0];
  currentProjectId = initialProject.id;
  updateTriggerDisplay(initialProject);
  renderApp(initialProject);
})();
</script>

</body>
</html>
