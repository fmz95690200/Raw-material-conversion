<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原料換算</title>
<style>
  :root{
    --ink:#1f2a24;
    --paper:#f6f4ee;
    --line:#c9c2b2;
    --accent:#3f6b4a;
    --accent-dark:#2c4d34;
    --danger:#8a3b2b;
    --danger-dark:#6e2e21;
    --cell:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:20px 12px 60px;
  }
  /* ---------- 深色模式：整頁反相 + 轉回原本色相 ----------
     這個做法不用把檔案裡上百個寫死的顏色一個個改成深色版本：
     invert(1) 先把整張畫面明暗互換（白底變黑底、深字變淺字），
     再用 hue-rotate(180deg) 把顏色的色相轉回接近原本的樣子（例如
     原本的綠色反相後會變成品紅色，180度轉回來後大致還是綠色調），
     整體效果等於「保留原本配色的深色版」，且未來調整任何顏色都
     不用額外維護一份深色對照表。太陽/月亮圖示、圓角陰影等少數
     地方另外用同樣的濾鏡反向抵銷回來，維持原本顏色不受影響。 */
  /* 深色模式：filter 濾鏡如果直接放在 body 上，body 就會變成底下所有
     position:fixed 元素（例如彈窗 .modal-backdrop）的定位基準，不再是
     整個瀏覽器視窗——這會導致彈窗（範例圖、標示值圖…）跑到頁面很下面
     或很上面，而不是固定在畫面中央。改成濾鏡只套用在 .wrap（一般畫面
     內容）上，彈窗另外自己套用同一個濾鏡（讓彈窗內容看起來也是深色
     配色），但彈窗本身仍然是 body 的直接子層、沒有濾鏡的父層擋著，
     固定定位才會正確地相對於整個視窗，不會跑位。 */
  body.dark-mode{
    background:#0b0d0a;
  }
  body.dark-mode .wrap{
    filter:invert(1) hue-rotate(180deg);
  }
  body.dark-mode .modal-backdrop{
    filter:invert(1) hue-rotate(180deg);
  }
  body.dark-mode ::selection{background:#555;}
  .wrap{max-width:640px;margin:0 auto;}

  .title-cn{font-size:1.5rem;font-weight:700;letter-spacing:0.06em;margin:0;}

  .top-bar{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    flex-wrap:wrap;margin-bottom:10px;
  }

  /* ---------- 自訂下拉選單（切換項目） ---------- */
  .project-select-wrap{margin-bottom:10px;}
  .project-select-wrap > label{
    display:block;font-size:0.8rem;color:#5b5346;margin-bottom:4px;
  }
  .custom-select{position:relative;}
  .cs-trigger{
    width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:8px 30px 8px 10px;border:1px solid var(--line);border-radius:5px;
    background:#fffef9;cursor:pointer;position:relative;text-align:left;
    font-family:inherit;
  }
  .cs-trigger-label{font-size:0.85rem;font-weight:600;color:var(--accent-dark);line-height:1.3;}
  .cs-trigger-cn{font-size:0.72rem;color:#7a7263;line-height:1.2;}
  .cs-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:0.75rem;color:#7a7263;}
  .cs-list{
    position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
    border:1px solid var(--line);border-radius:5px;max-height:280px;overflow-y:auto;
    z-index:20;box-shadow:0 4px 10px rgba(0,0,0,0.1);
  }
  .cs-option{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f0ede2;}
  .cs-option:last-child{border-bottom:none;}
  .cs-option:hover,.cs-option.active{background:#f2f0e8;}
  .cs-option-label{font-size:0.83rem;font-weight:600;color:var(--accent-dark);line-height:1.3;}
  .cs-option-cn{font-size:0.7rem;color:#7a7263;margin-top:1px;line-height:1.2;}

  .products-sub{
    display:flex;flex-direction:column;gap:2px;font-size:0.82rem;color:#4a4438;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:8px 0;margin-bottom:18px;font-variant-numeric:tabular-nums;
  }
  .products-sub > span::before{content:"● ";color:var(--accent);}
  .products-sub .ps-label{display:inline-block;min-width:2.8em;}

  .toggle-wrap{display:inline-flex;align-items:center;gap:8px;flex-shrink:0;}
  .top-bar-toggles{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .toggle-label{
    font-size:0.68rem;color:#5b5346;line-height:1.25;text-align:right;white-space:nowrap;
  }
  .ios-toggle{
    position:relative;width:64px;height:32px;border-radius:18px;
    border:2px solid var(--ink);background:#fff;padding:0;cursor:pointer;
    flex-shrink:0;transition:background 0.2s,border-color 0.2s;
  }
  .ios-toggle .toggle-thumb{
    position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
    background:var(--ink);transition:left 0.2s,background 0.2s;
  }
  .ios-toggle .toggle-text{
    position:absolute;top:50%;transform:translateY(-50%);
    font-size:0.68rem;font-weight:800;letter-spacing:0.02em;right:8px;color:var(--ink);
  }
  .ios-toggle.on{background:var(--ink);border-color:var(--ink);}
  .ios-toggle.on .toggle-thumb{left:calc(100% - 26px);background:#fff;}
  .ios-toggle.on .toggle-text{right:auto;left:8px;color:#fff;}

  button{font-size:0.9rem;padding:9px 16px;border-radius:5px;border:none;cursor:pointer;font-weight:600;}
  .btn-clear{background:var(--danger);color:#fff;}
  .btn-clear:hover{background:var(--danger-dark);}
  .result-clear-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .result-clear-row .btn-clear{margin-left:auto;}
  .btn-derivation{background:var(--accent);color:#fff;}
  .btn-derivation:hover{background:var(--accent-dark);}

  .name-legend{
    display:flex;flex-direction:column;gap:2px;font-size:0.82rem;color:#4a4438;
    margin-bottom:10px;font-variant-numeric:tabular-nums;
  }
  .name-legend > span::before{content:"● ";color:var(--accent);}
  .name-legend span b{color:var(--accent-dark);}
  .name-legend .ps-label{display:inline-block;min-width:2.8em;}

  .derivation-panel{
    margin-top:10px;font-size:0.88rem;line-height:1.55;
  }
  .deriv-product{
    margin-bottom:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;
    background:var(--cell);
  }
  .deriv-product:last-child{margin-bottom:0;}
  .deriv-product-title{
    font-weight:700;color:var(--accent-dark);font-size:0.94rem;
    margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px;
  }
  .deriv-group{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  }
  .deriv-group:first-child{margin-top:0;padding-top:0;border-top:none;}
  .deriv-group-header{
    display:flex;flex-wrap:nowrap;align-items:baseline;justify-content:space-between;
    gap:6px 14px;margin-bottom:3px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .deriv-group-title{font-weight:600;color:#5b5346;font-size:0.8rem;white-space:nowrap;flex-shrink:0;}
  .deriv-line{color:#8a8272;font-size:0.84rem;margin-bottom:3px;}
  .deriv-group-header .deriv-line{
    margin-bottom:0;white-space:nowrap;
    font-weight:600;color:#5b5346;font-size:0.72rem;
  }
  .deriv-intro{
    color:#5b5346;background:#f2f0e8;border-radius:4px;
    padding:6px 8px;margin-bottom:8px;font-size:0.8rem;line-height:1.55;
  }
  .deriv-formula{
    font-family:inherit;color:#2c2620;font-size:0.78rem;
    margin-bottom:2px;word-break:break-all;
  }
  .deriv-sum{
    color:var(--accent-dark);border-top:1px dashed var(--line);
    padding-top:10px;margin-top:10px;
  }
  .deriv-sum-value{color:var(--accent-dark);}
  .deriv-refsum{color:#5b5346;margin-bottom:4px;}
  .deriv-refblock{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .deriv-dynamic{color:var(--accent-dark);font-weight:600;margin-bottom:8px;}
  .deriv-empty{color:#9a9385;font-style:italic;}

  .formula-anim{margin:10px 0 6px;}
  .formula-anim-stage{
    background:#fbfaf5;border:1px dashed var(--line);
    border-radius:5px;padding:8px 10px;
  }
  .fa-anim-area{position:relative;min-height:44px;}
  .fa-state{
    position:absolute;top:50%;left:0;right:0;
    display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:nowrap;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;-ms-overflow-style:none;
    font-size:0.78rem;color:var(--ink);
    opacity:0;transform:translateY(calc(-50% + 6px)) scale(0.97);
    transition:opacity 0.6s ease, transform 0.6s ease;
    pointer-events:none;
  }
  .fa-state::-webkit-scrollbar{display:none;}
  .fa-state.is-active{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto;}
  .fa-std,.fa-usage{font-weight:700;white-space:nowrap;font-size:0.78rem;}
  .fa-usage{color:var(--danger-dark);}
  .fa-std{color:var(--accent-dark);}
  .fa-eq{font-weight:700;flex-shrink:0;}
  .fa-x{flex-shrink:0;color:#8a8272;}
  .fa-plain{flex-shrink:0;white-space:nowrap;}
  .fa-frac{display:inline-flex;flex-direction:column;align-items:stretch;font-size:0.7rem;line-height:1.25;flex-shrink:0;}
  .fa-frac .num{padding:0 4px 2px;white-space:nowrap;text-align:center;}
  .fa-frac .den{border-top:1.2px solid var(--ink);padding:2px 4px 0;white-space:nowrap;text-align:center;}
  .fa-static-line{
    text-align:center;font-size:0.78rem;color:#2c2620;margin-bottom:8px;
  }
  .btn-formula-anim{
    display:block;margin-top:6px;background:none;border:none;padding:2px 0;
    font-size:0.78rem;color:var(--accent-dark);cursor:pointer;
  }
  .btn-formula-anim:hover{color:var(--accent);}
  .deriv-warning{
    color:var(--danger-dark);background:#fdf1ec;border:1px solid #e8c9b8;
    border-radius:4px;padding:6px 8px;margin:4px 0 8px;font-size:0.82rem;line-height:1.5;
  }

  .product-card{
    background:var(--cell);border:1px solid var(--line);border-radius:6px;
    padding:16px 14px 18px;margin-bottom:16px;
  }
  .product-card h2{font-size:1rem;margin:0;}
  .card-header{
    display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;
  }
  .btn-toggle-card{
    background:none;border:none;padding:4px 6px;margin:-4px -6px 0 0;
    font-size:0.95rem;color:var(--accent-dark);cursor:pointer;line-height:1;
    flex-shrink:0;transition:transform 0.15s ease, color 0.15s ease;
  }
  .btn-toggle-card:hover{color:var(--accent);}
  .btn-toggle-card.is-collapsed{transform:rotate(-90deg);}

  .btn-note-toggle{
    background:none;border:none;padding:2px 0;margin:2px 0 12px;
    font-size:0.78rem;color:var(--accent-dark);cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;
  }
  .btn-note-toggle:hover{color:var(--accent);}
  .btn-note-toggle .note-arrow{
    display:inline-block;font-size:0.68rem;transition:transform 0.15s ease;
  }
  .btn-note-toggle.is-open .note-arrow{transform:rotate(180deg);}
  .formula-note-body{margin-top:2px;}

  /* 基準切換鈕（VitA基準／VitD3基準）＋ IU換算圖示意圖按鈕：放在品名卡片
     公式框上方，兩個都是小小的、無底色框線的次要按鈕，跟其他次要按鈕
     （說明、播放動畫）風格一致，不搶主要操作（確定／計算）的視覺焦點。 */
  .basis-toggle-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:2px 0 6px;
  }
  .btn-basis-toggle{
    background:var(--cell);border:1px solid var(--accent-dark);border-radius:14px;
    padding:4px 12px;font-size:0.8rem;color:var(--accent-dark);cursor:pointer;
    font-weight:600;line-height:1.3;
  }
  .btn-basis-toggle:hover{background:var(--accent-dark);color:#fff;}
  .btn-diagram{
    background:none;border:none;padding:2px 0;font-size:0.78rem;
    color:var(--accent-dark);cursor:pointer;text-decoration:underline;
    text-underline-offset:2px;
  }
  .btn-diagram:hover{color:var(--accent);}

  .formula{
    display:flex;flex-direction:column;gap:6px;font-size:0.95rem;color:var(--ink);
    background:#fbfaf5;border:1px dashed var(--line);border-radius:5px;
    padding:10px 12px;margin:10px 0 14px;
  }
  .formula-note-line{
    font-size:0.95rem;color:var(--ink);font-weight:600;line-height:1.4;
  }
  .formula-intro-line{
    font-size:0.88rem;color:var(--accent-dark);font-weight:600;line-height:1.4;
    white-space:normal;
  }
  .btn-inline-declared{
    background:none;border:none;padding:0;margin:0;font:inherit;color:var(--accent-dark);
    text-decoration:underline;text-underline-offset:2px;cursor:pointer;
  }
  .btn-inline-declared:hover{color:var(--accent);}
  .formula-row{
    display:flex;align-items:center;flex-wrap:nowrap;gap:6px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .formula-row::-webkit-scrollbar{display:none;}
  .formula-row > *{flex-shrink:0;}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85rem;line-height:1.3;}
  .frac .num{padding:0 6px 2px;}
  .frac .den{border-top:1.4px solid var(--ink);padding:2px 6px 0;}
  @media (max-width:400px){
    .formula-note-line{font-size:0.85rem;}
    .formula-row{font-size:0.82rem;gap:4px;}
    .frac{font-size:0.74rem;}
  }

  .step{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .step label{display:block;font-size:0.85rem;margin-bottom:4px;white-space:nowrap;}
  .step input[type=number]{
    width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:4px;font-size:0.95rem;
  }
  .step button.btn-primary,
  .step button.btn-clear-small{
    font-size:0.85rem;padding:9px 10px;
    flex:0 0 auto;width:4em;text-align:center;
  }

  .extra-fields-row{
    display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px;
  }
  .extra-fields-row label{display:block;font-size:0.85rem;margin-bottom:4px;white-space:nowrap;}
  .extra-fields-row input[type=number]{
    width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:4px;font-size:0.95rem;
  }
  .field-with-preset{display:flex;align-items:center;gap:6px;}
  .btn-preset{
    font-size:0.72rem;padding:6px 8px;background:#eee8d8;color:#5b5346;
    border:1px solid var(--line);border-radius:4px;font-weight:600;white-space:nowrap;
  }
  .btn-preset:hover{background:#e2dcc9;}

  .groups{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .group-row{background:#fbfaf5;border:1px dashed var(--line);border-radius:5px;padding:8px 8px 4px;}
  .group-row .g-label{font-size:0.75rem;font-weight:600;color:#6b6455;margin-bottom:4px;}
  .group-row.is-last .g-label{color:var(--danger-dark);}

  .g-grid{display:grid;gap:6px;}
  .g-grid.cols-1{grid-template-columns:repeat(1,1fr);}
  .g-grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .g-grid.cols-3{grid-template-columns:repeat(3,1fr);}

  .g-cell label{
    display:block;font-size:0.68rem;white-space:nowrap;color:#4a4438;
    margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;
  }
  .g-cell .g-label-row{
    display:flex;align-items:baseline;gap:6px;margin-bottom:2px;
  }
  .g-cell .g-label-row label{margin-bottom:0;}
  .btn-row-preset{
    background:none;border:none;padding:0;margin:0;
    font-size:0.68rem;color:#a39d8c;cursor:pointer;font-weight:400;
    white-space:nowrap;
  }
  .btn-row-preset:hover{color:#7a7263;}
  .g-cell input[type=number]{
    width:100%;min-width:0;padding:6px 4px;border:1px solid var(--line);border-radius:4px;
    font-size:0.85rem;text-align:center;
  }
  .g-cell input[type=number]::placeholder{
    color:#c4bfae;opacity:0.7;font-style:italic;
  }
  .g-cell.placeholder{display:flex;flex-direction:column;justify-content:flex-end;}
  .g-cell.placeholder .ph-box{
    width:100%;padding:6px 4px;border:1px dashed var(--line);border-radius:4px;
    font-size:0.68rem;color:#a39d8c;text-align:center;background:#f2f0e8;
  }
  .g-cell.placeholder .ph-box.filled{
    color:var(--danger-dark);font-weight:700;font-size:0.85rem;
  }

  .error{color:var(--danger-dark);font-size:0.82rem;margin-top:4px;min-height:1em;}
  .soft-warning{
    color:#8a6a1f;background:#fdf6e3;border:1px solid #e6cf8a;border-radius:4px;
    font-size:0.78rem;margin-top:6px;padding:6px 8px;line-height:1.5;
  }

  .action-row{display:flex;justify-content:center;gap:8px;margin-top:12px;}
  .action-row button{font-size:0.9rem;padding:9px 28px;}
  .btn-calc-small{background:var(--ink);color:#fff;}
  .btn-calc-small:hover{background:#000;}
  .btn-clear-small{background:var(--danger);color:#fff;}
  .btn-clear-small:hover{background:var(--danger-dark);}

  .card{
    background:var(--cell);border:1px solid var(--line);border-radius:6px;
    padding:16px 14px 18px;margin-top:16px;
  }
  .card h2{font-size:1rem;margin:0 0 10px;color:var(--ink);}
  .result-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .result-title-row h2{margin:0;}
  .result-title-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .btn-copy-result{
    flex-shrink:0;background:none;border:none;
    padding:2px 0;font-size:0.78rem;color:var(--accent-dark);cursor:pointer;
  }
  .btn-copy-result:hover{color:var(--accent);}
  .btn-copy-result.copied{color:var(--accent);}
  .hidden{display:none !important;}

  @keyframes resultFlash{
    0%{box-shadow:0 0 0 3px var(--accent);}
    100%{box-shadow:0 0 0 0 rgba(63,107,74,0);}
  }
  .flash-highlight{animation:resultFlash 0.9s ease-out;}

  table{width:100%;border-collapse:collapse;font-size:0.8rem;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;border-radius:4px;}
  .table-scroll table{width:auto;min-width:100%;}
  .table-scroll td.product-name{white-space:nowrap;}
  th,td{border:1px solid var(--line);padding:6px 4px;text-align:center;}
  th{background:#eee8d8;color:var(--accent-dark);}
  td.product-name{text-align:center;font-weight:600;font-size:0.75rem;color:var(--accent-dark);}
  tr.last-row{background:#fbf3ea;}
  .usage-last{color:#c0392b;font-weight:700;}
  .usage-unit{color:#888;font-weight:400;font-size:0.9em;}
  .deriv-usage-result{color:#c0392b;font-weight:700;white-space:nowrap;display:inline-block;}
  .num-nowrap{white-space:nowrap;}
  .deriv-refterm{white-space:nowrap;}

  .note{font-size:0.75rem;color:#7a7263;margin-top:10px;margin-bottom:14px;}
  .note-inline{font-size:0.75rem;color:#7a7263;flex:1;text-align:center;}
  .disclaimer{
    font-size:0.75rem;color:var(--danger-dark);margin-top:10px;
    padding:8px 10px;border:1px solid #e0c9a6;border-radius:5px;background:#fdf6ec;
    line-height:1.5;
  }

  /* ---------- 匯出紀錄單：批號輸入彈窗 ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,18,12,0.45);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  }
  .modal-box{
    background:#fffef9;border-radius:8px;padding:18px 18px 16px;
    width:100%;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .modal-box h3{margin:0 0 6px;font-size:1rem;color:var(--ink);}
  .modal-desc{font-size:0.82rem;color:#5b5346;margin:0 0 10px;line-height:1.5;}
  .modal-input{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:5px;
    font-size:0.95rem;font-family:inherit;
  }
  .modal-error{color:var(--danger-dark);font-size:0.78rem;margin-top:6px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  /* 匯出彈窗：按鈕跟上面「匯出格式」那排選項離遠一點，並用一條淡淡的
     分隔線隔開，避免點選項時手指誤觸到「確認匯出」。 */
  #exportModalBackdrop .modal-actions{
    margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  }
  #exportModalBackdrop .export-format-row{margin-bottom:4px;}
  .btn-modal-confirm{background:var(--accent);color:#fff;}
  .btn-modal-confirm:hover{background:var(--accent-dark);}
  /* 查詢彈窗裡的下拉選單（製品名／品名）：字級跟上下高度都比一般輸入框
     再小一點，兩個選單並排時比較不擁擠，看起來也更緊湊。 */
  .query-filter-cell select.modal-input{
    padding:5px 8px;font-size:0.82rem;
  }
  .modal-checkbox-row{
    display:flex;align-items:center;gap:8px;margin-top:12px;
    font-size:0.85rem;color:#4a4438;cursor:pointer;
  }
  .modal-checkbox-row input{width:16px;height:16px;flex-shrink:0;}
  .modal-field-label{
    display:block;font-size:0.8rem;color:#4a4438;margin:12px 0 4px;font-weight:600;
  }
  #exportNameOverrideRow{margin-top:2px;}
  /* 三個格式選項要能擠在同一行（手機畫面窄，換行看起來很亂）：
     不換行、間距縮小、文字不斷字，必要時讓選項自己縮窄一點。 */
  .export-format-row{display:flex;gap:10px;flex-wrap:nowrap;align-items:center;}
  .export-format-row label{
    display:flex;align-items:center;gap:4px;font-size:0.8rem;color:#4a4438;cursor:pointer;
    white-space:nowrap;flex:0 1 auto;min-width:0;
  }
  .export-format-row input{width:15px;height:15px;flex-shrink:0;}

  /* ---------- 查詢歷史紀錄彈窗 ---------- */
  .modal-box-wide{max-width:480px;max-height:88vh;overflow-y:auto;}
  .iu-diagram-img{max-width:100%;display:block;margin:0 auto;border-radius:4px;}
  .iu-diagram-placeholder{
    color:#8a8272;font-size:0.85rem;line-height:1.6;text-align:center;
    padding:30px 10px;border:1px dashed var(--line);border-radius:6px;
  }
  .query-filter-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;
  }
  .query-filter-cell-wide{grid-column:1 / -1;}
  .query-filter-cell label{
    display:block;font-size:0.72rem;color:#7a7263;margin-bottom:3px;
  }
  .query-results{margin-top:14px;}
  .query-results-meta{font-size:0.78rem;color:#7a7263;margin-bottom:8px;}
  .query-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .query-table{width:100%;border-collapse:collapse;font-size:0.76rem;white-space:nowrap;}
  .query-table th,.query-table td{
    border:1px solid var(--line);padding:4px 6px;text-align:center;
  }
  .query-table th{background:#f1ede0;}

  /* ---------- 查詢結果表格：時間／製品名／品名 三欄的收起/展開小三角形 ----------
     收起時欄寬跟標題文字差不多寬，內容超出的部分用省略號截斷，不會佔掉
     太多版面，讓其他欄位（批號、使用量...）不用一直往右滑才看得到；
     點小三角形展開回來就能看到完整內容。 */
  .query-table th.qc-time,.query-table th.qc-project,.query-table th.qc-product{
    white-space:nowrap;
  }
  .qc-toggle{
    background:none;border:none;padding:0;margin-left:4px;cursor:pointer;
    font-size:0.7rem;color:#7a7263;vertical-align:middle;
    display:inline-block;transition:transform 0.2s ease;
  }
  .qc-toggle:hover{color:#4a4438;}
  .qc-toggle.is-collapsed{transform:rotate(90deg);}
  .qc-cell-text{display:inline-block;max-width:100%;}
  .query-table.collapsed-qc-time td.qc-time,
  .query-table.collapsed-qc-time th.qc-time{
    max-width:3.6em;overflow:hidden;
  }
  .query-table.collapsed-qc-project td.qc-project,
  .query-table.collapsed-qc-project th.qc-project{
    max-width:4.2em;overflow:hidden;
  }
  .query-table.collapsed-qc-product td.qc-product,
  .query-table.collapsed-qc-product th.qc-product{
    max-width:3.6em;overflow:hidden;
  }
  .query-table.collapsed-qc-time td.qc-time .qc-cell-text,
  .query-table.collapsed-qc-project td.qc-project .qc-cell-text,
  .query-table.collapsed-qc-product td.qc-product .qc-cell-text{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ---------- 匯出紀錄單：實際列印用的內容區塊（平常藏在畫面外，只有
     按「匯出」觸發列印時才會透過 @media print 規則顯示出來） ---------- */
  #printArea{position:absolute;left:-99999px;top:0;width:800px;}
  @media print{
    /* 之前的做法是把整頁用 visibility:hidden 藏起來，但 visibility 不會
       移除版面配置空間，原本 App 介面（.wrap）該佔多高，紙上還是會留
       出對應的空白，變成印出一堆意義不明的空白頁。改成直接把 .wrap
       設成 display:none（徹底從版面移除），紀錄單內容（#printArea）
       改回正常的文件流（不再用絕對定位），紙張高度才會照實際內容多寡
       計算，不會有多餘空白頁。 */
    body{padding:0;background:#fff;margin:0;}
    body.dark-mode{filter:none;background:#fff;}
    .wrap{display:none;}
    .modal-backdrop{display:none;}
    #printArea{position:static;left:auto;top:auto;width:auto;padding:0;}

    /* 手機/畫面上為了讓太長的公式可以左右滑動查看，用了
       overflow-x:auto + white-space:nowrap；紙本沒辦法滑動，
       不取消的話超出寬度的部分會直接被裁掉、看不到。印出來一律
       改成正常換行，確保公式、組別標題等內容完整顯示、不被裁切。 */
    #printArea .deriv-group-header,
    #printArea .formula-row,
    #printArea .table-scroll,
    #printArea .fa-state{
      overflow:visible !important;
      white-space:normal !important;
      flex-wrap:wrap !important;
    }

    /* 公式互換動畫（使用量↔標準值那組）平常是兩個狀態疊在同一個位置、
       用透明度切換；紙上沒有「播放」這回事，只固定顯示畫面上當時是
       作用中（is-active）的那個方向，跟畫面上看到的一致——分析號碼
       只有 1 組時是「使用量＝標準值×...」，2 組以上時是「標準值＝
       使用量×...」（見 buildFormulaAnimationHtml 的 defaultReversed），
       不要不管畫面狀態、寫死永遠印「使用量＝標準值×...」那個方向。
       把播放按鈕拿掉。 */
    #printArea .fa-state{position:static !important;opacity:1 !important;transform:none !important;display:none !important;}
    #printArea .fa-state.is-active{display:flex !important;justify-content:flex-start !important;}
    #printArea .btn-formula-anim{display:none !important;}
    #printArea .fa-anim-area{min-height:0 !important;}
    #printArea .fa-static-line{text-align:left !important;}
  }
  .print-title{font-size:1.5rem;font-weight:700;margin-bottom:4px;text-align:center;}
  .print-batch-line{font-size:1rem;color:#333;text-align:left;margin-bottom:6px;}
  .print-title-rule{border-top:1.5px solid #333;margin:2px 0 12px;}
  .print-meta{font-size:1rem;color:#333;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;}
  .print-meta span{margin-right:18px;}
  .print-meta .print-weigh-date{margin-right:0;text-align:right;}
  /* ---------- 排版以區塊為主：每個區塊（品名結果、每個品名的推導過程、
     簽名欄、簽核規範）都設定「避免區塊內斷頁」，印出來如果某個區塊在
     頁尾放不下，會整塊一起換到下一頁，不會被硬生生從中間切成兩半。
     同時列出舊式 page-break-inside 跟新式 break-inside，涵蓋新舊瀏覽器。 ---------- */
  .print-product{
    margin-bottom:22px;
    page-break-inside:auto;break-inside:auto;
  }
  .print-product h2{font-size:1rem;border-bottom:1.5px solid #333;padding-bottom:4px;margin-bottom:8px;}
  .print-deriv-section h2{font-size:1rem;border-bottom:1.5px solid #333;padding-bottom:4px;margin-bottom:8px;}
  .print-product table{width:100%;border-collapse:collapse;font-size:0.82rem;margin-bottom:10px;}
  .print-product th,.print-product td{border:1px solid #999;padding:4px 6px;text-align:center;}
  /* ---------- 分頁規則：由匯出彈窗的「區塊文字不分頁」決定 ----------
     沒勾（預設）：所有東西都可以在任何位置斷開，盡量把每一頁填滿，
                   內容再多也不會在頁尾留下大片空白。
     有勾：整段推導過程仍然可以跨頁（不然一長就整段被推到下一頁、
           前一頁全空），但裡面的小單位會保持完整——每個分析號碼的
           區塊、每個公式框不會被切成兩半，標題也不會單獨留在頁尾。 */
  .print-deriv-block{
    margin-bottom:10px;
    page-break-inside:auto;break-inside:auto;
  }
  /* 沒勾的時候，強制把「不可斷頁」全部解除。這裡要用 !important 並且
     套用到所有子元素：瀏覽器對某些元素（有邊框、有背景、flex 容器、
     表格列…）本來就會自己避免從中間切開，只把我們自己寫的規則拿掉
     還不夠，實測起來會變成勾不勾都一樣。 */
  #printArea:not(.keep-blocks),
  #printArea:not(.keep-blocks) *{
    page-break-inside:auto !important;
    break-inside:auto !important;
    page-break-after:auto !important;
    break-after:auto !important;
  }
  #printArea.keep-blocks .deriv-group,
  #printArea.keep-blocks .print-formula-box,
  #printArea.keep-blocks .print-signoff,
  #printArea.keep-blocks .print-footer,
  #printArea.keep-blocks .print-terms,
  #printArea.keep-blocks .print-terms div,
  #printArea.keep-blocks .print-product table{
    page-break-inside:avoid !important;break-inside:avoid !important;
  }
  /* 標題後面至少要跟著一點內容，不要標題留在頁尾、內容全部跑到下一頁 */
  #printArea.keep-blocks .print-product h2,
  #printArea.keep-blocks .print-deriv-section h2,
  #printArea.keep-blocks .print-derivation-title{
    page-break-after:avoid !important;break-after:avoid !important;
  }
  .print-derivation-title{font-size:0.88rem;font-weight:700;margin:14px 0 4px;border-top:1px dashed #999;padding-top:10px;}
  .print-formula-box{
    background:#fbfaf5;border:1px solid #ccc;border-radius:5px;
    padding:8px 10px;margin-bottom:8px;
    page-break-inside:auto;break-inside:auto;
  }
  /* 製品名的公式（非動畫那組）跟推導過程裡「公式互換動畫」用的是同一種
     字體（都是網頁本身的預設字型，沒有另外指定），這裡只需要把字級跟
     排列方式調成跟動畫公式一致：置中、字級改成 0.78rem／分數 0.7rem
     （對應動畫那邊 .fa-state 0.78rem／.fa-frac 0.7rem 的大小）。 */
  .print-formula-box .formula-row{justify-content:flex-start;font-size:0.78rem;}
  .print-formula-box .frac{font-size:0.7rem;}
  .print-footer{font-size:0.75rem;color:#555;margin-top:12px;line-height:1.5;
    page-break-inside:auto;break-inside:auto;}
  .print-signoff{
    display:flex;gap:40px;margin-top:16px;font-size:0.88rem;
    page-break-inside:auto;break-inside:auto;
  }
  /* 簽核規範這段本來整塊設定「不可斷頁」，但它有 5 行、又有上方留白，
     只要頁尾剩下的空間差一點點放不下，整塊就會被推到下一頁，前一頁
     就空出一大塊沒用到（看起來像莫名其妙提前換頁）。改成：整塊允許
     跨頁，但「每一行」本身不可以被切成兩半，這樣既能把頁面填滿，
     也不會出現半行字被切開的情況。順便把行距與上方留白縮小一點，
     多數情況下就直接放得進同一頁了。 */
  .print-terms{
    text-align:left;font-size:0.8rem;color:#222;line-height:1.7;
    margin-top:12px;border-top:1px solid #999;padding-top:8px;
    page-break-inside:auto;break-inside:auto;
  }
  .print-terms div{
    text-align:left;
    page-break-inside:auto;break-inside:auto;
  }

  /* 頁面邊界縮小，每一頁可以多印幾行。下邊界壓得比上邊界更小：
     上面要留一點空間看起來才不會擠到紙緣，下面則沒有這個需求。
     （15mm → 上10 / 左右10 / 下7，一頁大約多出 4~5 行的空間） */
  @page{size:portrait;margin:10mm 10mm 7mm 10mm;}

  /* ---------- 深色模式切換鈕：跟「自動清除參數」用同一顆藥丸形開關，
     但滑塊裡放的是太陽／月亮圖示，不是 ON/OFF 文字 ---------- */
  .theme-toggle .toggle-thumb{
    display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;
  }
  .theme-toggle .theme-icon{
    display:inline-block;
  }
  /* 深色模式下整個畫面會被 invert+hue-rotate（見 body.dark-mode），
     圖示本身要用同樣的濾鏡反向抵銷回來，太陽/月亮才不會被跟著整頁
     一起變色；一般（淺色）模式下完全不用濾鏡，維持原本的顏色。 */
  body.dark-mode .theme-toggle .theme-icon{filter:invert(1) hue-rotate(180deg);}
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <h1 class="title-cn">原料換算</h1>
    <div class="top-bar-toggles">
      <div class="toggle-wrap">
        <span class="toggle-label">深色模式</span>
        <button type="button" class="ios-toggle theme-toggle" id="themeToggle" aria-pressed="false" aria-label="切換深色模式">
          <span class="toggle-thumb"><span class="theme-icon" id="themeIcon">☀️</span></span>
        </button>
      </div>
      <div class="toggle-wrap">
        <span class="toggle-label">參數保留</span>
        <button type="button" class="ios-toggle" id="keepParamsToggle" aria-pressed="true">
          <span class="toggle-thumb"></span>
          <span class="toggle-text">ON</span>
        </button>
      </div>
    </div>
  </div>


  <div class="project-select-wrap">
    <label>製品名（選擇項目）</label>
    <div class="custom-select" id="customSelect">
      <button type="button" class="cs-trigger" id="csTrigger">
        <span class="cs-trigger-label" id="csTriggerLabel"></span>
        <span class="cs-trigger-cn" id="csTriggerCn"></span>
        <span class="cs-arrow">▾</span>
      </button>
      <div class="cs-list hidden" id="csList"></div>
    </div>
  </div>

  <div class="products-sub" id="productsSub"></div>

  <div id="productsContainer"></div>

  <div class="card hidden" id="resultCard">
    <div class="result-title-row">
      <h2>計算結果</h2>
      <div class="result-title-actions">
        <button type="button" class="btn-copy-result" id="queryHistoryBtn">查詢</button>
        <button type="button" class="btn-copy-result" id="copyResultBtn">複製</button>
        <button type="button" class="btn-copy-result" id="exportPdfBtn">匯出</button>
      </div>
    </div>
    <div class="name-legend" id="nameLegend"></div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr id="resultHeadRow"></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
    <div class="result-clear-row">
      <button type="button" class="btn-derivation hidden" id="derivationBtn">推導過程</button>
      <div class="note-inline"><span class="usage-last">紅字</span>為系統回推結果</div>
      <button type="button" class="btn-clear" id="clearAllBtn">全部清除</button>
    </div>
    <div class="derivation-panel hidden" id="derivationPanel"></div>
    <div class="disclaimer">
      ⚠ 本頁計算結果僅供輔助參考，不能取代人工複核。正式作業前，請依原始公式與數據自行人工複算並找幹部覆核，核對無誤後再使用；若程式結果與人工計算有落差，請以人工計算結果為準，並回報異常。
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="exportModalBackdrop">
  <div class="modal-box">
    <h3>匯出</h3>
    <p class="modal-desc">請輸入製造批號，才能匯出</p>
    <input type="text" id="exportBatchInput" class="modal-input" placeholder="例如：YT-601">
    <div class="modal-error hidden" id="exportBatchError">請輸入製造批號後再匯出。</div>

    <label class="modal-field-label" for="exportWeighDate">秤量日期</label>
    <input type="date" id="exportWeighDate" class="modal-input">

    <div id="exportNameOverrideRow" class="hidden">
      <label class="modal-field-label" for="exportNameOverride">列印／匯出品名</label>
      <select id="exportNameOverride" class="modal-input"></select>
    </div>

    <label class="modal-checkbox-row">
      <input type="checkbox" id="exportIncludeDerivation">
      <span>同時列印／匯出推導過程內容</span>
    </label>
    <label class="modal-checkbox-row">
      <input type="checkbox" id="exportKeepBlocks">
      <span>段落不跨頁（僅支援PDF）</span>
    </label>

    <div class="modal-field-label">匯出格式</div>
    <div class="export-format-row">
      <label><input type="radio" name="exportFormat" value="pdf" checked><span>PDF／列印</span></label>
      <label><input type="radio" name="exportFormat" value="xlsx"><span>Excel(.xlsx)</span></label>
      <label><input type="radio" name="exportFormat" value="docx"><span>Word(.docx)</span></label>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-clear-small" id="exportBatchClear">清除</button>
      <button type="button" class="btn-clear-small" id="exportModalCancel">取消</button>
      <button type="button" class="btn-modal-confirm" id="exportModalConfirm">確認匯出</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="queryModalBackdrop">
  <div class="modal-box modal-box-wide">
    <h3>查詢歷史紀錄</h3>
    <div class="query-filter-grid">
      <div class="query-filter-cell">
        <label>開始日期</label>
        <input type="date" id="queryDateFrom" class="modal-input">
      </div>
      <div class="query-filter-cell">
        <label>結束日期</label>
        <input type="date" id="queryDateTo" class="modal-input">
      </div>
      <div class="query-filter-cell">
        <label>製品名</label>
        <select id="queryProjectLabel" class="modal-input"></select>
      </div>
      <div class="query-filter-cell">
        <label>品名</label>
        <select id="queryProductName" class="modal-input"></select>
      </div>
      <div class="query-filter-cell query-filter-cell-wide">
        <label>批號</label>
        <input type="text" id="queryBatchNo" class="modal-input" placeholder="例如：YT601（可留空查全部）">
      </div>
    </div>
    <div class="modal-error hidden" id="queryError"></div>
    <div class="modal-actions">
      <button type="button" class="btn-clear-small" id="queryModalClose">關閉</button>
      <button type="button" class="btn-modal-confirm" id="queryModalSearch">查詢</button>
    </div>
    <div class="query-results" id="queryResults"></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="iuDiagramBackdrop">
  <div class="modal-box">
    <h3 id="iuDiagramTitle">IU換算圖示意圖</h3>
    <div id="iuDiagramBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn-clear-small" id="iuDiagramClose">關閉</button>
    </div>
  </div>

                            數字，例如 4.19 會顯示「例:4.19」，預設 1。

                            一樣，每個分析號碼自己輸入自己的數字（例如每批原料的
                            力價%可能不一樣）。這種情況下比例欄位會顯示在每一組
