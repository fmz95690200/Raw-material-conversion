  // 觸發瀏覽器下載一個檔案（.xlsx／.docx 共用）：先做成一個暫時的
  // blob網址，塞進一個看不到的 <a download> 連結，點一下再馬上移除，
  // 這是瀏覽器裡最通用、不需要任何額外程式庫就能觸發下載的做法。
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // 分數在文字流裡的暫存標記：先把分數包成「\u0001分子\u0002分母\u0003」
  // 這種特殊字元包起來的形式混在文字裡，後面再依匯出格式決定怎麼呈現
  // （Word 用真正的上下分數、Excel 用「( 分子 / 分母 )」這種同行寫法）。
  // 用這幾個平常不會出現在文件裡的控制字元當標記，才不會跟正常內容撞到。
  const FRAC_S = '\u0001', FRAC_M = '\u0002', FRAC_E = '\u0003';

  // 推導過程轉成「每一行的內容」給 Excel／Word 匯出用。
  //
  // 這裡不能直接讀 innerText：畫面上的分數是用「分子一個 <span>、分母
  // 一個 <span>」上下疊出來的，直接讀文字會變成分子、分母各自斷成一行，
  // 「×」也自己一行，整個公式散開變成一堆看不懂的碎片。所以先把 DOM
  // 複製一份，把每個分數換成上面那種標記，順帶拿掉播放按鈕、以及公式
  // 互換動畫裡「目前沒有作用中」的那個方向（不然同一條公式會印出兩次、
  // 方向還相反），再讀文字出來。
  function derivationExportLines(onlyProduct){
    const html = buildDerivationHtmlForExport(onlyProduct);
    if(!html) return [];
    const tmp = document.createElement('div');
    tmp.style.position = 'fixed';
    tmp.style.left = '-99999px';
    tmp.innerHTML = html;

    tmp.querySelectorAll('.btn-formula-anim').forEach(el => el.remove());
    tmp.querySelectorAll('.fa-state').forEach(el => {
      if(!el.classList.contains('is-active')) el.remove();
    });

    tmp.querySelectorAll('.frac, .fa-frac').forEach(el => {
      const num = el.querySelector('.num');
      const den = el.querySelector('.den');
      const numText = num ? num.textContent.trim() : '';
      const denText = den ? den.textContent.trim() : '';
      const text = denText ? `${FRAC_S}${numText}${FRAC_M}${denText}${FRAC_E}` : numText;
      el.replaceWith(document.createTextNode(text));
    });

    // 同一條公式裡的每個片段（使用量 / = / 標準值 / × / 分數…）本來是
    // 一堆並排的 <span>，讀 innerText 會被拆成好幾行；先把公式容器裡的
    // 內容併成一行文字再取代掉，公式才不會散開。
    tmp.querySelectorAll('.formula-row, .fa-state, .fa-static-line').forEach(el => {
      const oneLine = el.textContent.replace(/\s+/g, ' ').trim();
      const div = document.createElement('div');
      div.textContent = oneLine;
      el.replaceWith(div);
    });

    document.body.appendChild(tmp);
    const text = tmp.innerText || tmp.textContent || '';
    document.body.removeChild(tmp);
    return text.split('\n').map(s => s.replace(/[ \t]+/g, ' ').trim()).filter(s => s.length > 0);
  }

  // 把含有分數標記的一行，拆成一串 token：
  //   {t:'txt', v:'使用量 = 120g ×'} 或 {t:'frac', num:'100', den:'含量(%)'}
  function parseFracTokens(line){
    const tokens = [];
    const re = new RegExp(FRAC_S + '([^' + FRAC_M + ']*)' + FRAC_M + '([^' + FRAC_E + ']*)' + FRAC_E, 'g');
    let last = 0, m;
    while((m = re.exec(line)) !== null){
      if(m.index > last) tokens.push({t:'txt', v: line.slice(last, m.index)});
      tokens.push({t:'frac', num: m[1], den: m[2]});
      last = m.index + m[0].length;
    }
    if(last < line.length) tokens.push({t:'txt', v: line.slice(last)});
    return tokens;
  }

  // 給 Excel 用：分數退回成同一行的「( 分子 / 分母 )」寫法。
  function derivationPlainTextLines(){
    return derivationExportLines().map(line =>
      parseFracTokens(line).map(tk =>
        tk.t === 'frac' ? `( ${tk.num} / ${tk.den} )` : tk.v
      ).join('').replace(/\s+/g, ' ').trim()
    );
  }

  const EXPORT_TERMS_LINES = [
    '1. 作業者填寫上述資料，先自行計算後再找幹部覆核。',
    '2. 作業者需提供完整資訊給覆核者(原料換算項目、QC試驗報告、秤量頁、原料傳票、使用殘量)。',
    '3. 數據及公式換算內容經簽名後代表雙方認同無誤。',
    '4. 日後如發現錯誤，調查屬其中一方之錯誤，應承擔偏差報告之職責。',
    '5. 此文件至少保留一年後銷毀。'
  ];

  // 把一個品名目前算好的結果，轉成匯出 Excel／Word 共用的「每一列」
  // 資料（分析號碼、品名、使用量、含量、力價、水份），欄位順序、名稱
  // 對照舊版紙本表單「原料換算項目」：料號/分析號碼/品名/使用量/含量/
  // 力價/水份/作業者/覆核者。「料號」這個工具目前沒有對應的設定欄位
  // （舊表單上是原料的內部編號，跟品名是兩件事），所以固定留空，不會
  // 自己亂編一個數字。作業者／覆核者也是留空給人簽名用的。
  function collectExportRowsForProduct(p){
    const data = resultsState[p.key];
    if(!data) return null;
    const bc = getBasisCfg(p);
    const hasContent = p.hasContent !== false;
    const hasRowRatio = !!p.rowRatio;
    const hasWater = !!p.hasWater;
    const contentLabel = (bc && bc.contentLabel) || p.contentLabel || '含量%';
    const rowRatioLabel = (bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%';
    const contentUnit = p.contentUnit != null ? p.contentUnit : '%';
    const usageUnit = usageUnitOf(p);
    const rows = data.map((r, i) => {
      const contentDisplay = p.contentIsPercentOfRatio ? r.contentPercent : r.content;
      return {
        idx: i + 1,
        name: p.name,
        usage: `${fmtDisplayNum(r.usage)}${usageUnit || ''}`,
        content: hasContent ? `${fmtDisplayNum(contentDisplay)}${contentUnit === '%' ? '%' : (contentUnit ? ' '+contentUnit : '')}` : '—',
        ratio: hasRowRatio ? fmtDisplayNum(r.ratio) : '—',
        water: hasWater ? `${fmtDisplayNum(r.water)}%` : '—'
      };
    });
    return { rows, contentLabel, rowRatioLabel, hasRowRatio, hasContent, hasWater };
  }

  // 把一個品名的「補正換算公式」轉成純文字（給 Excel／Word 用）：
  // 邏輯跟畫面上公式框（buildFormulaBoxParts）完全對應，只是回傳結構化
  // 的文字內容，不是 HTML，方便塞進儲存格／段落。
  function getExportFormulaData(p, useActualTotal){
    const isComplement = (p.type === 'complement');
    const isEditableTotal = !!p.editableStandardTotal;
    const stdUnit = p.standardUnit || p.complementUnit || '';
    const hasContent = p.hasContent !== false;
    const hasRowRatio = !!p.rowRatio;
    const bc = getBasisCfg(p);
    const contentFormulaLabel = (bc && bc.contentFormulaLabel) || p.contentFormulaLabel || '含量(%)';

    if(isComplement){
      const totalText = (isEditableTotal && !(useActualTotal && isFinite(p.complementTotal)))
        ? ('標準值' + (stdUnit ? `(${stdUnit})` : ''))
        : (fmtNum(p.complementTotal) + (p.complementUnit || ''));
      const verb = p.complementMode === 'increase' ? '增加量' : '總使用量';
      return { line1: `使用量總和 = ${totalText} － ${p.referTo} ${verb}`, line2: null };
    }

    const totalText = (isEditableTotal && !(useActualTotal && isFinite(p.standardTotal)))
      ? ('標準值' + (stdUnit ? `(${stdUnit})` : ''))
      : (fmtNum(p.standardTotal) + (p.standardUnit || ''));

    const parts = [];
    if(hasContent){
      const num = hasRowRatio ? ((bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%') : fmtNum(p.ratio);
      parts.push(`${num}／${contentFormulaLabel}`);
    } else if(p.ratioNum != null && p.ratioDen != null){
      parts.push(`${fmtNum(p.ratioNum)}／${fmtNum(p.ratioDen)}`);
    } else if(p.ratio !== 1){
      parts.push(fmtNum(p.ratio));
    }
    if(p.hasWater){
      parts.push('100／(100－水份%)');
    }
    const line1 = `使用量 = ${totalText}${parts.length ? ' × ' + parts.join(' × ') : ''}`;

    let line2 = null;
    if(hasContent && p.contentIsPercentOfRatio){
      const rowRatioText = (bc && bc.contentLabel) || p.contentLabel || '力價%';
      const declaredText = hasRowRatio ? ((bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%') : fmtNum(p.ratio);
      line2 = `${contentFormulaLabel} = ${declaredText} × ${rowRatioText}`;
    }
    return { line1, line2 };
  }

  // Excel 工作表名稱有字數（31字內）跟字元（不能有 \\/?*[]:）限制，
  // 這裡統一處理，避免直接拿品名當工作表名稱時，因為括號、斜線之類的
  // 符號讓 SheetJS 產生的檔案打不開。
  function sanitizeSheetName(name){
    return (name || '工作表').replace(/[\\/?*\[\]:]/g, '').slice(0, 31) || '工作表';
  }

  // =========================================================
  // 匯出成 Excel(.xlsx)：版面直接照原始紙本表單那份 Excel 檔案的實際
  // 設定重建——欄寬、列高、字型（微軟正黑體／標楷體／新細明體）、
  // 字級、對齊方式、合併儲存格、框線位置，都是把原檔讀出來對照抄的。
  // 每個品名各自一張工作表：標題（E1:I1）、製品名/製造批號/秤量日期
  // 資訊框、料號/分析號碼/品名/使用量/含量/力價/水份/作業者/覆核者
  // 表格（固定至少 4 列，跟紙本一樣）、補正換算公式（用上下兩列排出
  // 分數，分數線是儲存格的上框線）、簽名欄、條款文字。如果同時要匯出
  // 推導過程，會直接放進每個品名自己「補正換算公式」的框裡（取代
  // 原本只有一條公式的顯示），不另外開工作表。需要
  // xlsx-js-style 這個程式庫才能寫入樣式，沒連上網路載入不了會提示。
  // =========================================================
  // 把公式拆成「開頭文字 ＋ 一連串分數」的結構，好在 Excel 裡照紙本
  // 的樣子排出「1,800 × [分子/分母]」這種上下兩層的分數版面（分子一列、
  // 分母一列，中間用儲存格的上框線當分數線），而不是擠成一行純文字。
  function getExportFormulaFraction(p, useActualTotal){
    const isComplement = (p.type === 'complement');
    const isEditableTotal = !!p.editableStandardTotal;
    const stdUnit = p.standardUnit || p.complementUnit || '';
    const hasContent = p.hasContent !== false;
    const hasRowRatio = !!p.rowRatio;
    const bc = getBasisCfg(p);
    const contentFormulaLabel = (bc && bc.contentFormulaLabel) || p.contentFormulaLabel || '含量(%)';

    if(isComplement){
      const fd = getExportFormulaData(p, useActualTotal);
      return { lead: fd.line1, factors: [], extraLine: null };
    }

    const totalText = (isEditableTotal && !(useActualTotal && isFinite(p.standardTotal)))
      ? ('標準值' + (stdUnit ? `(${stdUnit})` : ''))
      : (fmtNum(p.standardTotal) + (p.standardUnit || ''));

    const factors = [];
    if(hasContent){
      const num = hasRowRatio
        ? (bc ? (bc.rowRatioLabel || '力價%') : fmtNum(p.rowRatioDefault))
        : fmtNum(p.ratio);
      factors.push({num: String(num), den: contentFormulaLabel});
    } else if(p.ratioNum != null && p.ratioDen != null){
      factors.push({num: fmtNum(p.ratioNum), den: fmtNum(p.ratioDen)});
    } else if(p.ratio !== 1){
      factors.push({num: fmtNum(p.ratio), den: ''});
    }
    if(p.hasWater){
      factors.push({num: '100', den: '100－水分(%)'});
    }

    let extraLine = null;
    if(hasContent && p.contentIsPercentOfRatio){
      const rowRatioText = (bc && bc.contentLabel) || p.contentLabel || '力價%';
      const declaredText = hasRowRatio ? ((bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%') : fmtNum(p.ratio);
      extraLine = `${contentFormulaLabel} = ${declaredText} × ${rowRatioText}`;
    }

    return { lead: `${totalText} ×`, factors, extraLine };
  }

  function exportToXlsx(batchNo, weighDate, nameOverride, includeDerivation){
    if(typeof XLSX === 'undefined'){
      alert('Excel 匯出功能需要先連上網路（第一次使用時要下載 Excel 程式庫），請確認網路連線後再試一次。');
      return;
    }
    const proj = PROJECTS.find(pr => pr.id === currentProjectId);
    const wb = XLSX.utils.book_new();
    const validProducts = products.filter(p => resultsState[p.key]);
    if(!validProducts.length){
      alert('目前沒有已經計算完成的品名可以匯出。');
      return;
    }
    const titleLine = nameOverride || (proj ? proj.label : '');

    // 下面這些字型／尺寸／欄寬／列高，都是照著原始紙本表單那份 Excel
    // 檔案裡實際的設定抄過來的，這樣匯出的檔案打開後版面才會跟原本的
    // 表單一致。整份 Excel 統一用標楷體（字級維持紙本表單的大小）。
    const F_TITLE = {name:'標楷體', sz:20};
    const F_LABEL = {name:'標楷體', sz:14};
    const F_VALUE_L = {name:'標楷體', sz:16};
    const F_VALUE_M = {name:'標楷體', sz:14};
    const F_VALUE_S = {name:'標楷體', sz:12};
    const F_DATA = {name:'標楷體', sz:12};
    const F_DASH = {name:'標楷體', sz:12};
    const F_FORMULA = {name:'標楷體', sz:10.5};
    const F_FORMULA_LABEL = {name:'標楷體', sz:12};
    const F_TERMS = {name:'標楷體', sz:12};
    const AC = {horizontal:'center', vertical:'center'};
    const AL = {horizontal:'left', vertical:'center'};
    const AR = {horizontal:'right', vertical:'center'};

    const ws = {};
    const merges = [];
    const COLS = 13; // 邏輯欄 0~12（對應紙本表單的 料號~覆核者）
    // 紙本表單那幾欄都很寬，公式裡的「=」「×」只有一個字，放進去置中就
    // 左右各空一大塊。解法：實際的 Excel 欄位改成一堆很窄的「格子」，
    // 表格那幾欄各自合併好幾格拼出原本的寬度（外觀不變），公式則可以用
    // 比較細的顆粒度擺放，貼合得緊很多。
    const UNIT_W = 1.2;
    const MIN_UNIT_W = 0.35;
    const maxUnits = w => Math.max(1, Math.floor((w * 7 + 5) / (MIN_UNIT_W * 7 + 5)));
    const BASE_W = [8.11, 11.84, 5.85, 5.72, 8.43, 5.85, 8.43, 10.24, 10.11, 10.11, 8.43, 10.64, 8.43];
    // 整體縮放到 A4 直式的可列印範圍內（Excel 每欄實際像素 ≈ 寬度×7 + 5）
    const A4_PRINT_CM = 21 - 1.2 * 2;
    const A4_PRINT_PX = (A4_PRINT_CM / 2.54) * 96;
    const BASE_PX = BASE_W.reduce((a, w) => a + (w * 7 + 5), 0);
    const FIT = Math.min(1, A4_PRINT_PX / BASE_PX);
    const LOGICAL_W = BASE_W.map(w => Math.max(1, ((w * 7 + 5) * FIT - 5) / 7));
    const UCOL = LOGICAL_W.map(w => Math.max(1, Math.min(Math.round(w / UNIT_W), maxUnits(w))));
    const USTART = [];
    { let acc = 0; UCOL.forEach((n, i) => { USTART[i] = acc; acc += n; }); }
    const UTOTAL = UCOL.reduce((a,b) => a+b, 0);
    const US = i => USTART[i];
    const UE = i => USTART[i] + UCOL[i] - 1;

    function setCellSpan(r, c0, c1, v, font, align, border){
      const u0 = US(c0), u1 = UE(c1);
      if(u1 > u0) merges.push({s:{r, c:u0}, e:{r, c:u1}});
      for(let k = u0 + 1; k <= u1; k++){
        const a2 = XLSX.utils.encode_cell({r, c:k});
        if(!ws[a2]) ws[a2] = {t:'s', v:''};
        const s2 = {};
        if(font) s2.font = font;
        if(align) s2.alignment = align;
        if(border) s2.border = border;
        ws[a2].s = s2;
      }
      return setCellU(r, u0, v, font, align, border);
    }
    function setCell(r, c, v, font, align, border){
      return setCellSpan(r, c, c, v, font, align, border);
    }
    function setCellU(r, c, v, font, align, border){
      const addr = XLSX.utils.encode_cell({r, c});
      const isNum = (typeof v === 'number');
      ws[addr] = {t: isNum ? 'n' : 's', v: (v == null ? '' : v)};
      const s = {};
      if(font) s.font = font;
      if(align) s.alignment = align;
      if(border) s.border = border;
      ws[addr].s = s;
      return addr;
    }
    const thin = {style:'thin', color:{rgb:'000000'}};
    const boxAll = {top:thin, bottom:thin, left:thin, right:thin};
    const rowHeights = [];

    // ---- 第1列：標題 ----
    // 標題橫跨整張表格（A~M）再置中，才是真正對齊表格的正中央。
    // 原本沿用紙本檔案的 E1:I1，但那個範圍的中心點比整張表格的中心
    // 偏左約 3 個字寬（各欄寬度不一樣），看起來就沒有置中。
    setCellSpan(0, 0, 12, '原 料 換 算 項 目', F_TITLE, AC);
    rowHeights[0] = {hpt:29.25};
    rowHeights[1] = {hpt:24};

    // ---- 第3~4列：製品名／製造批號／秤量日期 ----
    setCellSpan(2, 0, 1, '製  品  名', F_LABEL, AC);
    {
      const u0 = US(2), u1 = UE(8);
      merges.push({s:{r:2,c:u0}, e:{r:3,c:u1}});
      for(let k = u0 + 1; k <= u1; k++){
        const a2 = XLSX.utils.encode_cell({r:2, c:k});
        if(!ws[a2]) ws[a2] = {t:'s', v:''};
      }
      setCellU(2, u0, titleLine, F_VALUE_L, AL);
    }
    // 批號、日期都加冒號，兩列的字型跟對齊方式也完全一致
    // 「製造批號：」「秤量日期：」加上冒號之後比單一欄還寬（縮放到 A4
    // 之後更明顯），只放一欄會被切掉，所以標籤橫跨兩欄、數值再放後兩欄。
    // 標籤靠右、數值靠左，兩者在中間相接，冒號後面緊接著批號／日期，
    // 兩列的間距與對齊方式完全一致。
    setCellSpan(2, 9, 10, '製造批號：', F_LABEL, AR);
    setCellSpan(2, 11, 12, batchNo, F_VALUE_M, AL);
    setCellSpan(3, 9, 10, '秤量日期：', F_LABEL, AR);
    setCellSpan(3, 11, 12, weighDate, F_VALUE_M, AL);
    for(let u = 0; u < UTOTAL; u++){
      for(let r = 2; r <= 3; r++){
        const addr = XLSX.utils.encode_cell({r, c:u});
        if(!ws[addr]) ws[addr] = {t:'s', v:''};
        const b = {};
        if(r === 2) b.top = thin;
        if(r === 3) b.bottom = thin;
        if(u === 0) b.left = thin;
        if(u === UTOTAL-1) b.right = thin;
        if(u === UE(8)) b.right = thin;
        if(u === US(9)) b.left = thin;
        ws[addr].s = Object.assign({}, ws[addr].s, {border: Object.assign({}, ws[addr].s && ws[addr].s.border, b)});
      }
    }
    rowHeights[2] = {hpt:30};
    rowHeights[3] = {hpt:30};

    // ---- 第5列：表頭 ----
    // 多個品名共用同一張表格。若各品名的「含量／力價」欄位名稱不一樣，
    // 就退回用紙本表單原本的通用名稱，避免掛著某一個品名的專屬名稱、
    // 卻同時列著另一個品名的數字。
    const collectedAll = validProducts.map(p => collectExportRowsForProduct(p)).filter(Boolean);
    const sameContent = collectedAll.every(c => c.contentLabel === collectedAll[0].contentLabel);
    const sameRatio = collectedAll.every(c => c.rowRatioLabel === collectedAll[0].rowRatioLabel);
    const contentHead = sameContent ? collectedAll[0].contentLabel.replace(/%$/,'') : '含  量';
    const ratioHead = sameRatio ? collectedAll[0].rowRatioLabel.replace(/%$/,'') : '力 價';

    const headerRow = 4;
    const headers = [
      [0, '料 號'], [1, '分析號碼'], [2, '品            名'],
      [7, '使用量'], [8, contentHead], [9, ratioHead], [10, '水  份'],
      [11, '作業者'], [12, '覆核者']
    ];
    headers.forEach(([c, text]) => {
      if(c === 2) setCellSpan(headerRow, 2, 6, text, F_LABEL, AC, boxAll);
      else setCell(headerRow, c, text, F_LABEL, AC, boxAll);
    });
    rowHeights[headerRow] = {hpt:30};

    // ---- 資料列：全部品名的分析號碼合併列在同一張表格裡 ----
    const allRows = [];
    collectedAll.forEach(c => c.rows.forEach(row => allRows.push(row)));
    const dataRowCount = Math.max(4, allRows.length);
    for(let i = 0; i < dataRowCount; i++){
      const r = headerRow + 1 + i;
      const row = allRows[i];
      setCell(r, 0, '', F_DATA, AC, boxAll);
      setCell(r, 1, row ? `① ${row.idx}` : '○', F_DASH, row ? AL : AC, boxAll);
      setCellSpan(r, 2, 6, row ? row.name : '', F_VALUE_S, AC, boxAll);
      setCell(r, 7, row ? row.usage : '', F_DATA, AC, boxAll);
      setCell(r, 8, row ? row.content : '', F_DASH, AC, boxAll);
      setCell(r, 9, row ? row.ratio : '', F_DASH, AC, boxAll);
      setCell(r, 10, row ? row.water : '', F_DASH, AC, boxAll);
      setCell(r, 11, '', F_DATA, AC, boxAll);
      setCell(r, 12, '', F_DATA, AC, boxAll);
      rowHeights[r] = {hpt: i < 2 ? 44.25 : 40.35};
    }

    // ---- 補正換算公式區 ----
    // 表格跟這個區塊中間多留一列空白，看起來不會擠在一起。
    const gapRow = headerRow + 1 + dataRowCount;
    rowHeights[gapRow] = {hpt:12};
    const formulaLabelRow = gapRow + 1;
    // 標籤跟底下「品名：…」那幾行對齊（都從邏輯欄 1 開始），不再靠最左邊
    setCellSpan(formulaLabelRow, 1, 5, '補正換算公式', F_FORMULA_LABEL, AL);
    rowHeights[formulaLabelRow] = {hpt:20};

    function dispWidth(s){
      let w = 0;
      for(const ch of String(s)) w += (ch.charCodeAt(0) > 255 ? 1.85 : 1);
      return w;
    }
    const OP_W = 2.4;
    function spanFor(startCol, need){
      const n = Math.ceil(need / UNIT_W);
      return Math.max(1, Math.min(n, (UTOTAL - 1) - startCol));
    }
    function expandTokens(tks){
      const out = [];
      tks.forEach(tk => {
        if(tk.t !== 'txt'){ out.push(tk); return; }
        let rest = tk.v.replace(/\s+/g, ' ').trim();
        if(!rest){ out.push({t:'txt', v:''}); return; }
        const eq = rest.indexOf('=');
        const pieces = eq >= 0
          ? [rest.slice(0, eq).trim(), '=', rest.slice(eq+1).trim()]
          : [rest];
        pieces.forEach(piece => {
          const m = piece.match(/^(.*?)\s*([×÷])$/);
          if(m && m[1]){
            out.push({t:'txt', v:m[1].trim()});
            out.push({t:'txt', v:m[2], op:true});
          } else if(/^[×÷]$/.test(piece)){
            out.push({t:'txt', v:piece, op:true});
          } else {
            out.push({t:'txt', v:piece});
          }
        });
      });
      return out;
    }
    function tokenWidth(tk){
      if(tk.t === 'frac') return Math.max(dispWidth(tk.num), dispWidth(tk.den));
      const t = tk.v.replace(/\s+/g, ' ').trim();
      if(tk.op === true || /^[×÷+\-=]$/.test(t)) return OP_W;
      return dispWidth(t);
    }

    const textColsWidth = (UTOTAL - 2 - US(1)) * UNIT_W;
    const derivRowHeights = {};
    let r = formulaLabelRow + 1;

    // 把「一堆公式／說明文字」畫到工作表上，回傳畫完後的下一列。
    // 同一組公式裡，相同位置的項目用同一組欄位，等號、乘號才會上下對齊。
    function renderFormulaLines(lines, startRow){
      let rr = startRow;
      const colWidthNeed = [];
      lines.forEach(line => {
        const raw = parseFracTokens(line);
        if(!raw.some(tk => tk.t === 'frac')) return;
        expandTokens(raw).forEach((tk, ti) => {
          colWidthNeed[ti] = Math.max(colWidthNeed[ti] || 0, tokenWidth(tk));
        });
      });
      const tokenStart = [], tokenSpan = [];
      { let c = US(1);
        colWidthNeed.forEach((need, ti) => {
          if(!need){ tokenStart[ti] = c; tokenSpan[ti] = 0; return; }
          const sp = spanFor(c, need);
          tokenStart[ti] = c; tokenSpan[ti] = sp; c += sp;
        });
      }
      lines.forEach(line => {
        const rawTokens = parseFracTokens(line);
        const hasFrac = rawTokens.some(tk => tk.t === 'frac');
        const tokens = hasFrac ? expandTokens(rawTokens) : rawTokens;
        if(!hasFrac){
          const txt = line.replace(/\s+/g, ' ').trim();
          setCellU(rr, US(1), txt, F_FORMULA, {horizontal:'left', vertical:'top', wrapText:true});
          merges.push({s:{r:rr, c:US(1)}, e:{r:rr, c:UTOTAL-2}});
          const wrapLines = Math.max(1, Math.ceil(dispWidth(txt) / Math.max(textColsWidth - 2, 10)));
          derivRowHeights[rr] = Math.max(16.5, wrapLines * 15.5 + 3);
          rr += 1;
          return;
        }
        tokens.forEach((tk, ti) => {
          const c = tokenStart[ti], span = tokenSpan[ti];
          if(c == null || span == null || span === 0 || c + span > UTOTAL - 1) return;
          const prevTk = tokens[ti-1], nextTk = tokens[ti+1];
          const isOpTk = t2 => !!(t2 && t2.t === 'txt' &&
            (t2.op === true || /^[×÷+\-=]$/.test(String(t2.v).trim())));
          const prevIsOp = isOpTk(prevTk), nextIsOp = isOpTk(nextTk);
          if(tk.t === 'txt'){
            const txt = tk.v.replace(/\s+/g, ' ').trim();
            if(!txt) return;
            const isOperator = tk.op === true || /^[×÷+\-=]$/.test(txt);
            const align = isOperator
              ? {horizontal:'center', vertical:'center'}
              : ((prevIsOp && nextIsOp)
                ? {horizontal:'center', vertical:'center'}
                : (prevIsOp
                  ? {horizontal:'left', vertical:'center'}
                  : {horizontal:'right', vertical:'center'}));
            setCellU(rr, c, txt, F_FORMULA, align);
            setCellU(rr+1, c, '', F_FORMULA, null);
            merges.push({s:{r:rr, c}, e:{r:rr+1, c:c+span-1}});
          } else {
            setCellU(rr, c, tk.num, F_FORMULA, {horizontal:'center', vertical:'bottom'});
            setCellU(rr+1, c, tk.den, F_FORMULA, {horizontal:'center', vertical:'top'}, {top:thin});
            merges.push({s:{r:rr, c}, e:{r:rr, c:c+span-1}});
            merges.push({s:{r:rr+1, c}, e:{r:rr+1, c:c+span-1}});
            for(let k = c+1; k <= c+span-1; k++){
              setCellU(rr, k, '', F_FORMULA, null);
              setCellU(rr+1, k, '', F_FORMULA, null, {top:thin});
            }
          }
        });
        rr += 2;
      });
      return rr;
    }

    // 每個品名的公式／推導過程，依序排在同一個「補正換算公式」框裡
    validProducts.forEach((p, pIdx) => {
      if(!resultsState[p.key]) return;
      if(validProducts.length > 1 && !includeDerivation){
        setCellSpan(r, 1, 8, `品名：${p.name}`, F_FORMULA, AL);
        r += 1;
      }
      if(includeDerivation){
        r = renderFormulaLines(derivationExportLines(p), r);
      } else {
        const ff = getExportFormulaFraction(p, true);
        if(ff.factors && ff.factors.length){
          let line = `使用量 = ${ff.lead} `;
          ff.factors.forEach((f, i) => {
            if(i > 0) line += ' × ';
            line += FRAC_S + f.num + FRAC_M + f.den + FRAC_E;
          });
          r = renderFormulaLines([line], r);
        } else if(ff.lead){
          setCellSpan(r, 1, 8, ff.lead, F_FORMULA, AL);
          r += 1;
        }
        if(ff.extraLine){
          setCellSpan(r, 1, 8, ff.extraLine, F_FORMULA, AL);
          r += 1;
        }
      }
      if(pIdx < validProducts.length - 1) r += 1; // 品名之間空一列
    });

    const formulaBoxEnd = Math.max(r, formulaLabelRow + 6);
    for(let rr = formulaLabelRow; rr <= formulaBoxEnd; rr++){
      for(const c of [0, UTOTAL-1]){
        const addr = XLSX.utils.encode_cell({r:rr, c});
        if(!ws[addr]) ws[addr] = {t:'s', v:''};
        const b = (c === 0) ? {left: thin} : {right: thin};
        if(rr === formulaLabelRow) b.top = thin;
        if(rr === formulaBoxEnd) b.bottom = thin;
        ws[addr].s = Object.assign({}, ws[addr].s, {border: Object.assign({}, ws[addr].s && ws[addr].s.border, b)});
      }
      if(rowHeights[rr] == null){
        rowHeights[rr] = {hpt: derivRowHeights[rr] != null ? derivRowHeights[rr] : 16.5};
      }
    }

    // ---- 簽名欄 ＋ 條款文字 ----
    const signRow = formulaBoxEnd + 2;
    setCellSpan(signRow, 0, 4, '作業者：＿＿＿＿＿＿＿＿', F_TERMS, AL);
    setCellSpan(signRow, 6, 10, '覆核者：＿＿＿＿＿＿＿＿', F_TERMS, AL);
    const termsStart = signRow + 2;
    EXPORT_TERMS_LINES.forEach((line, i) => {
      setCellSpan(termsStart + i, 0, 10, line, F_TERMS, AL);
    });
    const lastRow = termsStart + EXPORT_TERMS_LINES.length;
    for(let rr = signRow; rr <= lastRow; rr++){
      if(rowHeights[rr] == null) rowHeights[rr] = {hpt:16.5};
    }

    ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:lastRow, c:UTOTAL-1}});
    ws['!merges'] = merges;
    // 欄寬：不能直接把寬度除以格數，Excel 每欄還會多加約 5px 內距，
    // 一欄拆成 n 欄就多出 (n−1) 份內距、表格會整個變寬。這裡先換算成
    // 像素、平均分給每格、再扣掉每格的內距換回寬度，總寬度才會一致。
    ws['!cols'] = [];
    LOGICAL_W.forEach((w, i) => {
      const totalPx = w * 7 + 5;
      const perPx = totalPx / UCOL[i];
      const perW = Math.max(0.08, (perPx - 5) / 7);
      for(let k = 0; k < UCOL[i]; k++) ws['!cols'].push({wch: perW});
    });
    ws['!rows'] = rowHeights;
    ws['!margins'] = {left:0.47, right:0.47, top:0.55, bottom:0.55, header:0.3, footer:0.3};

    XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName(proj ? proj.label : '原料換算'));

    // SheetJS 寫不出列印設定，這裡先產生檔案內容，再用 JSZip 打開它、
    // 直接在工作表 XML 裡補上「A4、直式、寬度縮成 1 頁」的設定。
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    applyPrintSetup(wbout).then(blob => {
      downloadBlob(blob, `原料換算_${batchNo}.xlsx`);
    }).catch(() => {
      XLSX.writeFile(wb, `原料換算_${batchNo}.xlsx`);
    });
  }

  // 在已經產生好的 xlsx 內容裡，補上每張工作表的列印設定。
  // xlsx 本質上是個 zip，工作表在 xl/worksheets/sheetN.xml。
  // 依照格式規定，<sheetPr> 必須放在最前面、<pageSetup> 必須放在
  // <pageMargins> 後面，順序錯了 Excel 會說檔案毀損，所以這裡是插在
  // 固定的位置，不是隨便附加在後面。
  async function applyPrintSetup(wbout){
    if(typeof JSZip === 'undefined') throw new Error('JSZip not loaded');
    const zip = await JSZip.loadAsync(wbout);
    const names = Object.keys(zip.files).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
    for(const name of names){
      let xml = await zip.file(name).async('string');
      // fitToPage 要開，pageSetup 的 fitToWidth 才會生效
      if(xml.indexOf('<sheetPr') === -1){
        xml = xml.replace(/(<worksheet[^>]*>)/, '$1<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');
      } else if(xml.indexOf('pageSetUpPr') === -1){
        xml = xml.replace(/<sheetPr([^>]*)\/>/, '<sheetPr$1><pageSetUpPr fitToPage="1"/></sheetPr>')
                 .replace(/<sheetPr([^>]*)>(?!<pageSetUpPr)/, '<sheetPr$1><pageSetUpPr fitToPage="1"/>');
      }
      // paperSize 9 = A4；fitToHeight 0 = 高度不限頁數，只把寬度縮成 1 頁
      const pageSetupTag = '<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/>';
      if(xml.indexOf('<pageSetup') === -1){
        if(xml.indexOf('<pageMargins') !== -1){
          xml = xml.replace(/(<pageMargins[^>]*\/>)/, '$1' + pageSetupTag);
        } else {
          xml = xml.replace('</worksheet>',
            '<pageMargins left="0.47" right="0.47" top="0.55" bottom="0.55" header="0.3" footer="0.3"/>' +
            pageSetupTag + '</worksheet>');
        }
      }
      zip.file(name, xml);
    }
    return zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      compression: 'DEFLATE'
    });
  }

  // =========================================================
  // 匯出成 Word(.docx)：產生真正的 OOXML 檔案。
  //
  // 為什麼要這麼麻煩：手機版 Word 對檔案格式的檢查比電腦版嚴格很多。
  // 先前試過兩種取巧的做法都失敗——(1) .docx 裡用 altChunk 嵌 HTML，
  // 開起來是空白；(2) 直接把 HTML 改成 .doc 副檔名，手機版 Word 直接
  // 報「檔案已毀損」。所以這裡老老實實組出合規的 OOXML（document.xml
  // ＋ styles.xml ＋ 兩份 .rels ＋ [Content_Types].xml），手機、電腦、
  // WPS 都能正常開啟編輯。
  //
  // 版面盡量比照 PDF 版的結構：標題置中、製造批號、分隔線、製品名／
  // 秤量日期左右分排、計算結果表格、簽名欄、補正換算公式、條款，
  // 推導過程另外分頁。因為是兩套不同的排版引擎（HTML/CSS vs Word），
  // 沒辦法做到像素級一模一樣，但內容、順序、結構是一致的。
  // =========================================================
  function xmlEscape(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }
  // 一個段落。size 用「點」為單位（Word 內部是半點，所以要 ×2）。
  function docxP(text, o){
    o = o || {};
    const pPr = [];
    if(o.pageBreakBefore) pPr.push('<w:pageBreakBefore/>');
    if(o.align) pPr.push(`<w:jc w:val="${o.align}"/>`);
    if(o.bottomBorder) pPr.push('<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="1" w:color="333333"/></w:pBdr>');
    // 表格格子裡的段落不要沿用全域的段後間距（不然每一列下面都多一塊
    // 空白、看起來忽高忽低）；留白改由格子本身的內距（tcMar）負責。
    if(o.inTable) pPr.push('<w:spacing w:before="0" w:after="0"/>');
    const pPrXml = pPr.length ? `<w:pPr>${pPr.join('')}</w:pPr>` : '';
    const rPr = [];
    if(o.bold) rPr.push('<w:b/>');
    if(o.size) rPr.push(`<w:sz w:val="${o.size*2}"/><w:szCs w:val="${o.size*2}"/>`);
    if(o.color) rPr.push(`<w:color w:val="${o.color}"/>`);
    const rPrXml = rPr.length ? `<w:rPr>${rPr.join('')}</w:rPr>` : '';
    const t = String(text == null ? '' : text);
    if(!t) return `<w:p>${pPrXml}</w:p>`;
    return `<w:p>${pPrXml}<w:r>${rPrXml}<w:t xml:space="preserve">${xmlEscape(t)}</w:t></w:r></w:p>`;
  }
  // ---- Word 數學公式（OMML）----
  // Word 內建的公式格式，可以排出真正「分子在上、分母在下、中間一條
  // 橫線」的分數，而不是用括號和斜線硬湊成一行。<m:f> 就是分數，
  // <m:num> 是分子、<m:den> 是分母。
  function ommlRun(text){
    const t = String(text == null ? '' : text);
    if(!t) return '';
    return `<m:r><m:t xml:space="preserve">${xmlEscape(t)}</m:t></m:r>`;
  }
  function ommlFrac(num, den){
    return `<m:f><m:fPr><m:type m:val="bar"/></m:fPr>` +
      `<m:num>${ommlRun(num)}</m:num><m:den>${ommlRun(den)}</m:den></m:f>`;
  }
  // 把 parseFracTokens 拆出來的 token 串，轉成一整段 Word 公式段落。
  function docxMathPara(tokens, o){
    o = o || {};
    const inner = tokens.map(tk =>
      tk.t === 'frac' ? ommlFrac(tk.num, tk.den) : ommlRun(tk.v)
    ).join('');
    if(!inner) return docxP('');
    const pPr = o.pageBreakBefore ? '<w:pPr><w:pageBreakBefore/></w:pPr>' : '';
    return `<w:p>${pPr}<m:oMathPara><m:oMath>${inner}</m:oMath></m:oMathPara></w:p>`;
  }
  // 一行文字：有分數就走公式段落，沒有就走一般段落。
  function docxLineAuto(line, o){
    const tokens = parseFracTokens(line);
    const hasFrac = tokens.some(tk => tk.t === 'frac');
    if(hasFrac) return docxMathPara(tokens, o);
    return docxP(line, o);
  }

  function docxCell(text, o){
    o = o || {};
    const w = o.width ? `<w:tcW w:w="${o.width}" w:type="dxa"/>` : '<w:tcW w:w="0" w:type="auto"/>';
    // 每一格自己也留內距（單位是 dxa，1440 dxa = 1 英吋），文字才不會
    // 緊貼著格線；段落本身的 spacing 也留一點上下距離。
    const mar = '<w:tcMar>' +
      '<w:top w:w="80" w:type="dxa"/><w:left w:w="140" w:type="dxa"/>' +
      '<w:bottom w:w="80" w:type="dxa"/><w:right w:w="140" w:type="dxa"/></w:tcMar>';
    return `<w:tc><w:tcPr>${w}${mar}<w:vAlign w:val="center"/></w:tcPr>` +
      docxP(text, {bold:o.bold, size:o.size||11, align:o.align||'center', inTable:true}) + `</w:tc>`;
  }
  // borderless=true 用在「製品名／秤量日期」那種只是拿來左右分排、
  // 不需要格線的表格。
  function docxTable(rows, colWidths, borderless){
    const sz = borderless ? 0 : 6;
    const val = borderless ? 'none' : 'single';
    const grid = colWidths.map(w => `<w:gridCol w:w="${w}"/>`).join('');
    // 每一列給一個最小高度，加上上面每格的內距，整體看起來才不會擠成
    // 一團、文字黏在格線上。
    const trPr = borderless ? '' : '<w:trPr><w:trHeight w:val="420" w:hRule="atLeast"/></w:trPr>';
    const body = rows.map(cells => `<w:tr>${trPr}${cells.join('')}</w:tr>`).join('');
    // tblCellMar 是整張表格的預設內距（每一格沒特別設定時會套用這個）
    const cellMar = '<w:tblCellMar>' +
      '<w:top w:w="80" w:type="dxa"/><w:left w:w="140" w:type="dxa"/>' +
      '<w:bottom w:w="80" w:type="dxa"/><w:right w:w="140" w:type="dxa"/></w:tblCellMar>';
    return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>` +
      `<w:top w:val="${val}" w:sz="${sz}" w:color="000000"/><w:left w:val="${val}" w:sz="${sz}" w:color="000000"/>` +
      `<w:bottom w:val="${val}" w:sz="${sz}" w:color="000000"/><w:right w:val="${val}" w:sz="${sz}" w:color="000000"/>` +
      `<w:insideH w:val="${val}" w:sz="${sz}" w:color="000000"/><w:insideV w:val="${val}" w:sz="${sz}" w:color="000000"/>` +
      `</w:tblBorders>${cellMar}</w:tblPr><w:tblGrid>${grid}</w:tblGrid>${body}</w:tbl>`;
  }

  async function exportToDocx(batchNo, weighDate, nameOverride, includeDerivation){
    if(typeof JSZip === 'undefined'){
      alert('Word 匯出功能需要先連上網路（第一次使用時要下載相關程式庫），請確認網路連線後再試一次。');
      return;
    }
    const proj = PROJECTS.find(pr => pr.id === currentProjectId);
    const titleLine = nameOverride || (proj ? proj.label : '');
    const validProducts = products.filter(p => resultsState[p.key]);

    let x = '';
    // 標題 ＋ 製造批號 ＋ 分隔線 ＋ 製品名／秤量日期（跟 PDF 版同樣順序）
    x += docxP('原 料 換 算 項 目', {bold:true, size:18, align:'center'});
    x += docxP(`製造批號：${batchNo}`, {size:12, bottomBorder:true});
    x += docxTable([[
      docxCell(`製品名：${titleLine}`, {align:'left', size:12, width:5400}),
      docxCell(`秤量日期：${weighDate}`, {align:'right', size:12, width:3600})
    ]], [5400, 3600], true);
    x += docxP('');

    // 計算結果：每個品名各自一張表格
    x += docxP('計算結果', {bold:true, size:14});
    validProducts.forEach((p, idx) => {
      const collected = collectExportRowsForProduct(p);
      if(!collected) return;
      x += docxP(validProducts.length > 1 ? `品名${idx+1}：${p.name}` : `品名：${p.name}`, {size:11});
      const headerTexts = ['分析號碼', '使用量'];
      const widths = [1300, 1700];
      if(collected.hasContent){ headerTexts.push(collected.contentLabel); widths.push(1600); }
      if(collected.hasRowRatio){ headerTexts.push(collected.rowRatioLabel); widths.push(1600); }
      if(collected.hasWater){ headerTexts.push('水份'); widths.push(1300); }
      const headerRow = headerTexts.map(h => docxCell(h, {bold:true}));
      const dataRows = collected.rows.map(r => {
        const cells = [docxCell(String(r.idx)), docxCell(r.usage)];
        if(collected.hasContent) cells.push(docxCell(r.content));
        if(collected.hasRowRatio) cells.push(docxCell(r.ratio));
        if(collected.hasWater) cells.push(docxCell(r.water));
        return cells;
      });
      x += docxTable([headerRow, ...dataRows], widths);
      x += docxP('');
    });

    x += docxP('作業者：＿＿＿＿＿＿＿＿　　覆核者：＿＿＿＿＿＿＿＿', {size:12});
    x += docxP('');

    // 補正換算公式（每個品名一段）：用 Word 的公式格式排出真正的分數
    x += docxP('補正換算公式', {bold:true, size:12});
    validProducts.forEach((p, idx) => {
      if(!resultsState[p.key]) return;
      const ff = getExportFormulaFraction(p, true);
      if(validProducts.length > 1) x += docxP(`品名${idx+1}：${p.name}`, {size:11});
      if(ff.factors && ff.factors.length){
        const tokens = [{t:'txt', v: `使用量 = ${ff.lead} `}];
        ff.factors.forEach((f, i) => {
          if(i > 0) tokens.push({t:'txt', v:' × '});
          tokens.push({t:'frac', num: f.num, den: f.den});
        });
        x += docxMathPara(tokens);
      } else if(ff.lead){
        x += docxP(ff.lead, {size:12});
      }
      if(ff.extraLine) x += docxP(ff.extraLine, {size:12});
    });
    x += docxP('');

    x += docxP('※本結果僅供輔助參考，不能取代人工複核，請依原始公式與數據自行人工複算並找幹部覆核。', {size:10});
    x += docxP('');
    EXPORT_TERMS_LINES.forEach(t => { x += docxP(t, {size:10}); });

    // 推導過程另外分頁放在最後。有分數的行走 Word 公式格式（上下分數），
    // 純文字的行走一般段落。
    if(includeDerivation){
      const lines = derivationExportLines();
      if(lines.length){
        x += docxP('推導過程', {bold:true, size:14, pageBreakBefore:true});
        lines.forEach(l => { x += docxLineAuto(l, {size:11}); });
      }
    }

    const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"><w:body>${x}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;

    const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="DFKai-SB" w:hAnsi="DFKai-SB" w:eastAsia="標楷體" w:cs="DFKai-SB"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="60"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;

    const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;

    const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;

    const docRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;

    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypesXml);
    zip.folder('_rels').file('.rels', relsXml);
    const wordFolder = zip.folder('word');
    wordFolder.file('document.xml', documentXml);
    wordFolder.file('styles.xml', stylesXml);
    wordFolder.folder('_rels').file('document.xml.rels', docRelsXml);

    const blob = await zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      compression: 'DEFLATE'
    });
    downloadBlob(blob, `原料換算_${batchNo}.docx`);
  }

  exportModalConfirm.addEventListener('click', function(){
    const batchNo = exportBatchInput.value.trim();
    if(!batchNo){
      exportBatchError.classList.remove('hidden');
      exportBatchInput.focus();
      return;
    }
    const includeDerivation = !!exportIncludeDerivation.checked;

    // NAZAL SPRAY 系列產品：下拉選單有選的話用選到的名稱取代印出來的
    // 製品名；沒有這個下拉選單（一般項目）或沒選就是 undefined，
    // buildExportHtml 自己會退回用 proj.label。
    const nameOverride = (!exportNameOverrideRow.classList.contains('hidden') && exportNameOverride.value)
      ? exportNameOverride.value
      : undefined;
    const formatEl = document.querySelector('input[name="exportFormat"]:checked');
    const format = formatEl ? formatEl.value : 'pdf';

    saveLastExportBatch(batchNo);
    // 不管匯出成哪種格式，都算是「這批已經正式匯出過」，一樣存一筆帶
    // 批號的歷史紀錄（跟「計算當下」那筆batchNo=null的紀錄分開存，

    products.forEach(p => saveHistoryRows(p, batchNo));

  // =========================================================
  // 查詢歷史紀錄：跟匯出用同一個 Supabase 連線，差別是這裡是「讀取」，
  // RLS 規則允許 anon 查詢（但不允許修改/刪除），所以任何人打開這個
  // 工具都能查得到，但沒辦法改掉或刪掉別人存的紀錄。
  // =========================================================
  const queryHistoryBtn = document.getElementById('queryHistoryBtn');
  const queryModalBackdrop = document.getElementById('queryModalBackdrop');
  const queryModalClose = document.getElementById('queryModalClose');
  const queryModalSearch = document.getElementById('queryModalSearch');
  const queryDateFrom = document.getElementById('queryDateFrom');
  const queryDateTo = document.getElementById('queryDateTo');
  const queryProjectLabel = document.getElementById('queryProjectLabel');
  const queryProductName = document.getElementById('queryProductName');
  const queryBatchNo = document.getElementById('queryBatchNo');
  const queryError = document.getElementById('queryError');
  const queryResultsEl = document.getElementById('queryResults');

  // 取得今天的日期，格式跟 <input type="date"> 要的一樣（YYYY-MM-DD），
  // 開始/結束日期預設都帶入今天，省得每次都要自己點選。
  function todayDateStr(){
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  // 組出「品名」下拉選單的選項：如果有指定製品名，只列出該製品名底下
  // 的品名；沒指定（全部）就把所有製品名裡的品名攤平、去重複後全部列出。
  // 「全部」這個選項 value 是空字串，代表查詢時不加這個篩選條件，
  // 品名欄位留空一樣可以查（查全部），不會因為是下拉選單就變成一定要選。
  function populateProductNameOptions(projectLabelVal){
    const names = [];
    PROJECTS.forEach(proj => {
      if(projectLabelVal && proj.label !== projectLabelVal) return;
      proj.products.forEach(p => {
        if(!names.includes(p.name)) names.push(p.name);
      });
    });
    queryProductName.innerHTML = '<option value="">全部</option>' +
      names.map(n => `<option value="${n}">${n}</option>`).join('');
  }

  function populateProjectLabelOptions(){
    // 依英文字母 A-Z 排序（用 localeCompare 比較，忽略大小寫），
    // 不照 PROJECTS 陣列原本的設定順序列出。
    const sortedLabels = PROJECTS.map(proj => proj.label)
      .sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
    queryProjectLabel.innerHTML = '<option value="">全部</option>' +
      sortedLabels.map(label => `<option value="${label}">${label}</option>`).join('');
  }

  // 製品名一改變，品名選單要跟著換成該製品名底下的品名選項。
  queryProjectLabel.addEventListener('change', function(){
    populateProductNameOptions(queryProjectLabel.value);
  });

  function openQueryModal(){
    queryError.classList.add('hidden');
    // 每次打開預設帶入「目前這個製品名」，省得每次都要自己選一次；
    // 使用者仍然可以改選「全部」或其他製品名。
    populateProjectLabelOptions();
    const proj = PROJECTS.find(pr => pr.id === currentProjectId);
    queryProjectLabel.value = proj ? proj.label : '';
    populateProductNameOptions(queryProjectLabel.value);
    queryProductName.value = '';
    queryBatchNo.value = '';
    // 開始/結束日期預設都是今天，通常是想查「今天存了哪些紀錄」；
    // 要查更早的資料，自己改開始日期就好。
    const today = todayDateStr();
    queryDateFrom.value = today;
    queryDateTo.value = today;
    queryResultsEl.innerHTML = '';
    queryModalBackdrop.classList.remove('hidden');
  }
  function closeQueryModal(){
    queryModalBackdrop.classList.add('hidden');
  }
  if(queryHistoryBtn) queryHistoryBtn.addEventListener('click', openQueryModal);
  queryModalClose.addEventListener('click', closeQueryModal);
  queryModalBackdrop.addEventListener('click', function(e){
    if(e.target === queryModalBackdrop) closeQueryModal();
  });

  function fmtQueryNum(v){
    if(v === null || v === undefined) return '—';
    const n = Number(v);
    const r2 = Math.round(n * 100) / 100;
    return (Math.abs(r2 - Math.round(r2)) < 1e-9) ? String(Math.round(r2)) : r2.toFixed(2);
  }

  async function runHistoryQuery(){
    if(!sb){
      queryError.textContent = '目前無法連線到歷史紀錄資料庫，請稍後再試。';
      queryError.classList.remove('hidden');
      return;
    }
    queryError.classList.add('hidden');
    queryResultsEl.innerHTML = '<div class="query-results-meta">查詢中…</div>';

    let q = sb.from(HISTORY_TABLE).select('*').order('created_at', { ascending: false }).limit(300);
    const from = queryDateFrom.value;
    const to = queryDateTo.value;
    const projectLabelVal = queryProjectLabel.value.trim();
    const productNameVal = queryProductName.value.trim();
    const batchNoVal = queryBatchNo.value.trim();
    // 開始日期用當天 00:00，結束日期用「隔一天的00:00之前」，這樣結束
    // 日期當天整天的紀錄才會包含進去（不會因為只比到日期本身的00:00
    // 而漏掉當天下午才存的紀錄）。
    if(from) q = q.gte('created_at', `${from}T00:00:00`);
    if(to){
      const toDate = new Date(`${to}T00:00:00`);
      toDate.setDate(toDate.getDate() + 1);
      q = q.lt('created_at', toDate.toISOString());
    }
    if(projectLabelVal) q = q.ilike('project_label', `%${projectLabelVal}%`);
    if(productNameVal) q = q.ilike('product_name', `%${productNameVal}%`);
    if(batchNoVal) q = q.ilike('batch_no', `%${batchNoVal}%`);

    try{
      const { data, error } = await q;
      if(error) throw error;
      if(!data || !data.length){
        queryResultsEl.innerHTML = '<div class="query-results-meta">查無符合條件的歷史紀錄。</div>';
        return;
      }
      // 先把每一列的「含量」「力價」「水份」算出來，才能知道這次查詢
      // 結果裡，這三欄是不是整欄都沒有值（例如查Heparin時「含量」跟
      // 「水份」整欄都是—，查INON GREEN時「力價」整欄都是—）。整欄
      // 都沒有值的欄位，直接不顯示，省下沒必要佔用的版面空間。
      const rowsParsed = data.map(r => {
        const time = r.created_at ? new Date(r.created_at).toLocaleString('zh-TW', { hour12:false }) : '—';
        // 「含量」跟「力價」拆成兩個獨立欄位：同一列只會有其中一欄有
        // 數字，另一欄顯示「—」，依這筆紀錄自己存的 content_label 裡
        // 有沒有「力價」兩個字來判斷要放進哪一欄（Heparin、ADC這類
        // 品名的欄位名稱本來就叫力價，就會歸進力價欄；其他預設叫
        // 「含量%」的品名就歸進含量欄）。
        let contentCell = '—';
        let potencyCell = '—';
        if(r.content_value != null){
          const label = r.content_label || '含量%';
          const unit = label.indexOf('%') !== -1 ? '%' : '';
          const num = fmtQueryNum(r.content_value) + unit;
          if(label.indexOf('力價') !== -1){
            potencyCell = num;
          } else {
            contentCell = num;
          }
        }
        const waterCell = r.water_value != null ? fmtQueryNum(r.water_value) + '%' : '—';
        return { r, time, contentCell, potencyCell, waterCell };
      });
      const anyContentCol = rowsParsed.some(x => x.contentCell !== '—');
      const anyPotencyCol = rowsParsed.some(x => x.potencyCell !== '—');
      const anyWaterCol = rowsParsed.some(x => x.waterCell !== '—');

      const rowsHtml = rowsParsed.map(({r, time, contentCell, potencyCell, waterCell}) => {
        return `<tr>
          <td class="qc-time"><span class="qc-cell-text">${time}</span></td>
          <td class="qc-project"><span class="qc-cell-text">${r.project_label || '—'}</span></td>
          <td class="qc-product"><span class="qc-cell-text">${r.product_name || '—'}</span></td>
          <td>${r.batch_no || '（未填）'}</td>
          <td>${r.group_index || '—'}/${r.group_count || '—'}</td>
          <td>${fmtQueryNum(r.usage_value)}${r.usage_unit ? ' '+r.usage_unit : ''}</td>
          ${anyContentCol ? `<td>${contentCell}</td>` : ''}
          ${anyPotencyCol ? `<td>${potencyCell}</td>` : ''}
          ${anyWaterCol ? `<td>${waterCell}</td>` : ''}
          <td>${fmtQueryNum(r.std_value)}${r.std_unit ? ' '+r.std_unit : ''}</td>
        </tr>`;
      }).join('');
      // 時間／製品名／品名這三欄內容通常很長（尤其是製品名跟完整時間戳記），
      // 佔掉大部分螢幕寬度，其他欄位（批號、使用量...）就要一直往右滑才看得到。
      // 幫這三欄各自加一個「收起／展開」小三角形：收起時欄寬只跟標題文字
      // 一樣窄（用省略號截斷內容），展開時恢復完整顯示，讓使用者自己選擇
      // 要優先看哪些欄位，不用整張表都攤開才能捲動。
      queryResultsEl.innerHTML = `
        <div class="query-results-meta">共 ${data.length} 筆（最多顯示300筆）</div>
        <div class="query-table-scroll">
          <table class="query-table" id="queryResultTable">
            <thead><tr>
              <th class="qc-time"><span>時間</span><button type="button" class="qc-toggle" data-col="qc-time" aria-label="收起/展開時間欄">◀</button></th>
              <th class="qc-project"><span>製品名</span><button type="button" class="qc-toggle" data-col="qc-project" aria-label="收起/展開製品名欄">◀</button></th>
              <th class="qc-product"><span>品名</span><button type="button" class="qc-toggle" data-col="qc-product" aria-label="收起/展開品名欄">◀</button></th>
              <th>批號</th><th>分析號碼</th><th>使用量</th>
              ${anyContentCol ? '<th>含量</th>' : ''}
              ${anyPotencyCol ? '<th>力價</th>' : ''}
              ${anyWaterCol ? '<th>水份</th>' : ''}
              <th>標準值</th>
            </tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
      wireQueryColumnToggles();
    } catch(e){
      queryError.textContent = '查詢失敗，請確認網路連線後再試一次。';
      queryError.classList.remove('hidden');
      queryResultsEl.innerHTML = '';
      console.warn('歷史紀錄查詢失敗：', e);
    }
  }
  queryModalSearch.addEventListener('click', runHistoryQuery);

  // 幫查詢結果表格裡「時間／製品名／品名」這三個欄位的收起/展開小三角形
  // 綁點擊事件。因為表格每次查詢都會整個重新產生（innerHTML整段換掉），
  // 每次查完都要重新綁一次，不能只綁一次就沒事。
  function wireQueryColumnToggles(){
    const table = document.getElementById('queryResultTable');
    if(!table) return;
    table.querySelectorAll('.qc-toggle').forEach(btn => {
      btn.addEventListener('click', function(){
        const col = btn.dataset.col;
        const collapsed = table.classList.toggle(`collapsed-${col}`);
        // 三角形固定是「◀」這個符號，收起時用CSS轉90度變成指向右邊，
        // 代表「按這裡可以再展開回來」，不用換成不同的符號字元。
        btn.classList.toggle('is-collapsed', collapsed);
      });
    });
  }

  // =========================================================
  // renderApp：切換下拉選單時，整頁品名卡片重新產生
  // =========================================================
  // 結果表表頭：含量／力價%（標示值）欄位的名稱，若品名有 basisToggle，
  // 用目前切換到的那個基準的名稱；抽成獨立函式，切換基準鈕按下去時
  // 也要重新呼叫這個函式，讓表頭文字跟著換。
  function buildResultHeader(){
    const anyContent = products.some(p => p.hasContent !== false);
    const anyWater = products.some(p => p.hasWater);
    const anyRowRatio = products.some(p => p.rowRatio);
    const contentLabels = [...new Set(
      products.filter(p => p.type !== 'complement' && p.hasContent !== false)
              .map(p => {
                const bc = getBasisCfg(p);
                return ((bc && bc.contentLabel) || p.contentLabel || '含量%').replace('%','');
              })
    )];
    const contentHeader = contentLabels.length ? contentLabels.join('／') : '含量';
    const rowRatioLabels = [...new Set(
      products.filter(p => p.type !== 'complement' && p.rowRatio)
              .map(p => {
                const bc = getBasisCfg(p);
                return (bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%';
              })
    )];
    const rowRatioHeader = rowRatioLabels.length ? rowRatioLabels.join('／') : '力價%';
    resultHeadRow.innerHTML = `
      ${products.length > 1 ? '<th></th>' : ''}<th class="col-analysis">分析號碼</th><th>使用量</th>
      ${anyContent ? `<th>${contentHeader}</th>` : ''}
      ${anyWater ? '<th>水份</th>' : ''}
      ${anyRowRatio ? `<th>${rowRatioHeader}</th>` : ''}<th>標準值</th>
    `;
  }

  function renderApp(project){
    products = project.products.map((p, idx) => {
      const merged = Object.assign({key: 'p'+idx, _Y: 0, _scrolled: false}, p);
      if(merged.ratioNum != null && merged.ratioDen != null){
        merged.ratio = merged.ratioNum / merged.ratioDen;
      }
      if(merged.basisToggle){
        merged._basis = merged.basisDefault || merged.basisToggle[0].key;
        merged._basisCache = {};
      }
      return merged;
    });
    resultsState = {};

    const anyWater = products.some(p => p.hasWater);
    const anyContent = products.some(p => p.hasContent !== false);
    const anyRowRatio = products.some(p => p.rowRatio);
    products.forEach(p => { p._anyWater = anyWater; p._anyContent = anyContent; p._anyRowRatio = anyRowRatio; });

    // 品名清單
    productsSub.innerHTML = products
      .map((p,i) => `<span><span class="ps-label">品名${products.length>1 ? (i+1) : ''}</span>：${p.name}</span>`)
      .join('');

    // 結果卡片內、表格上方的品名對照：不論項目底下有幾個品名都會顯示，
    // 只有一個品名時標示「品名」，多個品名時標示「品名1」「品名2」...
    nameLegend.innerHTML = products
      .map((p,i) => `<span><span class="ps-label">${products.length>1 ? '品名'+(i+1) : '品名'}</span>：<b>${p.name}</b></span>`)
      .join('');

    // 「推導過程」鍵：只有在項目設定裡標記 showDerivation:true 才會顯示
    // （目前只有 HEPARIN SODIUM OINTMENT 這個項目用到，之後如需為其他
    // 項目開啟，只要在該項目設定加上 showDerivation:true 即可）
    derivationBtn.classList.toggle('hidden', !project.showDerivation);
    derivationBtn.textContent = '推導過程';
    derivationPanel.classList.add('hidden');
    derivationPanel.innerHTML = '';

    // 結果表表頭（含量欄位若整個項目都沒用到，整欄不顯示；水份欄位同理）
    buildResultHeader();

    // 品名卡片
    let html = '';
    products.forEach((p, i) => {
      const isComplement = (p.type === 'complement');
      const isEditableTotal = !!p.editableStandardTotal;
      const isEditableRatio = !isComplement && !!p.editableRatio;
      const stdUnit = p.standardUnit || p.complementUnit || '';
      const ratioLabel = p.ratioLabel || '係數';

      const { formulaHtml, subFormulaHtml, formulaNoteText, noteLineHtml, formulaIntroHtml } = buildFormulaBoxParts(p);

      const yLabelText = '分析號碼數量';
      const stdPlaceholder = p.standardPlaceholder != null ? p.standardPlaceholder : 450;
      const stdFieldHtml = isEditableTotal ? `
        <div>
          <label for="std-${p.key}">標準值${stdUnit ? `(${stdUnit})` : ''}</label>
          <div class="field-with-preset">
            <input type="number" step="any" id="std-${p.key}" placeholder="例:${stdPlaceholder}">
            <button type="button" class="btn-preset" id="stdPreset-${p.key}" data-preset="${stdPlaceholder}">預設</button>
          </div>
        </div>
      ` : '';

      const ratioPlaceholder = p.ratioPlaceholder != null ? p.ratioPlaceholder : 1;
      const ratioFieldHtml = isEditableRatio ? `
        <div>
          <label for="ratio-${p.key}">${ratioLabel}</label>
          <div class="field-with-preset">
            <input type="number" step="any" id="ratio-${p.key}" placeholder="例:${ratioPlaceholder}">
            <button type="button" class="btn-preset" id="ratioPreset-${p.key}" data-preset="${ratioPlaceholder}">預設</button>
          </div>
        </div>
      ` : '';

      // 標準值／係數這類欄位放在「確定」按鈕之後、第一組組別欄位之前，
      // 而且永遠可以編輯（不會因為按過確定就鎖住）：這樣需要臨時修改
      // 某個數字再重算時，只要改完直接按「計算」就好，不用整個清除重填。
      //
      // 補充欄位（標準值／係數）跟「計算」鍵，在使用者按過「確定」之前先隱藏起來，
      // 避免第一次使用的人一次看到太多按鍵、欄位而不知所措。
      const extraFieldsRowHtml = (isEditableTotal || isEditableRatio) ? `
        <div class="extra-fields-row hidden" id="extra-${p.key}">
          ${stdFieldHtml}
          ${ratioFieldHtml}
        </div>
      ` : '';

      const stepAndGroupsHtml = `
        <div class="step">
          <div>
            <label for="y-${p.key}">${yLabelText}</label>
            <input type="number" id="y-${p.key}" min="1" max="7" step="1" placeholder="例:2">
          </div>
          <button class="btn-primary" id="confirm-${p.key}" style="background:${idxColor(i)};color:#fff;">確定</button>
          <button class="btn-clear-small" id="clear-${p.key}">清除</button>
        </div>
        ${extraFieldsRowHtml}
        <div class="groups" id="groups-${p.key}"></div>
      `;

      const bcCard = getBasisCfg(p);
      const basisToggleBtnHtml = p.basisToggle
        ? `<button type="button" class="btn-basis-toggle" id="basisToggle-${p.key}">${bcCard.label} ⇄</button>`
        : '';
      // 「範例」按鈕：只要品名設定了 exampleImageKey 就會出現，跟
      // basisToggle（VitA／VitD3 切換）是各自獨立的功能，不互相依賴。
      const exampleBtnHtml = p.exampleImageKey
        ? `<button type="button" class="btn-diagram" id="exampleBtn-${p.key}">範例</button>`
        : '';
      const cardExtraRowHtml = (basisToggleBtnHtml || exampleBtnHtml) ? `
        <div class="basis-toggle-row">
          ${basisToggleBtnHtml}
          ${exampleBtnHtml}
        </div>
      ` : '';

      html += `
        <section class="product-card" id="card-${p.key}">
          <div class="card-header">
            <h2>${products.length>1 ? '品名：' : ''}${p.name}</h2>
            <button type="button" class="btn-toggle-card" id="toggle-${p.key}" aria-label="收起／展開">▼</button>
          </div>
          ${cardExtraRowHtml}
          <div class="formula">
            ${formulaIntroHtml}
            ${noteLineHtml}
            <div class="formula-row">${formulaHtml}</div>
            ${subFormulaHtml ? `<div class="formula-row">${subFormulaHtml}</div>` : ''}
          </div>
          <div class="collapsible-body" id="body-${p.key}">
            ${formulaNoteText ? `
              <button type="button" class="btn-note-toggle" id="noteToggle-${p.key}">說明 <span class="note-arrow">▼</span></button>
              <div class="note formula-note-body hidden" id="noteBody-${p.key}">${formulaNoteText}</div>
            ` : ''}
            ${stepAndGroupsHtml}
            <div class="action-row hidden" id="action-${p.key}">
              <button class="btn-calc-small" id="calc-${p.key}">計算</button>
            </div>
            <div class="error" id="err-${p.key}"></div>
            <div class="soft-warning hidden" id="warn-${p.key}"></div>
          </div>
        </section>
      `;
    });
    productsContainer.innerHTML = html;

    resultBody.innerHTML = '';
    resultCard.classList.add('hidden');

    // 綁定事件
    products.forEach(p => {
      const isComplement = (p.type === 'complement');
      const errEl = document.getElementById(`err-${p.key}`);
      const warnEl = document.getElementById(`warn-${p.key}`);
      const calcBtn = document.getElementById(`calc-${p.key}`);
      const clearBtn = document.getElementById(`clear-${p.key}`);
      const yInput = document.getElementById(`y-${p.key}`);
      const confirmBtn = document.getElementById(`confirm-${p.key}`);
      const groupsEl = document.getElementById(`groups-${p.key}`);
      const stdInputEl = document.getElementById(`std-${p.key}`);
      const ratioInputEl = document.getElementById(`ratio-${p.key}`);
      const extraRowEl = document.getElementById(`extra-${p.key}`);
      const actionRowEl = document.getElementById(`action-${p.key}`);
      const stdPresetBtn = document.getElementById(`stdPreset-${p.key}`);
      const ratioPresetBtn = document.getElementById(`ratioPreset-${p.key}`);
      const toggleCardBtn = document.getElementById(`toggle-${p.key}`);
      const bodyEl = document.getElementById(`body-${p.key}`);

      // 收起/展開：收起時只留品名跟公式，其餘欄位、按鍵、結果都先藏起來，
      // 方便畫面上有多個品名時可以先收起暫時不用的品名，減少捲動負擔。
      if(toggleCardBtn && bodyEl){
        toggleCardBtn.addEventListener('click', function(){
          const collapsed = bodyEl.classList.toggle('hidden');
          toggleCardBtn.classList.toggle('is-collapsed', collapsed);
        });
      }

      // 「VitA基準／VitD3基準」切換鈕：只有設定了 basisToggle 的品名才會有
      // 這顆按鈕（目前沒有品名在用 basisToggle，見設定區的說明）。
      // 切換時：
      //   1) 先把目前這個基準底下已經填的「標示值」「力價%」「使用量」
      //      存進 p._basisCache，之後切回這個基準可以還原，不用重填。
      //   2) 換成另一個基準，公式框、每組輸入欄位的名稱／預設值都要跟著換。
      //   3) 如果新基準之前有存過快取，直接還原回去；沒有的話留空
      //      （可以按輸入框旁邊的「預設」快速鍵重新帶入預設標示值）。
      //   4) 換基準代表「含量」的實際意義變了，之前算出來的結果不再適用，
      //      清掉、請使用者重新按一次「計算」。
      const basisToggleBtn = document.getElementById(`basisToggle-${p.key}`);
      const exampleBtn = document.getElementById(`exampleBtn-${p.key}`);
      const formulaBoxEl = document.querySelector(`#card-${p.key} .formula`);

      if(basisToggleBtn && p.basisToggle){
        basisToggleBtn.addEventListener('click', function(){
          const count = p._Y || 0;
          p._basisCache = p._basisCache || {};
          if(count > 0){
            p._basisCache[p._basis] = captureGroupValues(count);
          }

          const otherCfg = p.basisToggle.find(b => b.key !== p._basis) || p.basisToggle[0];
          p._basis = otherCfg.key;
          basisToggleBtn.textContent = `${otherCfg.label} ⇄`;

          if(formulaBoxEl){
            const parts = buildFormulaBoxParts(p);
            formulaBoxEl.innerHTML = `
              ${parts.formulaIntroHtml}
              ${parts.noteLineHtml}
              <div class="formula-row">${parts.formulaHtml}</div>
              ${parts.subFormulaHtml ? `<div class="formula-row">${parts.subFormulaHtml}</div>` : ''}
            `;
          }

          if(count > 0){
            buildGroups(groupsEl, count, p);
            const cached = p._basisCache[p._basis];
            if(cached) restoreGroupValues(cached, count);
          }

          resultsState[p.key] = null;
          const autoBoxEl = document.getElementById(`autoUsage-${p.key}`);
          if(autoBoxEl){
            autoBoxEl.textContent = '計算後自動回推';
            autoBoxEl.classList.remove('filled');
          }
          if(warnEl){ warnEl.textContent = ''; warnEl.classList.add('hidden'); }
          renderResults();
          buildResultHeader();
          persistState();
        });
      }

      // 「範例」按鈕：顯示這個品名設定的範例照片（p.exampleImageKey），
      // 跟 basisToggle 完全無關，只要有設定 exampleImageKey 就會出現。
      if(exampleBtn && p.exampleImageKey){
        exampleBtn.addEventListener('click', function(){
          openImageModal('範例', p.exampleImageKey);
        });
      }

      // 「說明」按鈕：預設收起，點一下展開補差型品名的詳細規則說明，
      // 再點一次收回，沒有框線跟底色，只有文字＋三角形。
      const noteToggleBtn = document.getElementById(`noteToggle-${p.key}`);
      const noteBodyEl = document.getElementById(`noteBody-${p.key}`);
      if(noteToggleBtn && noteBodyEl){
        noteToggleBtn.addEventListener('click', function(){
          const isHidden = noteBodyEl.classList.toggle('hidden');
          noteToggleBtn.classList.toggle('is-open', !isHidden);
        });
      }

      // 「預設」鍵：改成「按一下投入預設值、再按一下清除」這種切換式行為，
      // 而不是只能單向填入。判斷方式很單純：如果輸入框目前的值剛好等於
      // 預設值，代表這次要清除；否則就填入預設值。這樣不管按幾次都會
      // 一填一清交替下去，不用另外記錄「按了幾次」的狀態。
      function togglePreset(inputEl, presetStr){
        const current = inputEl.value.trim();
        if(current !== '' && Number(current) === Number(presetStr)){
          inputEl.value = '';
        } else {
          inputEl.value = presetStr;
        }
        persistState();
      }

      if(stdPresetBtn && stdInputEl){
        stdPresetBtn.addEventListener('click', function(){
          togglePreset(stdInputEl, stdPresetBtn.dataset.preset);
        });
      }
      if(ratioPresetBtn && ratioInputEl){
        ratioPresetBtn.addEventListener('click', function(){
          togglePreset(ratioInputEl, ratioPresetBtn.dataset.preset);
        });
      }

      // 任何欄位輸入時都即時儲存目前狀態，避免手機/電腦版切換時資料消失
      groupsEl.addEventListener('input', persistState);
      if(stdInputEl) stdInputEl.addEventListener('input', persistState);
      if(ratioInputEl) ratioInputEl.addEventListener('input', persistState);

      // 力價%這類「每組各自輸入」的比例欄位，旁邊的「預設」字樣按鈕：
      // 用事件委派綁在 groupsEl 上（而不是每個按鈕各自綁一次），因為
      // buildGroups 每次重新產生分析號碼欄位時，裡面的按鈕都是全新的
      // DOM節點，綁在 groupsEl 這個外層容器上才不會失效。同樣是切換式：
      // 按一下投入預設值、再按一下清除。
      groupsEl.addEventListener('click', function(e){
        const btn = e.target.closest('.btn-row-preset');
        if(!btn) return;
        const i = btn.dataset.i;
        const input = groupsEl.querySelector(`.ratio-input[data-i="${i}"]`);
        if(input){
          togglePreset(input, btn.dataset.preset);
        }
      });

      // 「分析號碼數量」改成隨時可以修改，不會因為按過一次「確定」就鎖住。
      // 重新產生欄位時盡量保留原本已經填好的參數：
      //   - 組數增加：原本已填的組別（含量%／水份%／使用量）都保留，
      //     多出來的新組別留空；原本的「最後一組」如果不再是最後一組，
      //     會變成一般組別，含量%／水份%保留，但使用量要重新手動輸入
      //     （因為它原本是系統自動回推欄位，本來就沒有使用量可以保留）。
      //   - 組數減少：保留的組別（前面 N 組）維持原值；被刪掉的組別
      //     直接捨棄。原本保留下來的最後一組如果變成新的「最後一組」，
      //     它的使用量欄位會變回自動回推，不需要保留原本手動填的使用量。
      function captureGroupValues(count){
        const arr = [];
        for(let i=0;i<count;i++){
          const usageEl = groupsEl.querySelector(`.usage-input[data-i="${i}"]`);
          const contentEl = groupsEl.querySelector(`.content-input[data-i="${i}"]`);
          const waterEl = groupsEl.querySelector(`.water-input[data-i="${i}"]`);
          const ratioEl = groupsEl.querySelector(`.ratio-input[data-i="${i}"]`);
          arr.push({
            usage: usageEl ? usageEl.value : '',
            content: contentEl ? contentEl.value : '',
            water: waterEl ? waterEl.value : '',
            ratio: ratioEl ? ratioEl.value : ''
          });
        }
        return arr;
      }

      function restoreGroupValues(savedValues, newCount){
        const restoreCount = Math.min(savedValues.length, newCount);
        for(let i=0;i<restoreCount;i++){
          const saved = savedValues[i];
          const isNewLast = (i === newCount - 1);
          const contentEl = groupsEl.querySelector(`.content-input[data-i="${i}"]`);
          const waterEl = groupsEl.querySelector(`.water-input[data-i="${i}"]`);
          const ratioEl = groupsEl.querySelector(`.ratio-input[data-i="${i}"]`);
          if(contentEl && saved.content !== '') contentEl.value = saved.content;
          if(waterEl && saved.water !== '') waterEl.value = saved.water;
          if(ratioEl && saved.ratio !== '') ratioEl.value = saved.ratio;
          if(!isNewLast){
            const usageEl = groupsEl.querySelector(`.usage-input[data-i="${i}"]`);
            if(usageEl && saved.usage !== '') usageEl.value = saved.usage;
          }
        }
      }

      confirmBtn.addEventListener('click', function(){
        errEl.textContent = '';

        const val = parseInt(yInput.value, 10);
        if(!val || val < 1){
          errEl.textContent = '請輸入大於等於 1 的整數。';
          return;
        }
        if(val > 7){
          errEl.textContent = '分析號碼數量不可超過 7 組。';
          return;
        }

        const oldY = p._Y || 0;
        const savedValues = oldY > 0 ? captureGroupValues(oldY) : [];

        p._Y = val;
        buildGroups(groupsEl, val, p);
        restoreGroupValues(savedValues, val);

        // 組數改變後，之前算出來的結果已經對不上新的欄位了，先清掉，
        // 等使用者重新按「計算」再產生新的結果。
        resultsState[p.key] = null;
        renderResults();

        // 確定後才顯示這個品名的其他輸入欄位（標準值／係數）與「計算」鍵，
        // 避免第一次使用的人一次看到太多按鍵、欄位而不知所措。
        if(extraRowEl) extraRowEl.classList.remove('hidden');
        if(actionRowEl) actionRowEl.classList.remove('hidden');

        // 若這個品名在此組數下完全沒有欄位需要手動輸入（例如分析號碼數量=1，
        // 又沒有含量%、沒有水份%），就不需要使用者再按一次「計算」，直接算出結果。
        if(needsNoInput(p, val)){
          calcBtn.click();
        }
        persistState();
      });

      calcBtn.addEventListener('click', function(){
        errEl.textContent = '';
        if(warnEl){ warnEl.textContent = ''; warnEl.classList.add('hidden'); }
        try{
          // 標準值／係數這類欄位永遠可以編輯，每次按「計算」都重新讀取目前
          // 畫面上的數字，這樣臨時要改某個數值再重算，不用清除重填。
          if(p.editableStandardTotal){
            const stdRaw = stdInputEl ? stdInputEl.value.trim() : '';
            const stdVal = parseFloat(stdRaw);
            if(stdRaw === '' || isNaN(stdVal)){
              throw new Error('請輸入有效的標準值。');
            }
            if(isComplement){
              p.complementTotal = stdVal;
            } else {
              p.standardTotal = stdVal;
            }
          }
          if(p.editableRatio){
            const ratioRaw = ratioInputEl ? ratioInputEl.value.trim() : '';
            const ratioVal = parseFloat(ratioRaw);
            if(ratioRaw === '' || isNaN(ratioVal)){
              throw new Error(`請輸入有效的${p.ratioLabel || '係數'}。`);
            }
            p.ratio = ratioVal;
          }

          // 補差型品名（例如 Lactose）依賴參照品名（例如 Sucralfate）的結果，
          // 所以每次按「計算」都順便幫使用者重新按一次參照品名的「計算」鍵，
          // 確保用的是參照品名「目前」欄位裡的數字，而不是它上一次算出來、
          // 可能已經過時的舊結果（例如使用者後來又改了 Sucralfate 的數字，
          // 但忘記重新按 Sucralfate 自己的計算鍵）。
          if(isComplement){
            const refProduct = products.find(x => x.name === p.referTo);
            if(refProduct){
              const refCalcBtn = document.getElementById(`calc-${refProduct.key}`);
              if(refCalcBtn) refCalcBtn.click();
            }
          }

          resultsState[p.key] = isComplement
            ? calcComplementProduct(p, groupsEl)
            : calcStandardProduct(p, groupsEl);
          renderResults();

          // 含量%超過100%不擋計算，只是提醒使用者再確認一次數字有沒有填錯
          // （例如多打一位數，或跟水份%填反了）。
          const overRows = resultsState[p.key]
            .map((r,idx) => r.contentOver100 ? (idx+1) : null)
            .filter(n => n !== null);
          if(warnEl){
            if(overRows.length){
              const bcWarn = getBasisCfg(p);
              const cLabelText = ((bcWarn && bcWarn.contentLabel) || p.contentLabel || '含量%').replace('%','');
              const rowsText = overRows.length === 1 ? `第 ${overRows[0]} 組` : `第 ${overRows.join('、')} 組`;
              warnEl.textContent = `⚠ ${rowsText}的${cLabelText}%超過 100%，請再次確認數字是否填寫正確（計算仍會照填入的數字進行）。`;
              warnEl.classList.remove('hidden');
            } else {
              warnEl.textContent = '';
              warnEl.classList.add('hidden');
            }
          }

          // 把回推出來的使用量，用紅字顯示在最後一組原本寫「計算後自動回推」的欄位裡，
          // 欄位背景不變，只是把提示文字換成實際算出來的數字。
          const data = resultsState[p.key];
          const autoBoxEl = document.getElementById(`autoUsage-${p.key}`);
          if(autoBoxEl && data && data.length){
            autoBoxEl.textContent = data[data.length-1].usage.toFixed(2);
            autoBoxEl.classList.add('filled');
          }

          // 只有「清除後的第一次計算」才自動跳轉到結果表格；同一次確定期間
          // 之後不管修改什麼欄位再按計算，畫面都不會再跳轉，除非按了清除／
          // 全部清除重置這個標記。閃爍提示則不受此限制，每次都會出現。
          if(!p._scrolled){
            smoothScrollToElement(resultCard);
            p._scrolled = true;
          }
          resultCard.classList.remove('flash-highlight');
          void resultCard.offsetWidth; // 強制重新排版，讓動畫可以重新觸發
          resultCard.classList.add('flash-highlight');
          persistState();
          // 只要這次算出來的是有效的紅字結果，就順便存一筆歷史紀錄
          // （這時候還沒有批號，batchNo傳null；真正匯出時會再存一次
          // 帶批號的版本）。這一步失敗也不影響上面的計算/畫面更新。
          saveHistoryRows(p, null);
        } catch(err){
          errEl.textContent = err.message || '輸入有誤，請檢查所有欄位是否已填寫且為有效數字。';
        }
      });

      clearBtn.addEventListener('click', function(){
        p._Y = 0;
        p._scrolled = false;
        yInput.value = '';
        yInput.disabled = false;
        confirmBtn.disabled = false;
        if(stdInputEl){ stdInputEl.value = ''; stdInputEl.disabled = false; }
        if(ratioInputEl){ ratioInputEl.value = ''; ratioInputEl.disabled = false; }
        if(extraRowEl) extraRowEl.classList.add('hidden');
        if(actionRowEl) actionRowEl.classList.add('hidden');
        groupsEl.innerHTML = '';
        errEl.textContent = '';
        if(warnEl){ warnEl.textContent = ''; warnEl.classList.add('hidden'); }
        resultsState[p.key] = null;
        renderResults();
        persistState();
      });
    });

    restoreState(project);
  }

  // ---------- 初始載入：優先還原上次選到的項目；沒有的話預設顯示 NAZAL SPRAY ----------
  loadKeepParamsSetting();
  const savedAll = loadAll();
  const DEFAULT_HOME_PROJECT_ID = 'nazal_spray_lavender';
  const initialProject = (savedAll.lastProjectId && PROJECTS.find(p => p.id === savedAll.lastProjectId))
    || PROJECTS.find(p => p.id === DEFAULT_HOME_PROJECT_ID)
    || PROJECTS[0];
  currentProjectId = initialProject.id;
  updateTriggerDisplay(initialProject);
  renderApp(initialProject);
})();
</script>
