(function(){
  const csTrigger = document.getElementById('csTrigger');
  const csTriggerLabel = document.getElementById('csTriggerLabel');
  const csTriggerCn = document.getElementById('csTriggerCn');
  const csList = document.getElementById('csList');
  const productsSub = document.getElementById('productsSub');
  const productsContainer = document.getElementById('productsContainer');
  const resultCard = document.getElementById('resultCard');
  const resultHeadRow = document.getElementById('resultHeadRow');
  const resultBody = document.getElementById('resultBody');
  const nameLegend = document.getElementById('nameLegend');
  const derivationBtn = document.getElementById('derivationBtn');
  const derivationPanel = document.getElementById('derivationPanel');
  const copyResultBtn = document.getElementById('copyResultBtn');
  const keepParamsToggle = document.getElementById('keepParamsToggle');
  const clearAllBtn = document.getElementById('clearAllBtn');

  let currentProjectId = PROJECTS[0].id;
  let products = [];         // 目前畫面上的品名陣列
  let resultsState = {};

  // ---------- basisToggle 共用小工具：取出品名目前使用中的基準設定 ----------
  // 沒有設定 basisToggle 的品名回傳 null，呼叫端要自己 fallback 回原本的
  // p.contentLabel／p.rowRatioLabel／p.rowRatioDefault／p.contentFormulaLabel。
  function getBasisCfg(p){
    if(!p || !p.basisToggle) return null;
    return p.basisToggle.find(b => b.key === p._basis) || p.basisToggle[0];
  }

  // =========================================================
  // 歷史紀錄（Supabase）：把每次成功算出來的結果，另外存一份到雲端
  // 資料庫，方便日後查核。這一段完全獨立於前面所有計算邏輯，就算
  // 網路不通、Supabase連不上，也只會安靜失敗，不會影響原本換算功能。
  //
  // Publishable key（sb_publis...）本來就設計成可以公開寫在網頁裡，
  // 資料庫那邊已經設定 RLS：只允許「新增(insert)」跟「查詢(select)」，
  // 不允許「修改」「刪除」，所以就算這把key被複製走，最多只能新增
  // 假資料或查看歷史紀錄，沒辦法竄改、刪除已經存在的正式紀錄。
  // =========================================================
  const SUPABASE_URL = 'https://gkshbahhypqrkwiwhjei.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_0Q8PTI7aTgFRVAH4zFC6DQ_QI6sLwny';
  const HISTORY_TABLE = 'calc_history';
  const sb = (window.supabase && typeof window.supabase.createClient === 'function')
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // 判斷一次計算「有沒有算出有效的紅字結果」：最後一組的使用量／標準值
  // 都要是有限、非負的數字才算數。除以0、負數這類無效結果（推導過程裡
  // 會顯示警告的那種），就不回存，避免歷史紀錄裡混進一堆沒意義的垃圾。
  function isValidCalcResult(rows){
    if(!rows || !rows.length) return false;
    const last = rows[rows.length - 1];
    return isFinite(last.usage) && last.usage >= 0 && isFinite(last.std) && last.std >= 0;
  }

  // 節流控制：避免使用者手滑連續按「計算」或「匯出」，把同樣的資料
  // 重複存成好幾筆一模一樣的歷史紀錄。規則（兩條合併判斷）：
  //   1. 這次要存的資料，跟這個品名上一次存的資料完全一樣 → 至少要
  //      間隔 10 秒才能再存一次（避免連點洗出一堆重複紀錄）
  //   2. 資料有任何不同（哪怕只是換了個批號、或某個數字改了）→ 不受
  //      10秒限制，可以馬上存，因為這代表是「真的不一樣的東西」
  // 節流是「每個品名各自獨立計算」（用 p.key 當索引），不是整個網頁
  // 共用一個計時器，所以品名A剛存過，不會卡住品名B也要一起等。
  const HISTORY_SAVE_COOLDOWN_MS = 10000;
  const historySaveThrottle = {};

  function buildHistoryFingerprint(p, batchNo, data){
    // 用「這次真正會寫進資料庫的內容」組成字串來比對是否完全相同，
    // 批號也算進去比對範圍——代表就算計算數字都沒變，只是後來補填
    // 或換了不同批號再匯出，也算是「不同資料」，不受節流限制卡住。
    const parts = data.map(r => [r.usage, r.content, r.contentPercent, r.water, r.ratio, r.std].join(','));
    return `${batchNo || ''}|${parts.join(';')}`;
  }

  function shouldSaveHistoryNow(p, batchNo, data){
    const fp = buildHistoryFingerprint(p, batchNo, data);
    const state = historySaveThrottle[p.key];
    const now = Date.now();
    if(!state){
      historySaveThrottle[p.key] = { time: now, fingerprint: fp };
      return true;
    }
    if(fp !== state.fingerprint){
      historySaveThrottle[p.key] = { time: now, fingerprint: fp };
      return true;
    }
    if(now - state.time >= HISTORY_SAVE_COOLDOWN_MS){
      state.time = now;
      return true;
    }
    return false;
  }

  // 把一個品名目前算好的結果，存成歷史紀錄（每組分析號碼各自一列）。
  // batchNo 為 null 代表「計算當下自動存」，還沒有批號；真正匯出、
  // 輸入批號確認的時候，會再存一次帶批號的版本，兩者都保留，互不取代。
  async function saveHistoryRows(p, batchNo){
    if(!sb) return;
    const data = resultsState[p.key];
    if(!isValidCalcResult(data)) return;
    if(!shouldSaveHistoryNow(p, batchNo, data)) return;
    const proj = PROJECTS.find(pr => pr.id === currentProjectId);
    const hasContent = p.hasContent !== false;
    const bcHist = getBasisCfg(p);
    const rows = data.map((r, idx) => ({
      project_label: proj ? proj.label : null,
      product_name: p.name,
      batch_no: batchNo || null,
      group_index: idx + 1,
      group_count: data.length,
      usage_value: isFinite(r.usage) ? r.usage : null,
      usage_unit: usageUnitOf(p),
      content_label: hasContent ? ((bcHist && bcHist.contentLabel) || p.contentLabel || '含量%') : null,
      content_value: hasContent ? (p.contentIsPercentOfRatio ? r.contentPercent : r.content) : null,
      water_value: p.hasWater ? r.water : null,
      std_value: isFinite(r.std) ? r.std : null,
      std_unit: p.standardUnit || p.complementUnit || null
    }));
    try{
      await sb.from(HISTORY_TABLE).insert(rows);
    } catch(e){
      // 寫入失敗（例如沒網路）不影響原本的計算/匯出功能，安靜略過就好，
      // 不跳錯誤訊息去干擾使用者。
      console.warn('歷史紀錄寫入失敗（不影響原本功能）：', e);
    }
  }

  // 網頁常常會被瀏覽器整個重新載入，JS 記憶體裡的資料就會消失。
  // 這裡把「目前選到的項目」＋「每個品名輸入的內容／計算結果」即時存到
  // localStorage，重新載入頁面時會自動還原，下拉選單也不會跑回預設值。
  // =========================================================
  const STORAGE_KEY = 'rawMaterialCalc_state_v1';

  function loadAll(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
    } catch(e){
      return {};
    }
  }

  function saveAll(all){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    } catch(e){
      // localStorage 無法使用時（例如被瀏覽器封鎖），安靜略過，不影響原本功能
    }
  }

  function saveLastProjectId(){
    const all = loadAll();
    all.lastProjectId = currentProjectId;
    saveAll(all);
  }

  // ---------- 切換品名時，這個頁面的參數要保留還是自動清除
  // （右上角「參數保留」切換鈕，設定會記住）----------
  // ON＝參數保留（切換品名時，離開的頁面資料照常保存）
  // OFF＝自動清除（切換品名時，離開的頁面資料直接清掉）
  // 預設 ON（保留），跟這個功能還沒拆出開關之前的原始行為一致。
  let keepParamsOnSwitch = true;

  function loadKeepParamsSetting(){
    const all = loadAll();
    keepParamsOnSwitch = (all.keepParamsOnSwitch != null) ? !!all.keepParamsOnSwitch : true;
    updateKeepParamsToggleUI();
  }

  function saveKeepParamsSetting(){
    const all = loadAll();
    all.keepParamsOnSwitch = keepParamsOnSwitch;
    saveAll(all);
  }

  function updateKeepParamsToggleUI(){
    keepParamsToggle.classList.toggle('on', keepParamsOnSwitch);
    keepParamsToggle.setAttribute('aria-pressed', keepParamsOnSwitch ? 'true' : 'false');
    keepParamsToggle.innerHTML = `
      <span class="toggle-thumb"></span>
      <span class="toggle-text">${keepParamsOnSwitch ? 'ON' : 'OFF'}</span>
    `;
  }

  keepParamsToggle.addEventListener('click', function(){
    keepParamsOnSwitch = !keepParamsOnSwitch;
    saveKeepParamsSetting();
    updateKeepParamsToggleUI();
  });

  // ---------- 深色模式（右上角太陽/月亮切換鈕，設定會記住） ----------
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  let darkMode = false;

  function loadDarkModeSetting(){
    const all = loadAll();
    darkMode = !!all.darkMode;
    updateThemeToggleUI();
  }

  function saveDarkModeSetting(){
    const all = loadAll();
    all.darkMode = darkMode;
    saveAll(all);
  }

  function updateThemeToggleUI(){
    document.body.classList.toggle('dark-mode', darkMode);
    themeToggle.classList.toggle('on', darkMode);
    themeToggle.setAttribute('aria-pressed', darkMode ? 'true' : 'false');
    themeIcon.textContent = darkMode ? '🌙' : '☀️';
  }

  themeToggle.addEventListener('click', function(){
    darkMode = !darkMode;
    saveDarkModeSetting();
    updateThemeToggleUI();
  });

  loadDarkModeSetting();

  // 計算結果表格下方的「全部清除」：清掉目前這個製品名頁面裡，
  // 所有品名（品名一、品名二…）的輸入欄位與計算結果，並把畫面捲回最上面。
  clearAllBtn.addEventListener('click', function(){
    products.forEach(p => {
      const yInput = document.getElementById(`y-${p.key}`);
      const confirmBtn = document.getElementById(`confirm-${p.key}`);
      const stdInputEl = document.getElementById(`std-${p.key}`);
      const ratioInputEl = document.getElementById(`ratio-${p.key}`);
      const groupsEl = document.getElementById(`groups-${p.key}`);
      const errEl = document.getElementById(`err-${p.key}`);
      const warnEl = document.getElementById(`warn-${p.key}`);
      const extraRowEl = document.getElementById(`extra-${p.key}`);
      const actionRowEl = document.getElementById(`action-${p.key}`);

      p._Y = 0;
      p._scrolled = false;
      if(yInput){ yInput.value = ''; yInput.disabled = false; }
      if(confirmBtn) confirmBtn.disabled = false;
      if(stdInputEl){ stdInputEl.value = ''; stdInputEl.disabled = false; }
      if(ratioInputEl){ ratioInputEl.value = ''; ratioInputEl.disabled = false; }
      if(extraRowEl) extraRowEl.classList.add('hidden');
      if(actionRowEl) actionRowEl.classList.add('hidden');
      if(groupsEl) groupsEl.innerHTML = '';
      if(errEl) errEl.textContent = '';
      if(warnEl){ warnEl.textContent = ''; warnEl.classList.add('hidden'); }
      resultsState[p.key] = null;
    });
    derivationPanel.classList.add('hidden');
    derivationPanel.innerHTML = '';
    derivationBtn.textContent = '推導過程';
    renderResults();
    persistState();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });

  // 「推導過程」鍵：展開/收合說明區域；每次展開都重新產生內容，
  // 確保顯示的是目前最新的計算結果。
  derivationBtn.addEventListener('click', function(){
    const isHidden = derivationPanel.classList.contains('hidden');
    if(isHidden){
      renderDerivationPanel();
      derivationPanel.classList.remove('hidden');
      derivationBtn.textContent = '推導過程 ▲';
      smoothScrollToElement(derivationPanel);
    } else {
      derivationPanel.classList.add('hidden');
      derivationBtn.textContent = '推導過程';
    }
  });

  // 公式互換動畫的播放鍵：因為推導過程內容每次都是整段 innerHTML 重新產生，
  // 用事件委派綁在 derivationPanel 本身（只綁一次），而不是每次重畫都要
  // 重新找按鈕、重新綁定監聽器。
  derivationPanel.addEventListener('click', function(e){
    const btn = e.target.closest('.btn-formula-anim');
    if(!btn) return;
    const key = btn.dataset.animKey;
    const stateA = document.getElementById(`faStateA-${key}`);
    const stateB = document.getElementById(`faStateB-${key}`);
    if(!stateA || !stateB) return;
    const showingB = stateB.classList.contains('is-active');
    stateA.classList.toggle('is-active', showingB);
    stateB.classList.toggle('is-active', !showingB);
    btn.textContent = showingB ? '▶ 播放公式互換動畫' : '◀ 換回原本寫法';
  });

  // 把「目前畫面上」每個品名的輸入內容與計算結果存起來
  function persistState(){
    const projData = {};
    products.forEach(p => {
      const groupsEl = document.getElementById(`groups-${p.key}`);
      const stdInputEl = document.getElementById(`std-${p.key}`);
      const ratioInputEl = document.getElementById(`ratio-${p.key}`);
      const fields = [];
      const count = p._Y || 0;
      if(groupsEl){
        for(let i=0;i<count;i++){
          const usageEl = groupsEl.querySelector(`.usage-input[data-i="${i}"]`);
          const contentEl = groupsEl.querySelector(`.content-input[data-i="${i}"]`);
          const waterEl = groupsEl.querySelector(`.water-input[data-i="${i}"]`);
          const rowRatioEl = groupsEl.querySelector(`.ratio-input[data-i="${i}"]`);
          fields.push({
            usage: usageEl ? usageEl.value : '',
            content: contentEl ? contentEl.value : '',
            water: waterEl ? waterEl.value : '',
            ratio: rowRatioEl ? rowRatioEl.value : ''
          });
        }
      }
      projData[p.key] = {
        Y: count,
        confirmed: count > 0,
        standardInput: stdInputEl ? stdInputEl.value : '',
        ratioInput: ratioInputEl ? ratioInputEl.value : '',
        fields: fields,
        results: resultsState[p.key] || null,
        basis: p.basisToggle ? p._basis : undefined,
        basisCache: p.basisToggle ? p._basisCache : undefined
      };
    });
    const all = loadAll();
    all.lastProjectId = currentProjectId;
    all.projects = all.projects || {};
    all.projects[currentProjectId] = projData;
    saveAll(all);
  }

  function clearStoredProject(projectId){
    const all = loadAll();
    if(all.projects) delete all.projects[projectId];
    saveAll(all);
  }

  // 依儲存的資料把畫面還原成上次離開時的樣子
  function restoreState(project){
    const all = loadAll();
    const projData = all.projects && all.projects[project.id];
    if(!projData) return;

    products.forEach(p => {
      const saved = projData[p.key];
      if(!saved) return;
      const yInput = document.getElementById(`y-${p.key}`);
      const confirmBtn = document.getElementById(`confirm-${p.key}`);
      const stdInputEl = document.getElementById(`std-${p.key}`);
      const ratioInputEl = document.getElementById(`ratio-${p.key}`);
      const groupsEl = document.getElementById(`groups-${p.key}`);
      const extraRowEl = document.getElementById(`extra-${p.key}`);
      const actionRowEl = document.getElementById(`action-${p.key}`);

      if(stdInputEl && saved.standardInput){
        stdInputEl.value = saved.standardInput;
        if(p.editableStandardTotal){
          const v = parseFloat(saved.standardInput);
          if(!isNaN(v)){
            if(p.type === 'complement'){
              p.complementTotal = v;
            } else {
              p.standardTotal = v;
            }
          }
        }
      }

      if(ratioInputEl && saved.ratioInput){
        ratioInputEl.value = saved.ratioInput;
        if(p.editableRatio){
          const rv = parseFloat(saved.ratioInput);
          if(!isNaN(rv)) p.ratio = rv;
        }
      }

      // basisToggle 品名：先把上次選的基準跟快取還原回 p 物件上，這樣底下
      // 呼叫 buildGroups 時，欄位名稱／預設值就會是正確的基準，不用等
      // 使用者自己再按一次切換鈕。卡片上方的公式框、切換鈕文字是
      // renderApp 用「預設基準」畫好的，這裡也要補畫成正確的基準。
      if(p.basisToggle){
        if(saved.basis && p.basisToggle.some(b => b.key === saved.basis)){
          p._basis = saved.basis;
        }
        p._basisCache = saved.basisCache || p._basisCache || {};
        const bcRestore = getBasisCfg(p);
        const basisToggleBtn = document.getElementById(`basisToggle-${p.key}`);
        if(basisToggleBtn && bcRestore) basisToggleBtn.textContent = `${bcRestore.label} ⇄`;
        const formulaBoxEl = document.querySelector(`#card-${p.key} .formula`);
        if(formulaBoxEl){
          const parts = buildFormulaBoxParts(p);
          formulaBoxEl.innerHTML = `
            ${parts.formulaIntroHtml}
            ${parts.noteLineHtml}
            <div class="formula-row">${parts.formulaHtml}</div>
            ${parts.subFormulaHtml ? `<div class="formula-row">${parts.subFormulaHtml}</div>` : ''}
          `;
        }
      }

      if(saved.Y && saved.Y > 0){
        yInput.value = saved.Y;
        p._Y = saved.Y;
        buildGroups(groupsEl, saved.Y, p);
        saved.fields.forEach((f, i) => {
          const usageEl = groupsEl.querySelector(`.usage-input[data-i="${i}"]`);
          const contentEl = groupsEl.querySelector(`.content-input[data-i="${i}"]`);
          const waterEl = groupsEl.querySelector(`.water-input[data-i="${i}"]`);
          const rowRatioEl = groupsEl.querySelector(`.ratio-input[data-i="${i}"]`);
          if(usageEl && f.usage !== '') usageEl.value = f.usage;
          if(contentEl && f.content !== '') contentEl.value = f.content;
          if(waterEl && f.water !== '') waterEl.value = f.water;
          if(rowRatioEl && f.ratio !== '') rowRatioEl.value = f.ratio;
        });
        if(saved.confirmed){
          if(extraRowEl) extraRowEl.classList.remove('hidden');
          if(actionRowEl) actionRowEl.classList.remove('hidden');
        }
      }

      if(saved.results){
        resultsState[p.key] = saved.results;
        const autoBoxEl = document.getElementById(`autoUsage-${p.key}`);
        if(autoBoxEl && saved.results.length){
          autoBoxEl.textContent = saved.results[saved.results.length-1].usage.toFixed(2);
          autoBoxEl.classList.add('filled');
        }
      }
    });

    buildResultHeader();
    renderResults();
  }

  // 頁面即將關閉／重新整理前，做最後一次保存（保險機制）
  window.addEventListener('beforeunload', persistState);

  // 自訂捲動：改成瞬間跳轉，不要有滑動感（原本用 smooth 動畫，
  // 使用者反映滑動感看了不舒服，改成直接跳到定位）。
  // SCROLL_DURATION_MS 保留但不再使用動畫，設為 0 代表瞬間跳轉；
  // 若之後想改回有滑動感的捲動，把這個值調大、並在下面 smoothScrollToElement
  // 裡改回動畫版本即可。
  const SCROLL_DURATION_MS = 0;
  function smoothScrollToElement(el){
    if(!el) return;
    const startY = window.pageYOffset || document.documentElement.scrollTop;
    const targetY = startY + el.getBoundingClientRect().top - 12; // 12px 留一點上緣間距
    window.scrollTo(0, targetY);
  }

  // ---------- 自訂下拉選單 ----------
  function fmtNum(n){
    if(n === null || n === undefined) return '';
    return Number(n).toLocaleString('en-US', {maximumFractionDigits: 6});
  }

  function buildOptionList(){
    csList.innerHTML = '';
    const sortedProjects = [...PROJECTS].sort((a, b) => a.label.localeCompare(b.label));
    sortedProjects.forEach(proj => {
      const opt = document.createElement('div');
      opt.className = 'cs-option' + (proj.id === currentProjectId ? ' active' : '');
      opt.innerHTML = `
        <div class="cs-option-label">${proj.label}</div>
        ${proj.nameCn ? `<div class="cs-option-cn">${proj.nameCn}</div>` : ''}
      `;
      opt.addEventListener('click', function(){
        // 切換前先處理製品名頁面資料：
        // 「參數保留」開啟(ON)：只保存「離開的那個」頁面，正常照舊。
        // 「參數保留」關閉(OFF)：不只清掉「離開的那個」頁面，也要把
        // 「要進去的那個」頁面之前留下來的舊資料一併清掉——不然如果
        // 那個頁面是之前開著「保留」時存下來的，切過去還是會被還原
        // 回來，OFF 就形同虛設了。
        if(keepParamsOnSwitch){
          persistState();
        } else {
          clearStoredProject(currentProjectId);
          clearStoredProject(proj.id);
        }
        currentProjectId = proj.id;
        updateTriggerDisplay(proj);
        closeList();
        renderApp(proj);
        saveLastProjectId();
      });
      csList.appendChild(opt);
    });
  }

  function updateTriggerDisplay(proj){
    csTriggerLabel.textContent = proj.label;
    csTriggerCn.textContent = proj.nameCn || '';
    csTriggerCn.style.display = proj.nameCn ? 'block' : 'none';
  }

  function openList(){ csList.classList.remove('hidden'); buildOptionList(); }
  function closeList(){ csList.classList.add('hidden'); }

  csTrigger.addEventListener('click', function(e){
    e.stopPropagation();
    if(csList.classList.contains('hidden')) openList(); else closeList();
  });
  document.addEventListener('click', function(){ closeList(); });

  // ---------- 共用工具 ----------
  function getVal(container, className, index){
    const el = container.querySelector(`.${className}[data-i="${index}"]`);
    const raw = el ? el.value.trim() : '';
    if(raw === '') throw new Error('請完整填寫所有欄位後再計算。');
    const num = parseFloat(raw);
    if(isNaN(num)) throw new Error('請輸入有效的數字。');
    return num;
  }

  function idxColor(i){
    const palette = ['#3f6b4a', '#6b4a3f', '#3f5a6b', '#5a3f6b', '#6b5a3f'];
    return palette[i % palette.length];
  }

  function fracPiece(numHtml, denHtml){
    return `<span class="frac"><span class="num">${numHtml}</span><span class="den">${denHtml}</span></span>`;
  }

  // 組出一個品名的「公式框」內容（主公式 + 力價%換算的第二行 + 補充說明文字），
  // 品名卡片畫面跟「匯出紀錄單」的PDF都呼叫這個共用函式，確保兩邊顯示的
  // 公式永遠一致，不用維護兩份重複的邏輯。
  function buildFormulaBoxParts(p, useActualTotal){
    const isComplement = (p.type === 'complement');
    const isEditableTotal = !!p.editableStandardTotal;
    const isEditableRatio = !isComplement && !!p.editableRatio;
    const stdUnit = p.standardUnit || p.complementUnit || '';
    const ratioLabel = p.ratioLabel || '係數';

    let formulaHtml;
    let subFormulaHtml = '';
    let formulaNoteText = '';
    if(isComplement){
      // 匯出時（useActualTotal），如果使用者已經在畫面上輸入框填過批次
      // 總重量，直接把那個數字代進公式裡顯示，比印出一句「標準值(g)」
      // 空泛的文字更清楚，一看就知道這批實際的總量是多少。畫面上平常
      // 顯示（沒有 useActualTotal）維持原本的通用寫法。
      const totalTextC = (isEditableTotal && !(useActualTotal && isFinite(p.complementTotal)))
        ? ('標準值' + (stdUnit ? `(${stdUnit})` : ''))
        : (fmtNum(p.complementTotal) + (p.complementUnit || ''));
      if(p.complementMode === 'increase'){
        formulaHtml = `<span>使用量總和 = ${totalTextC} − ${p.referTo} 增加量</span>`;
        formulaNoteText = `「${p.referTo}」換算後的增加量 ＝「${p.referTo}」總使用量 − 「${p.referTo}」標準值；若「${p.name}」的分析號碼數量 &gt; 1：「${p.name}」前面組別請填「使用量」，「${p.name}」最後一組會自動用「${totalTextC} − 「${p.referTo}」增加量 − 「${p.name}」前面組別使用量加總」算出。`;
      } else {
        formulaHtml = `<span>使用量總和 = ${totalTextC} − ${p.referTo} 總使用量</span>`;
        formulaNoteText = `若「${p.name}」的分析號碼數量 &gt; 1：「${p.name}」前面組別請填「使用量」，「${p.name}」最後一組會自動用「${totalTextC} − 「${p.referTo}」總使用量 − 「${p.name}」前面組別使用量加總」算出。`;
      }
    } else {
      // 同上，匯出時如果使用者已經輸入過標準值，直接顯示實際數字。
      const totalText = (isEditableTotal && !(useActualTotal && isFinite(p.standardTotal)))
        ? ('標準值' + (stdUnit ? `(${stdUnit})` : ''))
        : (fmtNum(p.standardTotal) + (p.standardUnit || ''));
      const hasContent = p.hasContent !== false;
      const hasRowRatio = !!p.rowRatio;
      const bc = getBasisCfg(p);
      const contentFormulaLabel = (bc && bc.contentFormulaLabel) || p.contentFormulaLabel || '含量(%)';

      const pieces = [];
      if(hasContent){
        // 有 basisToggle 的品名（VitA／VitD3 兩種基準可切換）比例每次可能不同，
        // 顯示欄位名稱比較保險；沒有 basisToggle、單純固定用某一種基準的
        // 品名（例如 NOARL ADC CHEWABLE），直接顯示標示值的預設數字
        // （例如 20000）更直覺，不用看欄位名稱猜數字。
        const numHtml = isEditableRatio ? ratioLabel
          : (hasRowRatio ? (bc ? (bc.rowRatioLabel || '力價%') : fmtNum(p.rowRatioDefault))
          : fmtNum(p.ratio));
        pieces.push(fracPiece(numHtml, contentFormulaLabel));
      } else if(p.ratioNum != null && p.ratioDen != null){
        pieces.push(fracPiece(fmtNum(p.ratioNum), fmtNum(p.ratioDen)));
      } else if(p.ratio !== 1){
        pieces.push(`<span>${fmtNum(p.ratio)}</span>`);
      }
      if(p.hasWater){
        pieces.push(fracPiece('100', '100 − 水份(%)'));
      }

      const allPieces = [`<span>使用量 = ${totalText}</span>`, ...pieces];
      formulaHtml = allPieces.map((h,idx2) => idx2===0 ? h : `<span>×</span>${h}`).join('');

      // 力價%換算型（contentIsPercentOfRatio）：在同一個公式框裡多加一行，
      // 說明含量(IU/g) 這個數字實際上是怎麼從「標示值 × 力價%」換算出來的，
      // 例如「含量(IU/g) = 20000 × 力價%」，跟主公式放在同一個框內。標示值
      // 直接顯示常數數字（例如 20000），比顯示欄位名稱更直覺；如果這個
      // 品名有 basisToggle（同一品名可能用不同基準，數字不固定），才退回
      // 顯示欄位名稱。若這個品名設定了 declaredValueImageKey（例如標示值
      // 是從原料標籤上抄下來的），這個數字改成一個可以點的按鈕，點下去
      // 顯示對應的標籤照片（見 IU_DIAGRAMS），方便對照數字是從哪裡抄的。
      if(hasContent && p.contentIsPercentOfRatio){
        const rowRatioText = (bc && bc.contentLabel) || p.contentLabel || '力價%';
        // 這一行「含量(IU/g) = 標示值 × 力價%」維持顯示欄位名稱（例如
        // 「Vit D₃標示值(IU/g)」），不要改成常數數字 20000；按下去依然可以
        // 開啟對應的標籤照片（見 IU_DIAGRAMS）。
        const declaredLabelText = hasRowRatio ? ((bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%') : fmtNum(p.ratio);
        const ratioNumHtml = (hasRowRatio && p.declaredValueImageKey)
          ? `<button type="button" class="btn-inline-declared" data-declared-key="${p.key}">${declaredLabelText}</button>`
          : declaredLabelText;
        subFormulaHtml = `<span>${contentFormulaLabel} = ${ratioNumHtml} × ${rowRatioText}</span>`;
      }
    }

    // 公式框最上面固定顯示的一句話（例如「採用Vit D₃含量計算」），純粹
    // 說明這個品名固定用哪一種基準／方式計算，跟含量%、水份%輸入欄位
    // 上方那個可收合的「說明」文字（p.note）不一樣，這句是固定顯示、
    // 不能收合的。
    const formulaIntroHtml = p.formulaIntro ? `<div class="formula-row formula-intro-line">${p.formulaIntro}</div>` : '';

    // 補充說明文字（若有）放在公式框「同一個框內、公式之前」，換行顯示，
    // 文字顏色跟公式本身一致（不用另外的淡色 note 樣式）。
    const noteLineHtml = p.note ? `<div class="formula-note-line">${p.note}</div>` : '';

    return { formulaHtml, subFormulaHtml, formulaNoteText, noteLineHtml, formulaIntroHtml };
  }


  // ---------- 判斷這個品名在目前組數下，是否完全不需要手動輸入任何欄位 ----------
  // 只有「分析號碼數量=1」且沒有含量欄位、沒有水份欄位時，唯一一組就是最後一組，
  // 所有欄位都是「自動」，使用者沒有東西可以填，這時候按「確定」後應該直接算出結果。
  function needsNoInput(p, count){
    if(count !== 1) return false;
    const hasContent = p.hasContent !== false;
    const hasWater = !!p.hasWater;
    return !hasContent && !hasWater && !p.rowRatio;
  }

  // ---------- 產生輸入欄位（依 hasContent / hasWater / rowRatio 動態決定欄位數） ----------
  function buildGroups(container, count, p){
    container.innerHTML = '';
    const hasContent = p.hasContent !== false;
    const hasWater = !!p.hasWater;
    const bc = getBasisCfg(p);
    const cLabel = (bc && bc.contentLabel) || p.contentLabel || '含量%';
    // rowRatio：極少數品名（例如 NOARL ADC CHEWABLE）的「比例」本身不是
    // 寫死或整個品名共用一個數字，而是跟含量%、水份%一樣，每個分析號碼
    // 自己有自己的數字（例如每批原料的力價%都不一樣）。這種情況下比例
    // 欄位要放進每一組的輸入格裡，而不是像 editableRatio 那樣放在品名
    // 最上面、全部組別共用同一個數字。若品名有 basisToggle，欄位名稱、
    // 預設值改看目前切換到的基準（bc）。
    const hasRowRatio = !!p.rowRatio;
    const rowRatioLabel = (bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%';
    const rowRatioDefault = (bc && bc.rowRatioDefault != null) ? bc.rowRatioDefault : p.rowRatioDefault;
    const cols = 1 + (hasContent?1:0) + (hasWater?1:0) + (hasRowRatio?1:0);

    function makeFields(isLast){
      const arr = [{placeholder: isLast, cls:'usage-input', label:'使用量'}];
      if(hasContent) arr.push({cls:'content-input', label:cLabel, inputPh:p.contentPlaceholder || ''});
      if(hasWater) arr.push({cls:'water-input', label:'水份%'});
      if(hasRowRatio) arr.push({cls:'ratio-input', label:rowRatioLabel, isRatio:true, presetVal:rowRatioDefault});
      return arr;
    }

    for(let i=0;i<count;i++){
      const isLast = (i === count-1);
      const row = document.createElement('div');
      row.className = 'group-row' + (isLast ? ' is-last' : '');

      // 只有 1 組時（分析號碼數量=1），不需要特別標示「第1組」，
      // 直接省略這行組別標題；2 組以上才逐組標示「第1組」「第2組」...
      if(count > 1){
        const label = document.createElement('div');
        label.className = 'g-label';
        label.textContent = `分析號碼 ${i+1}`;
        row.appendChild(label);
      }

      const grid = document.createElement('div');
      grid.className = `g-grid cols-${cols}`;

      makeFields(isLast).forEach(f => {
        const cell = document.createElement('div');
        cell.className = 'g-cell' + (f.placeholder ? ' placeholder' : '');
        if(f.placeholder){
          cell.innerHTML = `<label>${f.label}</label><div class="ph-box" id="autoUsage-${p.key}">計算後自動回推</div>`;
        } else if(f.isRatio && f.presetVal != null){
          // 力價%這種每組各自輸入的比例欄位，標題旁邊放一個小小的「預設」
          // 字樣按鈕（沒有框、沒有底色，字體大小跟標題一樣，只是灰色），
          // 點一下就把這一組的比例欄位填成常見的預設值，不用自己打一次。
          cell.innerHTML = `<div class="g-label-row"><label>${f.label}</label><button type="button" class="btn-row-preset" data-i="${i}" data-preset="${f.presetVal}">預設</button></div><input type="number" step="any" class="${f.cls}" data-i="${i}">`;
        } else {
          const phAttr = f.inputPh ? ` placeholder="${f.inputPh}"` : '';
          cell.innerHTML = `<label>${f.label}</label><input type="number" step="any" class="${f.cls}" data-i="${i}"${phAttr}>`;
        }
        grid.appendChild(cell);
      });

      row.appendChild(grid);
      container.appendChild(row);
    }
  }

  // ---------- 一般型公式計算（涵蓋 hasContent / hasWater / rowRatio 任意組合，含只有 1 組的情況） ----------
  function calcStandardProduct(p, groupsEl){
    const Y = p._Y;
    if(!Y || Y < 1) throw new Error('請先產生輸入欄位。');
    const hasContent = p.hasContent !== false;
    const hasWater = !!p.hasWater;
    const hasRowRatio = !!p.rowRatio;
    const bc = getBasisCfg(p);

    const rows = [];
    for(let i=0;i<Y;i++) rows.push({usage:0, content:null, water:null, ratio:null, std:0});

    for(let i=0;i<Y-1;i++){
      rows[i].usage = getVal(groupsEl,'usage-input', i);
      if(hasContent) rows[i].content = getVal(groupsEl,'content-input', i);
      if(hasWater) rows[i].water = getVal(groupsEl,'water-input', i);
      if(hasRowRatio) rows[i].ratio = getVal(groupsEl,'ratio-input', i);
    }
    const last = Y-1;
    if(hasContent) rows[last].content = getVal(groupsEl,'content-input', last);
    if(hasWater) rows[last].water = getVal(groupsEl,'water-input', last);
    if(hasRowRatio) rows[last].ratio = getVal(groupsEl,'ratio-input', last);

    // 水份%=100 或含量%<=0 會讓算式除以 0，直接產生 Infinity／NaN，
    // 與其算出一個無意義的數字才在推導過程裡解釋，不如提前擋下來，
    // 直接請使用者把數字改正確再算一次。力價%這種每組各自輸入的比例
    // 欄位也是同樣道理：等於 0 會讓「標準值→使用量」那個方向除以 0。
    for(let i=0;i<Y;i++){
      if(hasWater && rows[i].water >= 100){
        throw new Error(`第 ${i+1} 組的水份%（${rows[i].water}%）不能大於或等於 100%，會導致除以 0。`);
      }
      if(hasContent && rows[i].content <= 0){
        throw new Error(`第 ${i+1} 組的${(bc && bc.contentLabel) || p.contentLabel || '含量%'}（${rows[i].content}）必須大於 0。`);
      }
      if(hasRowRatio && rows[i].ratio <= 0){
        throw new Error(`第 ${i+1} 組的${(bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%'}（${rows[i].ratio}）必須大於 0。`);
      }
    }

    // 含量%超過 100% 在數學上還是算得出結果，不需要像水份%=100 那樣擋下來，
    // 但這通常代表數字填錯了（例如多打一位數、或跟水份%填反），所以只做
    // 「提醒」不做「阻擋」：標記起來，讓呼叫端決定要不要提示使用者再確認。
    // 只有在含量欄位真的是百分比（預設就是 %）時才檢查，像力價(IU/mg)這種
    // 非百分比單位不受這個限制。
    const contentIsPercent = (p.contentUnit != null ? p.contentUnit : '%') === '%';
    if(hasContent && contentIsPercent){
      for(let i=0;i<Y;i++){
        if(rows[i].content > 100) rows[i].contentOver100 = true;
      }
    }

    // 少數品名（例如 CALCALCIN PLUS 的 RIKEN Dry D3-B5N-GP）畫面上輸入的
    // 不是直接的「含量(IU/g)」數字，而是「力價%」（該批相對於標示力價的
    // 百分比，例如 100.9%），實際含量要自己再乘上比例才是真正拿去算式
    // 用的數字：含量(IU/g) = 比例 × 力價% / 100（例如 5000×100.9% = 5045）。
    // 這裡把使用者輸入的原始力價%另外存到 contentPercent，content 欄位
    // 換成換算後的實際含量，這樣下面的公式完全不用改，跟一般直接輸入
    // 含量(IU/g) 的品名走同一套邏輯。若同時搭配 rowRatio（例如 NOARL ADC
    // CHEWABLE 的「標示值」，每組分析號碼各自輸入、可能不一樣），這裡的
    // 「比例」改用每一組自己的 rows[i].ratio，而不是整個品名共用的 p.ratio
    // （下面算使用量時也是用同一組的 rows[i].ratio 當分母，標示值最後會
    // 自然互相抵消，不影響最終使用量，只是用來顯示中間換算過程）。
    if(hasContent && p.contentIsPercentOfRatio){
      for(let i=0;i<Y;i++){
        rows[i].contentPercent = rows[i].content;
        const ratioBase = hasRowRatio ? rows[i].ratio : p.ratio;
        rows[i].content = ratioBase * rows[i].contentPercent / 100;
      }
    }

    let sum = 0;
    // 換算成「標準值」用的分母，跟含量(IU/g)算式裡的「標示值」是兩件事：
    // 含量(IU/g) 用每組自己輸入的標示值（可能因為抄錯或那批標籤真的不同
    // 而跟別組不一樣），但換算成標準值/使用量時，一律固定除以這個品名
    // 本身的參考標準值（例如 20000），不會因為某一組標示值打錯或跟別組
    // 不同就跟著跑掉——公式本身「標準值(g) = 使用量 × 含量(IU/g)/20000」
    // 講的就是這個固定分母，不是每組各自的標示值。
    const fixedRatioForDivision = (hasContent && p.contentIsPercentOfRatio && hasRowRatio)
      ? ((bc && bc.rowRatioDefault != null) ? bc.rowRatioDefault : p.rowRatioDefault)
      : null;
    for(let i=0;i<Y-1;i++){
      const ratioForRow = fixedRatioForDivision != null ? fixedRatioForDivision : (hasRowRatio ? rows[i].ratio : p.ratio);
      let v = rows[i].usage;
      v *= hasWater ? (100 - rows[i].water)/100 : 1;
      v *= hasContent ? (rows[i].content/ratioForRow) : (1/ratioForRow);
      rows[i].std = v;
      sum += v;
    }
    rows[last].std = p.standardTotal - sum;
    const lastRatio = fixedRatioForDivision != null ? fixedRatioForDivision : (hasRowRatio ? rows[last].ratio : p.ratio);
    let u = rows[last].std;
    u *= hasContent ? (lastRatio/rows[last].content) : lastRatio;
    u *= hasWater ? (100/(100-rows[last].water)) : 1;
    rows[last].usage = u;

    return rows;
  }

  // ---------- 補差型計算：先算出「動態標準總量」，再走一般型的加總/回推邏輯 ----------
  function calcComplementProduct(p, groupsEl){
    const ref = products.find(x => x.name === p.referTo);
    if(!ref) throw new Error(`找不到對應品名：${p.referTo}`);
    const refData = resultsState[ref.key];
    if(!refData || !refData.length) throw new Error(`品名「${p.referTo}」尚有欄位待填寫`);

    const refTotalUsage = refData.reduce((s, row) => s + row.usage, 0);

    let deduction;
    if(p.complementMode === 'increase'){
      // 增加量模式：只扣「換算後總使用量」超出「標準值」的那一段差額
      // （原料因為含量/水份的關係，實際用量通常會比標準值多，多出來的部分才要扣）
      if(ref.standardTotal == null){
        throw new Error(`品名「${p.referTo}」尚有欄位待填寫`);
      }
      deduction = refTotalUsage - ref.standardTotal;
    } else {
      // 原本的模式：直接扣「換算後總使用量」
      deduction = refTotalUsage;
    }

    const dynamicTotal = p.complementTotal - deduction;

    // 動態標準總量算出來後，其餘（前面組別加總、最後一組回推）
    // 跟一般型公式完全一樣，直接借用 calcStandardProduct。
    const pseudoP = Object.assign({}, p, { standardTotal: dynamicTotal });
    return calcStandardProduct(pseudoP, groupsEl);
  }

  // =========================================================
  // 推導過程說明（僅供顯示用，不影響計算結果本身）：
  // 把 calcStandardProduct / calcComplementProduct 已經算出來的數字，
  // 用文字＋公式的方式，一步一步說明是怎麼算出來的。
  // 目前由 showDerivation:true 的項目使用（例如 HEPARIN SODIUM OINTMENT）。
  // =========================================================

  // 一般計算出來的數字（使用量、含量%、水份%、標準值...）：
  // 整數就不顯示小數點；有小數就四捨五入到小數第 2 位。
  // 純文字版：整數就不顯示小數點，例如 402 而不是 402.00；非整數固定
  // 顯示到小數第2位。用在結果表格、複製文字、自動回推框這類不需要（也
  // 不能用，因為是 textContent）HTML 標籤的地方。
  // 使用量欄位要顯示的單位。核對過「原料換算項目(確認).xlsx」內全部歷史批次
  // 記錄後，使用量一律是用「g」記錄（不管該品名的標準值單位是什麼，例如
  // Heparin Sodium 標準值是 IU，但使用量還是秤重成 g）。這裡沒有寫死成
  // 純文字 'g'，而是讀 p.usageUnit（沒設定才 fallback 成 'g'），這樣如果
  // 以後真的有品名例外（例如以 mg 或 kg 秤重），只要在 PROJECTS 設定裡
  // 加一個 usageUnit 欄位覆蓋掉就好，不用改這裡的邏輯。
  function usageUnitOf(p){
    return p.usageUnit || 'g';
  }

  function fmtDisplayNum(n){
    if(n === null || n === undefined || isNaN(n)) return '—';
    const num = Number(n);
    const rounded2 = Math.round(num * 100) / 100;
    return (Math.abs(rounded2 - Math.round(rounded2)) < 1e-9) ? String(Math.round(rounded2)) : rounded2.toFixed(2);
  }

  function fmtStepNum(n){
    if(n === null || n === undefined || isNaN(n)) return '—';
    return `<span class="num-nowrap">${fmtDisplayNum(n)}</span>`;
  }

  // 配方裡的比例係數（例如 0.001、100、4.19）：保留原本的精確度，
  // 只是把浮點數運算可能產生的多餘小數位去掉（例如 0.0010 → 0.001），
  // 不會被四捨五入到小數第 2 位，避免像 0.001 這種小係數被誤算成 0.00。
  function fmtRatioNum(n){
    if(n === null || n === undefined || isNaN(n)) return '—';
    const rounded = Math.round(Number(n) * 1e6) / 1e6;
    return `<span class="num-nowrap">${String(rounded)}</span>`;
  }

  // 推導過程內容裡，任何括弧包著數字（或數字運算式，例如分數 219/0.001）
  // 的地方，括弧跟裡面的內容之間都要留半個空白，例如「( 219/0.001 )」、
  // 「標準值 2( 12469641000 )」，統一用這個小工具產生，不要再各自手動組字串。
  function paren(content){
    return `( ${content} )`;
  }

  // 說明「一般型」公式從第 1 組到最後一組的完整分步驟計算過程。
  // totalLabel/totalValue/totalUnit：這個品名實際拿來回推的標準總量
  // （一般型就是 p.standardTotal；補差型則是先算出的「動態標準總量」）。
  // =========================================================
  // 公式互換動畫：只要品名有含量或水份欄位，就自動顯示（不需要另外設定開關）：
  // 用動畫展示「使用量 = 標準值 × 比例/含量(%) × 100/(100−水份(%))」
  // 跟它反過來寫成「標準值 = 使用量 × 含量(%)/比例 × (100−水份(%))/100」
  // 其實是同一件事，只是標準值跟使用量互換位置、兩個分數也跟著上下顛倒。
  // =========================================================
  // 組出「使用量 = 標準值 × 各種係數」跟反過來「標準值 = 使用量 × 各種係數（顛倒）」
  // 這兩排要用到的係數清單（符號版，不是帶入實際數字的版本），依這個品名實際
  // 有沒有含量欄位、有沒有水份欄位動態組合，跟 stdFactors/usageFactors 用的
  // 是同一套邏輯，只是這裡顯示的是欄位名稱本身，不是計算出來的數字。
  function buildSymbolicFactors(p, reversed){
    const hasContentF = p.hasContent !== false;
    const hasWaterF = !!p.hasWater;
    const hasRowRatioF = !!p.rowRatio;
    const ratioIsOneF = !hasRowRatioF && (Number(p.ratio) === 1);
    const bc = getBasisCfg(p);
    const cLabel = (bc && bc.contentFormulaLabel) || p.contentFormulaLabel || '含量(%)';
    // 有些品名的比例本身就是一個分數（例如分子量校正 384.27/438.31），
    // 這種情況要顯示原始的分數，不能顯示成先算出來的小數（0.876708），
    // 不然使用者會看不懂這個小數是怎麼來的。
    const hasRatioFraction = (p.ratioNum != null && p.ratioDen != null);
    // rowRatio（例如標示值)每組各自輸入，理論上是原料標籤上的固定數字
    // （例如 20000），這裡直接顯示這個常數，比顯示欄位名稱更直覺、也跟
    // 使用者實際看到的標籤數字對得起來；如果這個品名有 basisToggle（同一
    // 品名可能用不同基準，數字不固定），才退回顯示欄位名稱。
    const ratioText = hasRowRatioF ? (bc ? ((bc.rowRatioLabel) || p.rowRatioLabel || '力價%') : fmtRatioNum(p.rowRatioDefault)) : fmtRatioNum(p.ratio);
    const waterNum = '100', waterDen = '100 − 水份(%)';
    const parts = [];
    if(hasContentF){
      parts.push(reversed ? {num:cLabel, den:ratioText} : {num:ratioText, den:cLabel});
    } else if(hasRatioFraction){
      const numText = fmtRatioNum(p.ratioNum);
      const denText = fmtRatioNum(p.ratioDen);
      parts.push(reversed ? {num:denText, den:numText} : {num:numText, den:denText});
    } else if(!ratioIsOneF){
      parts.push(reversed ? {num:'1', den:ratioText} : {plain:ratioText});
    }
    if(hasWaterF){
      parts.push(reversed ? {num:waterDen, den:waterNum} : {num:waterNum, den:waterDen});
    }
    return parts;
  }

  function renderFactorHtml(f){
    if(f.plain) return `<span class="fa-plain">${f.plain}</span>`;
    return `<span class="fa-frac"><span class="num">${f.num}</span><span class="den">${f.den}</span></span>`;
  }

  function buildFormulaAnimationHtml(p, defaultReversed){
    const hasContentF = p.hasContent !== false;
    const hasWaterF = !!p.hasWater;
    // 完全沒有含量、也沒有水份欄位的話（例如比例=1的單純情況），沒有什麼
    // 好互換顛倒的，不顯示這個動畫。
    if(!hasContentF && !hasWaterF) return '';

    // 標準值單位有些已經自己帶括號（例如 Heparin 的 standardUnit 設定就是
    // "(IU)"），有些是單純的 "g" 需要自己加括號，這裡統一判斷，避免變成
    // 重複的「((IU))」這種雙層括號。
    const rawUnit = p.standardUnit || '';
    const unit = rawUnit ? (rawUnit.trim().startsWith('(') ? rawUnit : `(${rawUnit})`) : '';

    const forwardFactors = buildSymbolicFactors(p, false);
    const reverseFactors = buildSymbolicFactors(p, true);
    const forwardHtml = forwardFactors.map(f => `<span class="fa-x">×</span>${renderFactorHtml(f)}`).join('');
    const reverseHtml = reverseFactors.map(f => `<span class="fa-x">×</span>${renderFactorHtml(f)}`).join('');

    // 力價%換算型（contentIsPercentOfRatio）：多顯示一行「含量(IU/g) =
    // 20000 × 力價%」，純粹是補充說明含量怎麼換算出來的，不是「使用量↔
    // 標準值」這組互換動畫的一部分，所以固定顯示、不參與播放/顛倒。標示值
    // 直接顯示常數數字（例如 20000），比顯示欄位名稱更直覺；如果這個品名
    // 有 basisToggle（同一品名可能用不同基準，數字不固定），才退回顯示
    // 欄位名稱。
    const bcAnim = getBasisCfg(p);
    const hasRowRatioAnim = !!p.rowRatio;
    const animContentFormulaLabel = (bcAnim && bcAnim.contentFormulaLabel) || p.contentFormulaLabel || '含量';
    const animRowRatioText = (bcAnim && bcAnim.contentLabel) || p.contentLabel || '力價%';
    // 這一行「含量(IU/g) = 標示值 × 力價%」只是說明含量怎麼換算出來的固定
    // 解說，維持顯示欄位名稱（例如「Vit D₃標示值(IU/g)」），不要跟其他地方
    // 一樣改成常數數字 20000。
    const animRatioNumHtml = hasRowRatioAnim ? ((bcAnim && bcAnim.rowRatioLabel) || p.rowRatioLabel || '力價%') : fmtRatioNum(p.ratio);
    const percentOfRatioLineHtml = (hasContentF && p.contentIsPercentOfRatio)
      ? `<div class="fa-static-line">${animContentFormulaLabel} = ${animRatioNumHtml} × ${animRowRatioText}</div>`
      : '';

    // 分析號碼有 2 組以上時，下面逐組列出來的公式都是用「標準值N = 使用量
    // × 係數」這個方向算的（先從已知使用量推標準值，最後一組才反過來從
    // 標準值推使用量），所以這裡預設直接顯示「標準值 = 使用量 × ...」
    // 這個方向（也就是原本要點『播放』才會看到的第二個畫面），跟底下每組
    // 的算法方向一致，不用使用者自己點開才看得到。只有 1 組時，維持原本
    // 「使用量 = 標準值 × ...」的預設方向（跟單組直接反推使用量的算法
    // 方向一致）。使用者仍然可以按「播放」鍵，兩個方向互相切換查看。
    const bIsActive = !!defaultReversed;

    return `
      <div class="formula-anim" id="formAnim-${p.key}">
        <div class="formula-anim-stage">
          ${percentOfRatioLineHtml}
          <div class="fa-anim-area">
            <div class="fa-state fa-state-a ${bIsActive ? '' : 'is-active'}" id="faStateA-${p.key}">
              <span class="fa-usage">使用量</span>
              <span class="fa-eq">=</span>
              <span class="fa-std">標準值${unit}</span>
              ${forwardHtml}
            </div>
            <div class="fa-state fa-state-b ${bIsActive ? 'is-active' : ''}" id="faStateB-${p.key}">
              <span class="fa-std">標準值${unit}</span>
              <span class="fa-eq">=</span>
              <span class="fa-usage">使用量</span>
              ${reverseHtml}
            </div>
          </div>
        </div>
        <button type="button" class="btn-formula-anim" data-anim-key="${p.key}">${bIsActive ? '◀ 換回原本寫法' : '▶ 播放公式互換動畫'}</button>
      </div>
    `;
  }

  function explainStandardSteps(p, rows, totalLabel, totalValue, totalUnit, totalAlreadyExplained, extraDeduction){
    const hasContent = p.hasContent !== false;
    const hasWater = !!p.hasWater;
    const bc = getBasisCfg(p);
    const cLabel = (bc && bc.contentLabel) || p.contentLabel || '含量%';
    const cLabelClean = cLabel.replace('%', '');
    const rowRatioLabelD = (bc && bc.rowRatioLabel) || p.rowRatioLabel || '力價%';
    const contentFormulaLabelD = (bc && bc.contentFormulaLabel) || p.contentFormulaLabel || '含量';
    const cUnit = p.contentUnit != null ? p.contentUnit : '%';
    // 力價%換算型（contentIsPercentOfRatio）：畫面上看到的「含量」數字，
    // 給使用者看的都用他自己填的原始力價%（r.contentPercent），只有實際
    // 代入公式計算那一步（stdFactors/usageFactors）才用換算後的實際含量
    // （r.content），避免使用者看到「力價% 5045%」這種換算過頭、看不懂
    // 的數字。
    const isPercentOfRatio = !!p.contentIsPercentOfRatio;
    const displayContent = (r) => isPercentOfRatio ? r.contentPercent : r.content;
    const Y = rows.length;
    const isSingleGroup = (Y === 1);
    // ratio 剛好等於 1 時，「× (1/1)」或「× 1」這種寫法對算式本身沒有任何影響
    // （乘以 1 等於沒乘），純粹是多餘的文字，推導過程裡就不特別列出來。
    const ratioIsOne = !p.rowRatio && (Number(p.ratio) === 1);
    // 如果這個品名完全沒有水份、沒有含量、比例又剛好是1，代表「標準值」跟
    // 「使用量」其實是同一個數字（沒有做任何轉換）。這種情況下，已知組別的
    // 數值一律用「使用量」稱呼就好，不要另外冒出一個沒解釋過的「標準值」名詞，
    // 造成使用者看不懂兩個名詞到底差在哪裡。
    const noConversion = !hasWater && !hasContent && !p.rowRatio && ratioIsOne;
    const priorValueLabel = noConversion ? '使用量' : '標準值';
    // 每一組自己的標準值（或使用量）現在都會標上組號，例如「標準值 1」「標準值 2」，
    // 用粗體黑字凸顯，方便在後面的扣減公式裡直接引用「是哪一組」的數值，
    // 不會讓好幾個「標準值」看起來像同一個東西。
    const stdLabel = (n) => `<span class="${priorValueLabel === '使用量' ? 'fa-usage' : 'fa-std'}">${priorValueLabel} ${n}</span>`;
    // 「標準值 N(數值)」這種引用，整段要當成一個不可拆開的單位：如果一行放不下，
    // 就整段一起換到下一行，而不是讓「標準值 N」跟後面的數字被硬生生拆成兩行、
    // 前面留一大段空白（中文＋數字混排時，瀏覽器很容易在這種空白處提前斷行）。
    // 已經有好幾組個別的「標準值 N」之後，如果整個目標總量也叫「標準值」，
    // 兩者容易搞混；多組情況下改叫「總標準值」，只有 1 組時不會有這個
    // 命名衝突（因為根本沒有標「標準值 1」這種個別編號），維持原本講法即可。
    const totalDisplayLabel = (totalLabel === '標準值' && !isSingleGroup) ? '總標準值' : totalLabel;
    // totalDisplayLabel 有些情況下本身已經帶了「」（例如「Lactose」總使用量），
    // 這裡統一處理，避免在說明句裡被重複包上第二層「」。
    const quotedTotalLabel = totalDisplayLabel.startsWith('「') ? totalDisplayLabel : `「${totalDisplayLabel}」`;
    let html = '';

    if(totalAlreadyExplained){
      // 已經在外面（例如補差型品名開頭那句專屬說明）完整交代過這個目標總量
      // 跟最後一組怎麼算了，這裡不管單組還是多組都不用再重複講一次。
    } else if(isSingleGroup){
      html += `<div class="deriv-line deriv-intro">${quotedTotalLabel}為 ${fmtStepNum(totalValue)}${totalUnit||''}，只有 1 個分析號碼，直接用這個數字計算使用量。</div>`;
    } else {
      html += `<div class="deriv-line deriv-intro">${quotedTotalLabel}是指這個品名全部分析號碼之${priorValueLabel}加總，也就是目標總量（本例為 ${fmtStepNum(totalValue)}${totalUnit||''}）；最後 1 個分析號碼的使用量就是用這個目標總量，扣掉前面全部已知分析號碼的${priorValueLabel}，再帶入公式計算出來的。</div>`;
    }

    // 公式互換動畫：只要這個品名有含量或水份欄位（代表公式裡有分數可以
    // 顛倒），就自動顯示，不用另外設定開關。單純只有減法、沒有任何含量／
    // 水份轉換的品名（例如補差型的 Lactose、Potato Starch）沒有東西可以
    // 顛倒，buildFormulaAnimationHtml 內部會自動判斷回傳空字串跳過。
    html += buildFormulaAnimationHtml(p, !isSingleGroup);

    // 組出「標準值 = 使用量 × 各種係數」這條公式要用到的係數清單；
    // 如果完全沒有係數（沒有水份、沒有含量、比例又剛好是1），代表
    // 標準值其實就直接等於使用量，這種「X = X」的恆等式不用特別寫出來。
    // 有些品名的比例本身就是一個分數（例如分子量校正 384.27/438.31），這種
    // 情況顯示時要用原始的分數，不能顯示成先除好的小數（0.876708），不然
    // 使用者會看不懂這個小數是怎麼來的；跟公式動畫用的是同一套判斷邏輯。
    const hasRatioFraction = (p.ratioNum != null && p.ratioDen != null);
    const ratioNumText = hasRatioFraction ? fmtRatioNum(p.ratioNum) : null;
    const ratioDenText = hasRatioFraction ? fmtRatioNum(p.ratioDen) : null;

    // 換算成標準值/使用量那一步，固定分母的邏輯要跟 calcStandardProduct
    // 完全一致：rowRatio + contentIsPercentOfRatio 的品名，不管每組自己
    // 填的標示值是多少，這裡都固定除以品名本身的參考標準值（例如
    // 20000），不會因為某一組標示值打錯或跟別組不一樣就跟著跑掉。
    const fixedRatioForDivision = (hasContent && p.contentIsPercentOfRatio && p.rowRatio)
      ? ((bc && bc.rowRatioDefault != null) ? bc.rowRatioDefault : p.rowRatioDefault)
      : null;

    function stdFactors(r){
      const factors = [];
      if(hasWater) factors.push(`${paren(`100−${fmtStepNum(r.water)}`)} / 100`);
      if(hasContent){
        const ratioForRow = fixedRatioForDivision != null ? fixedRatioForDivision : (p.rowRatio ? r.ratio : p.ratio);
        factors.push(paren(`${fmtStepNum(r.content)} / ${fmtRatioNum(ratioForRow)}`));
      } else if(hasRatioFraction){
        // 這個方向（使用量→標準值）用的是比例的倒數，分數也要跟著上下顛倒
        factors.push(paren(`${ratioDenText} / ${ratioNumText}`));
      } else if(!ratioIsOne){
        factors.push(paren(`1 / ${fmtRatioNum(p.ratio)}`));
      }
      return factors;
    }
    // 組出「使用量 = 標準值 × 各種係數」（回推使用量）要用到的係數清單，道理同上。
    function usageFactors(r){
      const factors = [];
      if(hasContent){
        const ratioForRow = fixedRatioForDivision != null ? fixedRatioForDivision : (p.rowRatio ? r.ratio : p.ratio);
        factors.push(paren(`${fmtRatioNum(ratioForRow)} / ${fmtStepNum(r.content)}`));
      } else if(hasRatioFraction){
        factors.push(paren(`${ratioNumText} / ${ratioDenText}`));
      } else if(!ratioIsOne){
        factors.push(fmtRatioNum(p.ratio));
      }
      if(hasWater) factors.push(`100 / ${paren(`100−${fmtStepNum(r.water)}`)}`);
      return factors;
    }

    for(let i=0;i<Y-1;i++){
      const r = rows[i];
      let known = `<span class="fa-usage">使用量</span> ${fmtStepNum(r.usage)}`;
      if(hasContent) known += `　${cLabelClean} ${fmtStepNum(displayContent(r))}${cUnit === '%' ? '%' : ''}`;
      if(hasWater) known += `　水份 ${fmtStepNum(r.water)}%`;
      if(p.rowRatio) known += `　${rowRatioLabelD} ${fmtStepNum(r.ratio)}`;
      html += `<div class="deriv-group"><div class="deriv-group-header"><div class="deriv-group-title">分析號碼 ${i+1}</div><div class="deriv-line">${known}</div></div>`;
      if(isPercentOfRatio){
        const ratioBaseD = p.rowRatio ? r.ratio : p.ratio;
        html += `<div class="deriv-formula">${contentFormulaLabelD} = ${fmtRatioNum(ratioBaseD)} × ${fmtStepNum(r.contentPercent)}% = ${fmtStepNum(r.content)}</div>`;
      }

      const factors = stdFactors(r);
      if(factors.length){
        html += `<div class="deriv-formula">${stdLabel(i+1)} = ${fmtStepNum(r.usage)} × ${factors.join(' × ')} = ${fmtStepNum(r.std)}</div>`;
      }
      html += `</div>`;
    }

    const knownCount = Y - 1;
    let sumBefore = 0;
    let sumRefText;
    let sumRefLabel = null;
    if(knownCount === 1){
      // 只有一組已知資料時，直接引用「標準值 1」（或「使用量 1」）這個數值，
      // 不用「合計」這種聽起來像多筆加總的說法，避免使用者看不懂只有一個
      // 數字為什麼要「合計」。
      sumBefore = rows[0].std;
      sumRefLabel = stdLabel(1);
      sumRefText = `${sumRefLabel}${paren(fmtStepNum(sumBefore))}`;
    } else if(knownCount >= 2){
      sumBefore = rows.slice(0, knownCount).reduce((s,r) => s + r.std, 0);
      // 兩個以上名詞時，先列出名稱本身（標準值1 + 標準值2 + ...），
      // 再另起一行代入實際數字，避免「名稱(數值)」擠在一起太雜亂。
      const nameTerms = rows.slice(0, knownCount).map((r,idx) => stdLabel(idx+1)).join(' + ');
      const valueTerms = rows.slice(0, knownCount).map(r => fmtStepNum(r.std)).join(' + ');
      html += `<div class="deriv-formula deriv-sum">前面 ${knownCount} 組${priorValueLabel}加總 = ${nameTerms}</div>`;
      html += `<div class="deriv-formula deriv-sum-value">= ${valueTerms} = ${fmtStepNum(sumBefore)}</div>`;
      sumRefLabel = `前面組別${priorValueLabel}加總`;
      sumRefText = `${sumRefLabel}${paren(fmtStepNum(sumBefore))}`;
    } else {
      sumRefText = '0';
    }

    const last = rows[Y-1];
    const redSpan = (v) => `<span class="deriv-usage-result">${v}</span>`;

    // 如果回推出來的結果是負數、或甚至是 Infinity／NaN 這種無效數字
    // （通常是除以 0 造成的，例如水份%填到 100% 讓分母變成 0），
    // 直接說明可能原因，方便使用者快速抓出問題，而不是只看到一個
    // 奇怪的數字卻不知道哪裡有誤。
    function resultWarning(value, reasonHtml){
      if(isFinite(value) && value >= 0) return '';
      const badge = !isFinite(value)
        ? `這個結果不是有效數字（${isNaN(value) ? 'NaN' : (value > 0 ? 'Infinity' : '-Infinity')}）`
        : `這個結果是負數（${fmtStepNum(value)}）`;
      return `<div class="deriv-warning">⚠ ${badge}：${reasonHtml}。請確認實際需要的分析號碼組數，以及前面組別填入的數字是否正確。</div>`;
    }

    // 最後一組的含量%／水份%其實也是使用者自己填的（只有使用量是回推出來的），
    // 跟前面已知組別一樣要顯示出來，不然會讓人以為最後一組沒有這些數據。
    function lastKnownParts(r){
      let parts = [];
      if(hasContent) parts.push(`${cLabelClean} ${fmtStepNum(displayContent(r))}${cUnit === '%' ? '%' : ''}`);
      if(hasWater) parts.push(`水份 ${fmtStepNum(r.water)}%`);
      if(p.rowRatio) parts.push(`${rowRatioLabelD} ${fmtStepNum(r.ratio)}`);
      return parts.join('　');
    }

    // 力價%換算型品名，最後一組（或單組）也要顯示同一句「含量(IU/g) = 比例 ×
    // 力價% = 換算後含量」，跟前面已知組別的顯示方式一致。
    function contentDeriveLine(r){
      if(!isPercentOfRatio) return '';
      const ratioBaseD = p.rowRatio ? r.ratio : p.ratio;
      return `<div class="deriv-formula">${contentFormulaLabelD} = ${fmtRatioNum(ratioBaseD)} × ${fmtStepNum(r.contentPercent)}% = ${fmtStepNum(r.content)}</div>`;
    }

    if(isSingleGroup){
      // 只有 1 組時，這一組本來就等於整個標準總量，不需要「標準值 = 總量 − 0 = 總量」
      // 這種多餘的扣減過程，直接從標準值反推使用量即可。如果完全沒有轉換係數
      // （沒有水份、沒有含量、比例又剛好是1）又沒有額外扣項（extraDeduction），
      // 使用量其實就直接等於目標總量，上面的說明句已經講過這個數字了，這裡
      // 不用再寫一次「使用量 = X = X」的恆等式；但只要有 extraDeduction（例如
      // 補差型要扣掉參照品名的增加量），就不是單純的恆等式了，一定要顯示。
      const lastKnown = lastKnownParts(last);
      if(lastKnown) html += `<div class="deriv-group-header"><div class="deriv-line">${lastKnown}</div></div>`;
      html += contentDeriveLine(last);
      const factors = usageFactors(last);
      if(factors.length || extraDeduction){
        // 補差型品名（單組情況）通常會同時有兩個「有名字」的東西要扣：
        // 目標總量本身（例如「Lactose」標準值(g)）跟參照品名的增加量／
        // 總使用量。兩個都帶著名字擠在同一行容易讓人眼花，這裡用跟多組
        // 情況一樣的規則：只要有 extraDeduction，就拆成「先講名詞、再代
        // 入數字」兩行；如果只是單純的含量／水份係數換算（沒有 extraDeduction），
        // 維持原本一行式寫法即可。
        if(extraDeduction){
          const labelLine = `<span class="fa-usage">使用量</span> = ${totalDisplayLabel} − ${extraDeduction.label}`;
          let valueLine = `= ${fmtStepNum(totalValue)} − ${fmtStepNum(extraDeduction.value)}`;
          if(factors.length) valueLine += ` × ${factors.join(' × ')}`;
          valueLine += ` = ${redSpan(fmtStepNum(last.usage))}`;
          html += `<div class="deriv-formula">${labelLine}</div><div class="deriv-formula">${valueLine}</div>`;
        } else {
          let usageLine = `<span class="fa-usage">使用量</span> = ${totalDisplayLabel}${paren(fmtStepNum(totalValue))}`;
          if(factors.length) usageLine += ` × ${factors.join(' × ')}`;
          usageLine += ` = ${redSpan(fmtStepNum(last.usage))}`;
          html += `<div class="deriv-formula">${usageLine}</div>`;
        }
      }
      html += resultWarning(last.usage, (function(){
        const notFinite = !isFinite(last.usage);
        if(hasWater && last.water >= 100){
          return `因為填入的水份%（${fmtStepNum(last.water)}%）已經達到或超過 100%，導致 (100−水份%) 變成 0${notFinite ? '' : '或負數'}，使得使用量${notFinite ? '變成無限大（除以 0）' : '反推出負值'}；請確認水份%的數字是否填錯（例如多打了一個位數，或單位不對）`;
        }
        if(hasContent && last.content <= 0){
          return `因為填入的${cLabelClean}（${fmtStepNum(displayContent(last))}${cUnit === '%' ? '%' : ''}）是 0 或負數，導致換算出來的使用量${notFinite ? '變成無限大或無效值（可能是除以 0）' : '變成負值'}；請確認這個數字是否填錯`;
        }
        if(!isFinite(totalValue)){
          return `代表${totalDisplayLabel}本身就不是有效數字，這通常是因為推導這個目標總量所用到的其他計算（例如參照品名的總使用量）本身就有問題，請往上檢查相關的推導過程，先把根源的數字改正確`;
        }
        if(extraDeduction && !isFinite(extraDeduction.value)){
          return `代表${extraDeduction.label}本身就不是有效數字，請往上檢查相關品名的推導過程，先把根源的數字改正確`;
        }
        if(extraDeduction && (extraDeduction.value >= totalValue)){
          return `代表${extraDeduction.label}${paren(fmtStepNum(extraDeduction.value))}已經達到、甚至超過${totalDisplayLabel}${paren(fmtStepNum(totalValue))}了，也就是說可能根本不需要再加這個品名`;
        }
        if(totalValue < 0){
          return `代表${totalDisplayLabel}${paren(fmtStepNum(totalValue))}本身就是負數，也就是說目標量在計算這個品名之前可能就已經被扣完、甚至扣過頭了`;
        }
        if(notFinite){
          return `代表計算過程中出現除以 0 的情況，請確認含量%不是 0，水份%也沒有等於或超過 100%`;
        }
        return `${totalDisplayLabel}${paren(fmtStepNum(totalValue))}雖然是正數，但含量／水份等係數換算後讓使用量變成負數，請確認相關數字是否填反了、或單位不對`;
      })());
    } else {
      const lastKnown = lastKnownParts(last);
      html += `<div class="deriv-group"><div class="deriv-group-header"><div class="deriv-group-title">分析號碼 ${Y}</div>${lastKnown ? `<div class="deriv-line">${lastKnown}</div>` : ''}</div>`;
      html += contentDeriveLine(last);
      // 這一組是實際用「總量減去已知組別（以及可能的額外扣項）」算出來的，
      // 如果整個品名都沒有轉換係數（noConversion），這個結果同時也就是使用量
      // （用紅字標示，跟表格一致）；有轉換係數的話，這裡算出來的只是
      // 「標準值」的中間值，還要再下面一行反推使用量，紅字要標在那一行才對。
      const stdResultText = fmtStepNum(last.std);
      const stdResultDisplay = (priorValueLabel === '使用量') ? redSpan(stdResultText) : stdResultText;
      // 只有在真的有 2 個以上不同的扣除項（例如同時有「參照品名的增加量」
      // 跟「前面已知分析號碼的加總」）時，才拆成兩行：第一行先講「扣的是
      // 什麼」，第二行才代入實際數字，避免「名詞(數字)」擠成一長串不好讀；
      // 如果只有 1 個扣除項（多數一般型品名的情況），維持原本的一行式寫法，
      // 沒必要為了只有一項的東西特地拆兩行。
      const terms = [];
      if(extraDeduction) terms.push({label: extraDeduction.label, value: extraDeduction.value});
      if(sumRefLabel) terms.push({label: sumRefLabel, value: sumBefore});

      if(terms.length >= 2){
        const labelLine = `${stdLabel(Y)} = ${totalDisplayLabel} − ${terms.map(t => t.label).join(' − ')}`;
        const valueLine = `= ${fmtStepNum(totalValue)} − ${terms.map(t => fmtStepNum(t.value)).join(' − ')} = ${stdResultDisplay}`;
        html += `<div class="deriv-formula">${labelLine}</div><div class="deriv-formula">${valueLine}</div>`;
      } else {
        const subtractText = terms.length ? `${terms[0].label}${paren(fmtStepNum(terms[0].value))}` : '0';
        html += `<div class="deriv-formula">${stdLabel(Y)} = ${totalDisplayLabel}${paren(fmtStepNum(totalValue))} − ${subtractText} = ${stdResultDisplay}</div>`;
      }
      const priorGroupsRef = (knownCount === 1) ? '分析號碼 1' : `分析號碼 1～${knownCount}`;
      html += resultWarning(last.std, (function(){
        if(!isFinite(totalValue)){
          return `代表${totalDisplayLabel}本身就不是有效數字，這通常是因為推導這個目標總量所用到的其他計算（例如參照品名的總使用量）本身就有問題，請往上檢查相關的推導過程，先把根源的數字改正確`;
        }
        if(extraDeduction && !isFinite(extraDeduction.value)){
          return `代表${extraDeduction.label}本身就不是有效數字，請往上檢查相關品名的推導過程，先把根源的數字改正確`;
        }
        if(!isFinite(last.std)){
          return `代表「${priorGroupsRef}」的${priorValueLabel}加總本身就是無限大或無效值（通常是那一組計算時除以 0 造成的），請往上檢查「${priorGroupsRef}」的含量%／水份%是否有 0 或超過 100% 的情況`;
        }
        if(extraDeduction && extraDeduction.value > 0){
          return `代表${extraDeduction.label}${paren(fmtStepNum(extraDeduction.value))}跟「${priorGroupsRef}」的${priorValueLabel}加總，兩者合計已經達到、甚至超過${totalDisplayLabel}${paren(fmtStepNum(totalValue))}了。也就是說，可能根本不需要用到「分析號碼 ${Y}」這一組（或不需要分那麼多組），也可能是${extraDeduction.label}偏大`;
        }
        return `代表「${priorGroupsRef}」的${priorValueLabel}加總，已經達到、甚至超過${totalDisplayLabel}${paren(fmtStepNum(totalValue))}了。也就是說，可能根本不需要用到「分析號碼 ${Y}」這一組（或不需要分那麼多組），目標量在更早的分析號碼就已經達成`;
      })());

      // 回推使用量：如果完全沒有係數（沒有水份、沒有含量、比例又剛好是1），
      // 使用量其實就直接等於上面剛算出來的標準值，這種「X = X」不用再寫一次。
      const factors = usageFactors(last);
      if(factors.length){
        html += `<div class="deriv-formula"><span class="fa-usage">使用量</span> = ${fmtStepNum(last.std)} × ${factors.join(' × ')} = ${redSpan(fmtStepNum(last.usage))}</div>`;
        if(isFinite(last.std) && last.std >= 0){
          html += resultWarning(last.usage, (function(){
            const notFinite = !isFinite(last.usage);
            if(hasWater && last.water >= 100){
              return `因為「分析號碼 ${Y}」填入的水份%（${fmtStepNum(last.water)}%）已經達到或超過 100%，導致 (100−水份%) 變成 0${notFinite ? '' : '或負數'}，使得使用量${notFinite ? '變成無限大（除以 0）' : '反推出負值'}；請確認水份%的數字是否填錯`;
            }
            if(hasContent && last.content <= 0){
              return `因為「分析號碼 ${Y}」填入的${cLabelClean}（${fmtStepNum(displayContent(last))}${cUnit === '%' ? '%' : ''}）是 0 或負數，導致換算出來的使用量${notFinite ? '變成無限大或無效值' : '變成負值'}；請確認這個數字是否填錯`;
            }
            return `${priorValueLabel} ${Y}雖然不是負數，但含量／水份等係數換算後讓使用量變成負數，可能是「${cLabelClean}」或「水份」的數字填反了、或單位不對`;
          })());
        }
      }
      html += `</div>`;
    }

    return html;
  }

  // 針對單一品名，組出完整推導過程（一般型／補差型都支援）
  function buildDerivationForProduct(p){
    const rows = resultsState[p.key];
    if(!rows || !rows.length){
      return `<div class="deriv-empty">尚未計算「${p.name}」，請先按「計算」才能顯示推導過程。</div>`;
    }
    const isComplement = (p.type === 'complement');

    if(!isComplement){
      return explainStandardSteps(p, rows, '標準值', p.standardTotal, p.standardUnit, false);
    }

    const ref = products.find(x => x.name === p.referTo);
    const refRows = ref ? resultsState[ref.key] : null;
    if(!ref || !refRows || !refRows.length){
      return `<div class="deriv-empty">「${p.name}」需要先計算「${p.referTo}」，才能顯示推導過程。</div>`;
    }

    const isIncrease = (p.complementMode === 'increase');
    const isSingleGroup = (rows.length === 1);
    const Y = rows.length;
    const knownCount = Y - 1;
    const refUsageLabelForIntro = (refRows.length > 1) ? '總使用量' : '使用量';
    const deductionLabel = isIncrease ? `「${p.referTo}」增加量` : `「${p.referTo}」${refUsageLabelForIntro}`;

    // 開頭先用一句話講清楚這個分析號碼的使用量整體是怎麼算出來的，
    // 位置跟一般型品名（例如 Berberine Chloride）的說明放在同一個地方
    // ——緊接在品名標題分隔線下方，直接對應到「標準值(g)」這個使用者
    // 自己填的欄位，不再用「動態標準總量」「總使用量」這種另外發明的
    // 中介名詞，避免名詞太多看起來更混亂。
    // 用「第X個分析號碼」（X=總組數）取代「最後1個」，跟其他地方統一
    // 用編號稱呼組別的方式一致；只有 1 組已知資料時，直接點名「第1個
    // 分析號碼使用量」，不用「加總」這種聽起來像多筆加總的說法（只有
    // 一個數字，談不上「加總」）。
    const subjectPhrase = isSingleGroup ? `「${p.name}」的使用量` : `「${p.name}」第 ${Y} 個分析號碼的使用量`;
    let introText = `${subjectPhrase}是用「${p.name}」標準值${p.complementUnit ? `(${p.complementUnit})` : ''} ${paren(fmtStepNum(p.complementTotal))} 扣掉${deductionLabel}`;
    if(knownCount === 1){
      introText += `、及扣掉「${p.name}」第 1 個分析號碼使用量`;
    } else if(knownCount >= 2){
      introText += `、及扣掉「${p.name}」第 1～${knownCount} 個分析號碼使用量的加總`;
    }
    introText += `算出。`;
    let html = `<div class="deriv-line deriv-intro">${introText}</div>`;

    // 「Berberine Chloride」總使用量／增加量這兩個數字本身其實是參照品名
    // 自己的東西，跟這個品名（Potato Starch）沒有直接關係，只是被拿來當
    // 扣減項而已，所以移到參照品名自己的推導區塊裡顯示（見
    // buildReferencedBySummaryHtml），這裡只需要用到算出來的數值。
    const refTotalUsage = refRows.reduce((s,r) => s + r.usage, 0);
    let deduction;
    if(isIncrease){
      deduction = refTotalUsage - ref.standardTotal;
    } else {
      deduction = refTotalUsage;
    }

    // 直接把「標準值(g)」跟「扣掉參照品名的增加量」這兩件事，交給
    // explainStandardSteps 用 extraDeduction 參數一次展開成完整公式，
    // 不需要另外算出、顯示一個「動態標準總量」這種中介數字。
    const extraDeduction = { label: deductionLabel, value: deduction };
    html += explainStandardSteps(p, rows, `「${p.name}」標準值${p.complementUnit ? `(${p.complementUnit})` : ''}`, p.complementTotal, '', true, extraDeduction);
    return html;
  }

  // 「Berberine Chloride」這種被其他品名參照的品名，在自己的推導區塊
  // 最後一個分析號碼之後，加一條虛線分隔，接著顯示「總使用量」（以及
  // 「增加量」模式的話再加一行「增加量」），這兩個數字是參照它的品名
  // （例如 Potato Starch）計算時會用到的扣減項。
  function buildReferencedBySummaryHtml(refProduct){
    const refRows = resultsState[refProduct.key];
    if(!refRows || !refRows.length) return '';
    const dependents = products.filter(q => q.type === 'complement' && q.referTo === refProduct.name);
    if(!dependents.length) return '';

    const refTotalUsage = refRows.reduce((s,r) => s + r.usage, 0);
    const refIsInvalid = !isFinite(refTotalUsage);
    let html = '<div class="deriv-refblock">';

    if(refRows.length > 1){
      const refUsageTerms = refRows.map(r => fmtStepNum(r.usage)).join(' + ');
      html += `<div class="deriv-formula deriv-refsum">「${refProduct.name}」總使用量 = ${refUsageTerms} = ${fmtStepNum(refTotalUsage)}</div>`;
    }
    if(refIsInvalid){
      html += `<div class="deriv-warning">⚠ 「${refProduct.name}」的總使用量不是有效數字（${isNaN(refTotalUsage) ? 'NaN' : (refTotalUsage > 0 ? 'Infinity' : '-Infinity')}）：代表「${refProduct.name}」自己的計算過程中有除以 0 的情況（通常是水份%填到 100%、或含量%填成 0）。請先往上檢查「${refProduct.name}」的推導過程，把數字改正確，其他參照這個品名的計算才會有意義。</div>`;
    }

    // 只顯示一次「增加量」（如果有依賴品名用 increase 模式）；理論上
    // 目前每個品名最多只會被一個補差型品名參照，這裡用第一個找到的即可。
    const increaseDependent = dependents.find(q => q.complementMode === 'increase');
    if(increaseDependent && !refIsInvalid){
      const refTotalLabel = (refRows.length > 1) ? '總標準值' : '標準值';
      // 只有 1 個分析號碼時，這個數字根本沒有「加總」的動作，直接就是那一組
      // 自己的使用量，叫「總使用量」會造成誤解（看起來像加總過），改叫「使用量」。
      const refUsageLabel = (refRows.length > 1) ? '總使用量' : '使用量';
      const increaseAmount = refTotalUsage - refProduct.standardTotal;
      html += `<div class="deriv-formula deriv-refsum">「${refProduct.name}」增加量 = ${refUsageLabel}${paren(fmtStepNum(refTotalUsage))} − ${refTotalLabel}${paren(fmtStepNum(refProduct.standardTotal))} = ${fmtStepNum(increaseAmount)}</div>`;
    }

    html += '</div>';
    return html;
  }

  // 組出目前項目底下所有品名的推導過程，並依「品名1／品名2」或單一「品名」標示
  function renderDerivationPanel(){
    let html = '';
    products.forEach((p, idx) => {
      const label = products.length > 1 ? `品名${idx+1}：${p.name}` : `品名：${p.name}`;
      html += `<div class="deriv-product"><div class="deriv-product-title">${label}</div>${buildDerivationForProduct(p)}${buildReferencedBySummaryHtml(p)}</div>`;
    });
    derivationPanel.innerHTML = html;
  }

  function renderResults(){
    let rows = '';
    products.forEach((p, idx) => {
      const data = resultsState[p.key];
      if(!data) return;
      const nameLabel = `品名${idx+1}`;
      data.forEach((row, i) => {
        const isLast = (i === data.length-1);
        rows += `
          <tr class="${isLast ? 'last-row' : ''}">
            ${products.length > 1 ? `<td class="product-name">${i===0 ? nameLabel : ''}</td>` : ''}
            <td class="col-analysis">${i+1}</td>
            <td>${isLast ? `<span class="usage-last">${fmtDisplayNum(row.usage)}</span>` : fmtDisplayNum(row.usage)}${row.usage===null||row.usage===undefined||isNaN(row.usage) ? '' : ` <span class="usage-unit">${usageUnitOf(p)}</span>`}</td>
            ${p._anyContent ? `<td>${row.content===null ? '—' : fmtDisplayNum(p.contentIsPercentOfRatio ? row.contentPercent : row.content)}</td>` : ''}
            ${p._anyWater ? `<td>${row.water===null ? '—' : fmtDisplayNum(row.water)}</td>` : ''}
            ${p._anyRowRatio ? `<td>${row.ratio===null||row.ratio===undefined ? '—' : fmtDisplayNum(row.ratio)}</td>` : ''}
            <td>${row.std===null ? '—' : fmtDisplayNum(row.std)}</td>
          </tr>
        `;
      });
    });
    resultBody.innerHTML = rows;
    const anyResult = products.some(p => resultsState[p.key]);
    resultCard.classList.toggle('hidden', !anyResult);

    // 若目前已經算出結果的品名，全部都只有 1 組（分析號碼數量=1），
    // 「分析號碼」這一欄就沒有意義（永遠都是 1），整欄隱藏起來。
    // 只要有任何一個品名分了 2 組以上，這一欄還是要顯示，方便對照。
    const computedLengths = products.map(p => resultsState[p.key]).filter(Boolean).map(d => d.length);
    const allSingleGroup = computedLengths.length > 0 && computedLengths.every(len => len === 1);
    document.querySelectorAll('.col-analysis').forEach(el => {
      el.classList.toggle('hidden', allSingleGroup);
    });

    // 若「推導過程」面板目前是打開的，計算結果一有變動就順便重畫，
    // 避免使用者看到跟目前結果不一致的舊推導內容。
    if(derivationPanel && !derivationPanel.classList.contains('hidden')){
      renderDerivationPanel();
    }
  }

  // =========================================================
  // 複製結果：把計算結果表格（以及目前有打開的推導過程）整理成一段
  // 純文字，方便直接貼到 Line／Email 給同事，不用截圖。
  // =========================================================
  function buildCopyText(){
    const proj = PROJECTS.find(pr => pr.id === currentProjectId);
    const lines = [];
    const titleLine = proj && proj.nameCn ? `${proj.label}（${proj.nameCn}）` : (proj ? proj.label : '');
    lines.push(`【${titleLine}】計算結果`);
    lines.push('');

    products.forEach((p, idx) => {
      const data = resultsState[p.key];
      if(!data) return;
      lines.push(products.length > 1 ? `品名${idx+1}：${p.name}` : `品名：${p.name}`);
      const bcCopy = getBasisCfg(p);
      data.forEach((row, i) => {
        const isLast = (i === data.length - 1);
        const parts = [`使用量 ${fmtDisplayNum(row.usage)}${isLast ? '(自動回推)' : ''}`];
        if(row.content !== null){
          const cLabel = ((bcCopy && bcCopy.contentLabel) || p.contentLabel || '含量%').replace(/%$/, '');
          const cUnit = (p.contentUnit != null ? p.contentUnit : '%');
          const contentForCopy = p.contentIsPercentOfRatio ? row.contentPercent : row.content;
          parts.push(`${cLabel}${cUnit === '%' ? '%' : ''} ${fmtDisplayNum(contentForCopy)}${cUnit !== '%' ? ' ' + cUnit : ''}`);
        }
        if(row.water !== null) parts.push(`水份% ${fmtDisplayNum(row.water)}`);
        if(p.rowRatio && row.ratio !== null && row.ratio !== undefined){
          const rLabel = (bcCopy && bcCopy.rowRatioLabel) || p.rowRatioLabel || '力價%';
          parts.push(`${rLabel} ${fmtDisplayNum(row.ratio)}`);
        }
        if(row.std !== null) parts.push(`標準值 ${fmtDisplayNum(row.std)}`);
        lines.push(`分析號碼${i+1}: ${parts.join(', ')}`);
      });
      lines.push('');
    });

    lines.push('※本結果僅供輔助參考，需人工複核。');
    return lines.join('\n').trim();
  }

  async function copyResultsToClipboard(){
    const text = buildCopyText();
    try{
      await navigator.clipboard.writeText(text);
      return true;
    } catch(e){
      // 部分手機瀏覽器／webview 不支援 navigator.clipboard，改用傳統
      // textarea + execCommand 當備援方案。
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch(e2){
        return false;
      }
    }
  }

  if(copyResultBtn){
    const copyBtnDefaultText = copyResultBtn.textContent;
    copyResultBtn.addEventListener('click', async function(){
      const ok = await copyResultsToClipboard();
      copyResultBtn.textContent = ok ? '✓ 已複製' : '✗ 複製失敗，請手動選取';
      copyResultBtn.classList.toggle('copied', ok);
      setTimeout(() => {
        copyResultBtn.textContent = copyBtnDefaultText;
        copyResultBtn.classList.remove('copied');
      }, 1500);
    });
  }

  // =========================================================
  // 匯出紀錄單（可存成PDF）：把計算結果表格＋推導過程整理成一張
  // 適合列印／存PDF的頁面。匯出前一定要先輸入批號，沒有批號不給匯出。
  // 實作方式：把內容組成 HTML 塞進頁面裡一個平常藏在畫面外的
  // #printArea，然後呼叫瀏覽器原生的 window.print()，使用者在列印
  // 對話框裡選「另存為PDF」即可，不需要額外的PDF程式庫。
  // =========================================================
  const exportPdfBtn = document.getElementById('exportPdfBtn');
  const exportModalBackdrop = document.getElementById('exportModalBackdrop');
  const exportBatchInput = document.getElementById('exportBatchInput');
  const exportBatchError = document.getElementById('exportBatchError');
  const exportBatchClear = document.getElementById('exportBatchClear');
  const exportModalCancel = document.getElementById('exportModalCancel');
  const exportModalConfirm = document.getElementById('exportModalConfirm');
  const exportIncludeDerivation = document.getElementById('exportIncludeDerivation');
  const exportKeepBlocks = document.getElementById('exportKeepBlocks');
  const exportWeighDate = document.getElementById('exportWeighDate');
  const exportNameOverrideRow = document.getElementById('exportNameOverrideRow');
  const exportNameOverride = document.getElementById('exportNameOverride');
  const printArea = document.getElementById('printArea');

  // 批號輸入框要有記憶性：開啟彈窗時自動帶入「上次匯出時輸入的批號」，
  // 不用每次都重打一次（很多時候同一批料會連續匯出好幾份紀錄單）。
  function loadLastExportBatch(){
    const all = loadAll();
    return all.lastExportBatch || '';
  }
  function saveLastExportBatch(batchNo){
    const all = loadAll();
    all.lastExportBatch = batchNo;
    saveAll(all);
  }

  // keepChoices=true：保留使用者上一次在這個彈窗選的內容（從列印預覽
  // 返回時用這個，讓人可以直接改選項再匯出一次，不用整組重填）。
  function openExportModal(keepChoices){
    if(!keepChoices) exportBatchInput.value = loadLastExportBatch();
    exportBatchError.classList.add('hidden');
    if(!keepChoices){
      // 是否列印/匯出推導過程，每次打開彈窗都重設回「沒勾」，避免上次
      // 勾了什麼，這次沒注意到又照樣印出一大段推導過程。
      exportIncludeDerivation.checked = false;
      // 預設不勾：任何位置都可以斷開，優先把每一頁填滿
      exportKeepBlocks.checked = false;
      // 秤量日期預設帶入今天，使用者可以自己改成實際秤量的日期
      // （不一定跟按下「匯出」的當下同一天）。
      exportWeighDate.value = todayDateStr();
    }
    // 秤量日期一律確保有值（即使是保留上次選擇的情況），預設就是今天
    if(!exportWeighDate.value) exportWeighDate.value = todayDateStr();
    // NAZAL SPRAY 這種系列產品才會有 nameVariants，下拉選單只在這種
    // 項目底下才顯示；其他項目完全看不到這一列，維持原本的匯出流程。
    const proj = PROJECTS.find(pr => pr.id === currentProjectId);
    if(proj && proj.nameVariants && proj.nameVariants.length){
      const prev = exportNameOverride.value;
      exportNameOverride.innerHTML = proj.nameVariants

    if(!keepChoices){

    exportBatchInput.setAttribute('readonly', 'readonly');

  // 使用者一碰輸入框就解除唯讀，讓鍵盤照常彈出
  function unlockBatchInput(){

  // =========================================================
  // 圖片示意圖彈窗：目前有兩種用途——
  //   1) 公式框裡「標示值」按鈕：顯示原料標籤照片（p.declaredValueImageKey）
  //   2) 「範例」按鈕：顯示手寫計算過程範例照片（p.exampleImageKey）
  // 兩種都對應到設定區 IU_DIAGRAMS 常數裡的一張圖，還沒有圖檔時顯示

  const iuDiagramBackdrop = document.getElementById('iuDiagramBackdrop');

  // 公式框裡「標示值」那個內嵌按鈕（btn-inline-declared）用事件代理監聽：

  document.addEventListener('click', function(e){

  // 組出每個品名的推導過程 HTML，跟畫面上「推導過程」按鈕打開的內容
  // 完全同一套邏輯（buildDerivationForProduct），確保匯出的紀錄單
  // 跟畫面上看到的一致，不會另外維護一份不同步的版本。額外在每個品名
  // 推導過程最前面，多放一份「公式框」（跟品名卡片上方看到的一樣），
  // 讓紀錄單同時包含「這個品名的公式長怎樣」跟「這次數字怎麼代入算出來的」。
  //
  // 注意：showDerivation 是設定在「項目」（PROJECTS 裡的每一筆）上面，
  // 不是設定在個別「品名」（products 陣列裡的每一筆）上面，所以這裡要
  // 判斷的是目前項目的 showDerivation，不能誤判成 p.showDerivation
  // （後者永遠是 undefined，之前就是因為判斷錯欄位，才會讓匯出的紀錄單
  // 完全沒有推導過程內容）。
  // onlyProduct：只要某一個品名的推導過程（Excel 匯出時，推導過程是
  // 直接塞進該品名自己那張工作表的「補正換算公式」框裡，所以要能單獨
  // 取出一個品名的內容）。不傳就是全部品名。
  function buildDerivationHtmlForExport(onlyProduct){
    const proj = PROJECTS.find(pr => pr.id === currentProjectId);
    if(!proj || !proj.showDerivation) return '';
    let html = '';
    products.forEach((p, idx) => {
      if(!resultsState[p.key]) return;
      if(onlyProduct && p !== onlyProduct) return;
      const label = products.length > 1 ? `品名${idx+1}：${p.name}` : `品名：${p.name}`;
      const { formulaHtml, subFormulaHtml, noteLineHtml, formulaIntroHtml } = buildFormulaBoxParts(p, true);
      const formulaBoxHtml = `
        <div class="print-formula-box">
          ${formulaIntroHtml}
          ${noteLineHtml}
          <div class="formula-row">${formulaHtml}</div>
          ${subFormulaHtml ? `<div class="formula-row">${subFormulaHtml}</div>` : ''}
        </div>
      `;
      // 每個品名自己的推導過程（標題＋公式框＋逐步計算）包成一個獨立區塊，
      // 加上「避免區塊內斷頁」，這樣印出來如果這個品名整段內容在頁尾
      // 放不下，會整段一起換到下一頁，不會被硬生生從中間切成兩半。
      html += `<div class="print-deriv-block">
        <div class="print-derivation-title">${label}　推導過程</div>
        ${formulaBoxHtml}${buildDerivationForProduct(p)}${buildReferencedBySummaryHtml(p)}
      </div>`;
    });
    return html;
  }

  function buildExportHtml(batchNo, includeDerivation, weighDate, nameOverride){

    // 畫面上的下拉選單方便使用者辨識用，紀錄單本身跟歷史上的紙本表單
    // 一樣只寫英文品名）。NAZAL SPRAY 系列產品共用同一份設定跟公式，
    // 但實際批次可能是其中哪一個變體，所以匯出時另外用 nameOverride
    // （彈窗裡那個下拉選單選的名稱）取代，沒有選的話才退回 proj.label。
    const titleLine = nameOverride || (proj ? proj.label : '');

    // 品名／品名1／品名2 對照（跟畫面上表格正上方那排「品名：ＸＸＸ」的
    // 說明文字直接複製過來），確保紀錄單上看得到完整品名全名，不是只有
    // 表格欄位裡「品名1」「品名2」這種縮寫代號。
    const nameLegendClone = nameLegend.outerHTML;

    // 結果表格直接複製畫面上現成算好的那張表（含表頭），保證跟畫面
    // 顯示的內容一字不差，不用另外重寫一次判斷含量/水份/力價欄位的邏輯。
    const tableClone = resultCard.querySelector('table').outerHTML;

    // 推導過程是否要一起匯出，由彈窗裡的勾選框決定，沒勾就整段略過。
    const derivationHtml = includeDerivation ? buildDerivationHtmlForExport() : '';

    // 簽名欄只顯示一次，放在「計算結果」表格正下方（不用每頁重複、
    // 也不用包成表格 thead/tfoot 那種複雜結構，回到單純的區塊排版）。
    const signoffHtml = `
      <div class="print-signoff">
        <span>作業者：＿＿＿＿＿＿＿＿</span>
        <span>覆核者：＿＿＿＿＿＿＿＿</span>
      </div>
    `;

    // 紀錄單最下面固定要放的簽核規範文字，逐行編號、靠左對齊。
    const termsHtml = `
      <div class="print-terms">
        <div>1. 作業者填寫上述資料，先自行計算後再找幹部覆核。</div>
        <div>2. 作業者需提供完整資訊給覆核者(原料換算項目、QC試驗報告、秤量頁、原料傳票、使用殘量)。</div>
        <div>3. 數據及公式換算內容經簽名後代表雙方認同無誤。</div>
        <div>4. 日後如發現錯誤，調查屬其中一方之錯誤，應承擔偏差報告之職責。</div>
        <div>5. 此文件至少保留一年後銷毀。</div>

    return `
      <div class="print-title">原料換算項目</div>

      <div class="print-title-rule"></div>
      <div class="print-meta">
        <span>製品名：${titleLine}</span>
        <span class="print-weigh-date">秤量日期：${dateStr}</span>
      </div>
      <div class="print-product">
        <h2>計算結果</h2>

      <div class="print-footer">
        ※本結果僅供輔助參考，不能取代人工複核，請依原始公式與數據自行人工複算並找幹部覆核。
